name: Finance / Cash / Capital Allocation Pack (DB + Browser + Mobile)

# Proof that all 120 counted Finance/Cash/Capital-Allocation scenarios run through the REAL DB-backed owner plan
# path and render the runtime-fed Supervisor Summary in a real browser (desktop + mobile). OpsIQ protects cash/
# margin/payroll/debt/capital: cash-critical owner-gates, missing figures block, tax/legal/financing/compliance
# block or professional-gate, only routine within-threshold actions proceed. Additive lane; does NOT modify any
# existing workflow.

on:
  workflow_dispatch:

jobs:
  fin-db:
    name: All-120 Finance/Cash DB-backed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPSIQ_DB_TARGET: ci
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      TEST_WITH_DB: "true"
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: opsiq_test }
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 10s
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: npm }
      - run: npm ci
      - name: Prisma migrate + generate
        run: |
          npx prisma migrate deploy
          npx prisma generate
      - name: Finance schema + invariant tests
        run: npx vitest run src/__tests__/scenarios/finance-cash-pack.test.ts
      - name: All-120 Finance DB-backed proof
        run: npx vitest run src/__tests__/scenarios/finance-cash-db.db.test.ts
      - name: Assert Finance DB covered exactly 120
        run: |
          node -e '
            const d=require("./OPSIQ_FINANCE_CASH_PACK.run.json");
            const pass=Object.values(d.results).filter(r=>r.dbStatus==="pass").length;
            if(d.count!==120||pass!==120){console.error("FIN DB not 120/120:",d.count,pass);process.exit(1);}
            console.log("FIN DB 120/120 OK");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fin-db-ledger
          path: OPSIQ_FINANCE_CASH_PACK.run.json
          retention-days: 7

  fin-browser:
    name: All-120 Finance/Cash desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      OPSIQ_DB_TARGET: ci
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      AUTH_SECRET: e2e-test-auth-secret-not-a-real-secret
      AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      BASE_URL: http://localhost:3001
      TEST_WITH_DB: "true"
      FIN_SHARD_INDEX: ${{ matrix.shard }}
      FIN_SHARD_TOTAL: 2
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: opsiq_test }
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 10s
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: npm }
      - run: npm ci
      - name: Configure .env.local
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          AUTH_SECRET=e2e-test-auth-secret-not-a-real-secret
          AUTH_URL=http://localhost:3001
          NEXT_PUBLIC_APP_URL=http://localhost:3001
          TEST_WITH_DB=true
          EOF
      - name: Prisma migrate + generate
        run: |
          npx prisma migrate deploy
          npx prisma generate
      - name: Build app
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Seed all 120 Finance businesses
        run: npx tsx scripts/seed-finance-cash-e2e.ts
      - name: Start app
        run: |
          PORT=3001 npm run start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login || echo 000)
            if [ "$code" != "000" ]; then echo "app up (HTTP $code)"; break; fi
            sleep 2
          done
      - name: Finance desktop shard ${{ matrix.shard }}/2
        run: npx playwright test tests/browser/29-finance-desktop.spec.ts --project=chromium
      - name: Finance mobile shard ${{ matrix.shard }}/2
        run: npx playwright test tests/browser/30-finance-mobile.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fin-browser-shard-${{ matrix.shard }}
          path: "OPSIQ_FINANCE_CASH_*.run.json"
          retention-days: 7
