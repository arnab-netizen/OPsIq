name: Production DB Status — Read Only

# Read-only inspection of the production database. It answers one question:
# what is actually recorded in _prisma_migrations, and what does the live
# schema actually look like, for the migration files currently committed on
# main.
#
# This workflow performs no database writes of any kind. Every direct SQL
# statement below is a SELECT against _prisma_migrations, information_schema,
# or pg_catalog. The session additionally sets default_transaction_read_only
# so Postgres itself rejects any accidental write, independent of what the
# script contains.
#
# It always checks out main (pinned explicitly, never an input-selected ref)
# so it can never execute code from an unmerged branch or pull request.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "INSPECT PRODUCTION READ ONLY" to confirm'
        required: true
        type: string

concurrency:
  group: production-db-status
  cancel-in-progress: false

jobs:
  status:
    name: Read Production Migration + Schema Status (read-only)
    if: github.event.inputs.confirm == 'INSPECT PRODUCTION READ ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Confirm explicit intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "INSPECT PRODUCTION READ ONLY" ]; then
            echo "::error::Confirmation phrase not matched. Aborting."
            exit 1
          fi
          echo "Explicit confirmation received"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Print checked-out SHA
        run: |
          echo "Checked-out SHA: $(git rev-parse HEAD)"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Preflight check - PRODUCTION_DATABASE_URL secret exists
        run: |
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "::error::PRODUCTION_DATABASE_URL secret is missing or empty"
            exit 1
          fi
          echo "PRODUCTION_DATABASE_URL secret is configured"

      - name: Remove local environment files
        run: |
          rm -f .env .env.local .env.production .env.staging .env.postgres .env.local.bak
          echo "Removed all local .env files to prevent placeholder contamination"

      - name: Validate DATABASE_URL safety (metadata only, no secret printed)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if echo "$DATABASE_URL" | grep -qE 'REPLACE_|PLACEHOLDER|your_neon_url|example\.com'; then
            echo "::error::DATABASE_URL contains placeholder value - secret not properly configured"
            exit 1
          fi
          DB_HOST=$(node -e "try { const u = new URL(process.env.DATABASE_URL); console.log(u.hostname); } catch(e) { console.log('unparseable'); }")
          DB_NAME=$(node -e "try { const u = new URL(process.env.DATABASE_URL); console.log(u.pathname.replace(/^\//, '')); } catch(e) { console.log('unparseable'); }")
          echo "Database host: $DB_HOST"
          echo "Database name: $DB_NAME"
          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"

      - name: Query production migration history (SELECT only)
        env:
          PROD_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          # Enforce read-only at the Postgres session level: Postgres itself
          # rejects any write attempt regardless of what a query contains.
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          echo "=== _prisma_migrations rows for the eight candidate migrations ==="
          # 20260819000001_startup_session_business_handoff is included even
          # though its migration folder does not exist on main yet (PR #326
          # is unmerged) -- it was applied to production via migrate-production.yml's
          # PINNED_PREDEPLOY mode ahead of that PR's merge, per owner authorization.
          # The local-checksum step below correctly reports it MISSING_ON_MAIN
          # until #326 merges; that is the expected transient state, not an error.
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT
              migration_name,
              started_at,
              finished_at,
              rolled_back_at,
              applied_steps_count,
              checksum
            FROM _prisma_migrations
            WHERE migration_name IN (
              '20260807000001_operator_items_outcome_fields',
              '20260808000001_operator_items_time_to_value_fields',
              '20260811000001_finance_snapshot_total_debt_outstanding',
              '20260813000001_snapshot_amendment',
              '20260813000002_finance_outcome_signals',
              '20260814000001_finance_signal_clc_link_text',
              '20260816000001_startup_status_claim_token',
              '20260819000001_startup_session_business_handoff'
            )
            ORDER BY migration_name;
          "

      - name: Query live schema state (SELECT only)
        env:
          PROD_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          echo "--- operator_items outcome fields ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT column_name, data_type, is_nullable, column_default
            FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'operator_items'
              AND column_name IN (
                'decision_type','problem_type','baseline_value',
                'projected_without_action','outcome_delta','decision_accuracy',
                'decision_error','executed_at','executed_by'
              )
            ORDER BY column_name;
          "

          echo "--- operator_items time-to-value fields ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT column_name, data_type, is_nullable, column_default
            FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'operator_items'
              AND column_name IN (
                'first_completed_at','first_positive_outcome_at','first_win_achieved'
              )
            ORDER BY column_name;
          "

          echo "--- owner_financial_snapshots.total_debt_outstanding ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT column_name, data_type, is_nullable, column_default
            FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'owner_financial_snapshots'
              AND column_name = 'total_debt_outstanding';
          "

          echo "--- owner_financial_snapshots amendment fields ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT column_name, data_type, is_nullable, column_default
            FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'owner_financial_snapshots'
              AND column_name IN (
                'version','superseded_by_id','amendment_reason',
                'changed_fields','amended_by_actor_id'
              )
            ORDER BY column_name;
          "

          echo "--- owner_financial_snapshots: prior single-version unique index ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT EXISTS (
              SELECT 1 FROM pg_indexes WHERE schemaname='public'
              AND indexname='owner_fin_snapshots_business_period_key'
            );
          "

          echo "--- owner_financial_snapshots: version-aware unique constraint ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT EXISTS (
              SELECT 1 FROM information_schema.table_constraints
              WHERE table_schema='public' AND table_name='owner_financial_snapshots'
              AND constraint_name='owner_fin_snapshots_bus_period_version_key'
              AND constraint_type='UNIQUE'
            );
          "

          echo "--- owner_financial_snapshots: superseded_by lookup index ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT EXISTS (
              SELECT 1 FROM pg_indexes WHERE schemaname='public'
              AND indexname='owner_financial_snapshots_business_id_superseded_by_id_idx'
            );
          "

          echo "--- owner_finance_outcome_signals table presence ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT EXISTS (
              SELECT 1 FROM information_schema.tables
              WHERE table_schema='public' AND table_name='owner_finance_outcome_signals'
            );
          "

          echo "--- owner_finance_outcome_signals columns (if present) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT column_name, data_type
            FROM information_schema.columns
            WHERE table_schema='public' AND table_name='owner_finance_outcome_signals'
            ORDER BY ordinal_position;
          "

          echo "--- owner_finance_outcome_signals.learning_candidate_id type ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT COALESCE(data_type, 'COLUMN_ABSENT')
            FROM information_schema.columns
            WHERE table_schema='public' AND table_name='owner_finance_outcome_signals'
              AND column_name='learning_candidate_id';
          "

          echo "--- startup_status.claim_token ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT column_name, data_type, is_nullable, column_default
            FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'startup_status'
              AND column_name = 'claim_token';
          "

          echo "--- owner_startup_session.business_id (F-STARTUP-NO-HANDOFF, PR #326) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT column_name, data_type, is_nullable, column_default
            FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'owner_startup_session'
              AND column_name = 'business_id';
          "

          echo "--- owner_startup_session_business_id_key index definition (must show UNIQUE) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT indexname, indexdef
            FROM pg_indexes
            WHERE schemaname = 'public' AND indexname = 'owner_startup_session_business_id_key';
          "

          echo "--- owner_startup_session row count and non-null business_id count ---"
          echo "--- (this migration is purely additive; pre/post row count must be identical," \
               "and business_id must be NULL on every existing row since no code that writes it has merged) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT
              COUNT(*) AS total_rows,
              COUNT(*) FILTER (WHERE business_id IS NOT NULL) AS non_null_business_id_rows
            FROM owner_startup_session;
          "

      - name: Query approval_requests workspace-anchor forensics (SELECT only)
        # SCHEMA-01 forensics for 20260824000001_approval_request_workspace_anchor (PR #351).
        # Originally written pre-migration (workspace_id absent, PR #351 unmerged); the migration
        # was subsequently applied to production via migrate-production.yml's PINNED_PREDEPLOY
        # mode ahead of PR #351's merge, per owner authorization (run 32730772782,
        # 2026-08-24T13:08:05Z). The first four queries below remain valid as an ongoing baseline
        # check regardless of migration state (column presence now reads its post-migration type
        # instead of COLUMN_ABSENT; the unmappable-row query and row count are unaffected).
        #
        # The four queries after that are POST-migration structural proof, added to close a gap
        # migrate-production.yml's own verify-pinned-migration.mjs does not cover: that script
        # only confirms the _prisma_migrations row for the migration name; it does not
        # independently query approval_requests_workspace_id_idx, the
        # approval_requests_workspace_id_fkey identity/target, or the post-NOT-NULL data state.
        # Read-only, single hardcoded statement per query (no arbitrary SQL), same pattern as
        # every other query in this file.
        env:
          PROD_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          echo "--- approval_requests.workspace_id column presence/type ---"
          echo "--- (data type printed if present; COLUMN_ABSENT reads as zero output rows below," \
               "since the WHERE clause matches no information_schema.columns row when the column" \
               "does not exist -- COALESCE never gets a row to apply to in that case) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT COALESCE(data_type, 'COLUMN_ABSENT')
            FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'approval_requests'
              AND column_name = 'workspace_id';
          "

          echo "--- approval_requests row count ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT COUNT(*) FROM approval_requests;
          "

          echo "--- approval_requests unmappable-row count (must be 0) ---"
          echo "--- a row is unmappable if its operator_item_id has no matching operator_items row," \
               "or that operator_items row has a NULL workspace_id ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT COUNT(*)
            FROM approval_requests ar
            LEFT JOIN operator_items oi ON oi.id = ar.operator_item_id
            WHERE oi.id IS NULL OR oi.workspace_id IS NULL;
          "

          echo "--- any currently-pending migration, of any name (baseline sanity check) ---"
          echo "--- expected: zero rows right now, since 20260824000001_approval_request_workspace_anchor" \
               "is not yet on main -- prisma migrate status (next step) is the authoritative check" \
               "once it lands ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT migration_name, started_at, finished_at, rolled_back_at
            FROM _prisma_migrations
            WHERE finished_at IS NULL
            ORDER BY started_at;
          "

          echo "--- approval_requests_workspace_id_idx (expected exactly 1 row, covering workspace_id) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT indexname, indexdef
            FROM pg_indexes
            WHERE schemaname = 'public'
              AND tablename = 'approval_requests'
              AND indexname = 'approval_requests_workspace_id_idx';
          "

          echo "--- approval_requests_workspace_id_fkey identity (source/target columns + actions, not just name) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT
              con.conname AS constraint_name,
              CASE con.contype WHEN 'f' THEN 'FOREIGN KEY' ELSE con.contype::text END AS constraint_type,
              rel.relname AS source_table,
              att.attname AS source_column,
              frel.relname AS target_table,
              fatt.attname AS target_column,
              CASE con.confdeltype
                WHEN 'a' THEN 'NO ACTION' WHEN 'r' THEN 'RESTRICT' WHEN 'c' THEN 'CASCADE'
                WHEN 'n' THEN 'SET NULL' WHEN 'd' THEN 'SET DEFAULT' ELSE con.confdeltype::text
              END AS delete_action,
              CASE con.confupdtype
                WHEN 'a' THEN 'NO ACTION' WHEN 'r' THEN 'RESTRICT' WHEN 'c' THEN 'CASCADE'
                WHEN 'n' THEN 'SET NULL' WHEN 'd' THEN 'SET DEFAULT' ELSE con.confupdtype::text
              END AS update_action
            FROM pg_constraint con
            JOIN pg_namespace ns ON ns.oid = con.connamespace
            JOIN pg_class rel ON rel.oid = con.conrelid
            JOIN pg_class frel ON frel.oid = con.confrelid
            JOIN pg_attribute att ON att.attrelid = con.conrelid AND att.attnum = con.conkey[1]
            JOIN pg_attribute fatt ON fatt.attrelid = con.confrelid AND fatt.attnum = con.confkey[1]
            WHERE ns.nspname = 'public'
              AND con.conname = 'approval_requests_workspace_id_fkey';
          "

          echo "--- approval_requests rows with a NULL workspace_id (must be 0; post-NOT-NULL data-state proof, distinct from the unmappable-row query above) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT COUNT(*) FROM approval_requests WHERE workspace_id IS NULL;
          "

          echo "--- 20260824000001_approval_request_workspace_anchor applied-migration row (expected exactly 1, finished_at set, rolled_back_at null) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT migration_name, finished_at, rolled_back_at, applied_steps_count
            FROM _prisma_migrations
            WHERE migration_name = '20260824000001_approval_request_workspace_anchor';
          "

      - name: Query override_records workspace-anchor forensics (SELECT only)
        # SCHEMA-01 forensics for 20260825000001_override_record_workspace_anchor (PR #354, merged
        # cea1df29902668678c1bd8f05e3e730454427590). Unlike the approval_requests forensics above
        # (added AFTER that migration had already reached production via PINNED_PREDEPLOY),
        # override_records's migration has NOT yet been applied to production as of this query's
        # addition -- PR #354 is already merged, so PINNED_PREDEPLOY (which requires an OPEN,
        # UNMERGED source PR) is not the applicable mode here; MAIN mode is. Every query below is
        # therefore deliberately written to be safe in BOTH states: pre-migration (workspace_id
        # column absent) and post-migration (present, NOT NULL, indexed, FK-constrained). The same
        # workflow run serves as both the pre-migration preflight proof and, run again after the
        # owner authorizes and dispatches MAIN-mode migrate-production.yml, the post-migration
        # closure proof. Read-only, single hardcoded statement per query (no arbitrary SQL), same
        # pattern as every other query in this file.
        env:
          PROD_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail

          echo "--- A. override_records.workspace_id presence/type/nullability ---"
          echo "--- (zero output rows below IS the absence proof pre-migration -- the WHERE clause" \
               "matches no information_schema.columns row when the column does not exist) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT column_name, data_type, is_nullable, column_default
            FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'override_records'
              AND column_name = 'workspace_id';
          "

          echo "--- B. override_records total row count ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT COUNT(*) FROM override_records;
          "

          echo "--- C. override_records unmappable-row count (must be 0) ---"
          echo "--- a row is unmappable if its operator_item_id has no matching operator_items row," \
               "or that operator_items row has a NULL workspace_id -- references only" \
               "operator_item_id/operator_items.workspace_id, both of which exist regardless of" \
               "override_records' own migration state ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT COUNT(*)
            FROM override_records o
            LEFT JOIN operator_items oi
              ON oi.id = o.operator_item_id
            WHERE oi.id IS NULL
               OR oi.workspace_id IS NULL;
          "

          echo "--- D. override_records rows with workspace_id IS NULL (post-migration data-state proof) ---"
          echo "--- referencing override_records.workspace_id directly would fail to PARSE if the" \
               "column does not exist yet (unlike a missing-row information_schema lookup), so" \
               "column existence is checked first via a query that can never fail, and the NULL-count" \
               "query only runs if that check is true; both statements are static and hardcoded, the" \
               "shell only chooses which one to run ---"
          COLUMN_EXISTS=$(psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'override_records'
                AND column_name = 'workspace_id'
            );
          ")
          if [ "$COLUMN_EXISTS" = "t" ]; then
            psql "$PROD_URL" -v ON_ERROR_STOP=1 -tAc "
              SELECT COUNT(*) FROM override_records WHERE workspace_id IS NULL;
            "
          else
            echo "COLUMN_ABSENT"
          fi

          echo "--- E. 20260825000001_override_record_workspace_anchor migration state (0 rows = not yet applied/pending) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT migration_name, started_at, finished_at, rolled_back_at, applied_steps_count
            FROM _prisma_migrations
            WHERE migration_name = '20260825000001_override_record_workspace_anchor';
          "

          echo "--- F. override_records_workspace_id_idx presence (expected 0 rows pre-migration, exactly 1 post) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT indexname, indexdef
            FROM pg_indexes
            WHERE schemaname = 'public'
              AND tablename = 'override_records'
              AND indexname = 'override_records_workspace_id_idx';
          "

          echo "--- G. override_records_workspace_id_fkey identity (source/target columns + actions, not just name; expected 0 rows pre-migration, exactly 1 post) ---"
          psql "$PROD_URL" -v ON_ERROR_STOP=1 -c "
            SELECT
              con.conname AS constraint_name,
              CASE con.contype WHEN 'f' THEN 'FOREIGN KEY' ELSE con.contype::text END AS constraint_type,
              rel.relname AS source_table,
              att.attname AS source_column,
              frel.relname AS target_table,
              fatt.attname AS target_column,
              CASE con.confdeltype
                WHEN 'a' THEN 'NO ACTION' WHEN 'r' THEN 'RESTRICT' WHEN 'c' THEN 'CASCADE'
                WHEN 'n' THEN 'SET NULL' WHEN 'd' THEN 'SET DEFAULT' ELSE con.confdeltype::text
              END AS delete_action,
              CASE con.confupdtype
                WHEN 'a' THEN 'NO ACTION' WHEN 'r' THEN 'RESTRICT' WHEN 'c' THEN 'CASCADE'
                WHEN 'n' THEN 'SET NULL' WHEN 'd' THEN 'SET DEFAULT' ELSE con.confupdtype::text
              END AS update_action
            FROM pg_constraint con
            JOIN pg_namespace ns ON ns.oid = con.connamespace
            JOIN pg_class rel ON rel.oid = con.conrelid
            JOIN pg_class frel ON frel.oid = con.confrelid
            JOIN pg_attribute att ON att.attrelid = con.conrelid AND att.attnum = con.conkey[1]
            JOIN pg_attribute fatt ON fatt.attrelid = con.confrelid AND fatt.attnum = con.confkey[1]
            WHERE ns.nspname = 'public'
              AND con.conname = 'override_records_workspace_id_fkey';
          "

      - name: Local checksum of each candidate migration file on main
        run: |
          set -euo pipefail
          for f in \
            "prisma/migrations/20260807000001_operator_items_outcome_fields/migration.sql" \
            "prisma/migrations/20260808000001_operator_items_time_to_value_fields/migration.sql" \
            "prisma/migrations/20260811000001_finance_snapshot_total_debt_outstanding/migration.sql" \
            "prisma/migrations/20260813000001_snapshot_amendment/migration.sql" \
            "prisma/migrations/20260813000002_finance_outcome_signals/migration.sql" \
            "prisma/migrations/20260814000001_finance_signal_clc_link_text/migration.sql" \
            "prisma/migrations/20260816000001_startup_status_claim_token/migration.sql"; do
            if [ -f "$f" ]; then
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $f"
            else
              echo "MISSING_ON_MAIN  $f"
            fi
          done
          echo ""
          echo "Compare each hash above against the checksum column from the"
          echo "_prisma_migrations query in the previous step. The built-in"
          echo "status comparison in the next step is the authoritative check;"
          echo "this step is a supplementary, independently-computed cross-check."

      - name: Prisma migrate status (built-in, read-only comparison)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate status

      - name: Status summary
        if: always()
        run: |
          {
            echo "## Production DB Status (read only)"
            echo ""
            echo "This run performed zero writes: no schema change, no row change,"
            echo "no config change. Every statement executed was a SELECT, and the"
            echo "database session had default_transaction_read_only enabled."
            echo ""
            echo "Database host: ${DB_HOST:-unknown}"
            echo ""
            echo "See job logs above for the full _prisma_migrations and schema"
            echo "query output, and for the prisma migrate status comparison."
          } >> "$GITHUB_STEP_SUMMARY"
