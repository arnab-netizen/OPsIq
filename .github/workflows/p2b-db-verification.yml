name: P2B Database Verification

# TASK 3: Result Instruction
# PASS only if all 42 tests execute and pass
# FAIL if any test is skipped, mocked, scaffolded, or DB-bypassed
# Do not continue to P2C/P2D until this workflow passes

on:
  workflow_dispatch:
    description: 'Verify P2B database-backed tests (42 tests)'

jobs:
  p2b-db-verification:
    name: P2B Database Tests
    runs-on: ubuntu-latest

    # PostgreSQL service container
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      OPSIQ_DB_TARGET: ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      NODE_ENV: test

    steps:
      # Step 1: Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies (with optional deps for rolldown binding)
      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm ci --include=optional

      # Step 3.1: Verify rolldown native binding
      - name: Verify rolldown native binding
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu'); console.log('✓ rolldown native binding present')"

      # Step 3.5: Override .env.local with CI PostgreSQL service URL
      # Fix: prisma.config.ts loads .env.local with override: true, so we must
      # provide correct DATABASE_URL in .env.local to prevent placeholder values
      # from overriding GitHub Actions environment variables
      - name: Configure CI PostgreSQL environment
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          NODE_ENV=test
          EOF
          echo "✓ .env.local configured for CI PostgreSQL service"
          echo "Verification:"
          grep -E 'DATABASE_URL|DATABASE_URL_TEST|NODE_ENV' .env.local | sed 's/postgres:postgres@/postgres:****@/g'

      # Step 4: Prisma generate
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # Step 5: Prisma validate
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # Step 6: Prisma migrate deploy
      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # Step 7: Run the exact 42-test command with full output capture
      - name: Run P2B Database Tests (42 tests)
        run: |
          mkdir -p artifacts/p2b-db

          set +e
          npm test -- --run \
            src/__tests__/p2b/verified-lifecycle.test.ts \
            src/__tests__/p2b/real-route-tests.test.ts \
            src/__tests__/p2b/operator-outcome-path.test.ts \
            src/__tests__/p2b/decision-outcome-path.test.ts \
            2>&1 | tee artifacts/p2b-db/vitest-output.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          echo "P2B test exit code: $TEST_EXIT"
          exit $TEST_EXIT
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_WITH_DB: "true"

      # Step 7.5: Upload full test logs for diagnosis
      - name: Upload P2B DB test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2b-db-test-logs
          path: artifacts/p2b-db/

      # Result classification comment
      - name: P2B DB Verification Complete
        if: success()
        run: |
          echo "✅ P2B_DB_VERIFIED"
          echo "All 42 tests executed and passed"
          echo "Outcome classifier: ✓"
          echo "Verification metadata: ✓"
          echo "Verified lifecycle: ✓"
          echo "Path convergence: ✓"

      - name: P2B DB Verification Failed
        if: failure()
        run: |
          echo "❌ P2B_DB_VERIFICATION_FAILED"
          echo "One or more tests failed"
          exit 1
