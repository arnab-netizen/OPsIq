name: Module 2 Finance Migration

# Manual only. Applies the Module 2 Financial Intelligence migration
# (prisma/migrations/20260611120000_module2_finance) to a network-enabled
# Neon target using the DIRECT (non-pooler) URL from the MIGRATION_DATABASE_URL
# secret. Additive only (creates 5 finance tables). It does NOT deploy the app
# and does NOT run any destructive command (no reset / no db push).
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Database target label (staging only: production schema changes go through migrate-production.yml)'
        required: true
        type: choice
        options:
          - staging
      confirm:
        description: 'Must equal APPLY_MODULE2_FINANCE_MIGRATION'
        required: true

concurrency:
  group: module-2-finance-migrate-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Module 2 Finance migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.target }}
    env:
      OPSIQ_DB_TARGET: staging
      OPSIQ_APPROVED_STAGING_ENDPOINT_IDS: ${{ vars.OPSIQ_APPROVED_STAGING_ENDPOINT_IDS }}
      # prisma.config.ts prioritizes MIGRATION_DATABASE_URL; DATABASE_URL is set
      # to the same secret as a fallback. Secrets are masked in logs by Actions.
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

    steps:
      - name: Confirmation phrase guard (fail closed)
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPLY_MODULE2_FINANCE_MIGRATION" ]; then
            echo "::error::Confirmation phrase mismatch. Type APPLY_MODULE2_FINANCE_MIGRATION to proceed."
            exit 1
          fi
          echo "✓ Confirmation accepted. Target: ${{ github.event.inputs.target }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Module 2 finance migration file exists
        run: |
          test -f prisma/migrations/20260611120000_module2_finance/migration.sql
          echo "✓ Migration file present: 20260611120000_module2_finance"

      - name: Preflight - MIGRATION_DATABASE_URL secret present (fail closed, no print)
        run: |
          if [ -z "${{ secrets.MIGRATION_DATABASE_URL }}" ]; then
            echo "::error::MIGRATION_DATABASE_URL secret is missing or empty. Aborting."
            exit 1
          fi
          echo "✓ MIGRATION_DATABASE_URL secret is configured (value not printed)"

      - name: Remove local env files (prevent placeholder/pooler contamination)
        run: |
          rm -f .env .env.local .env.local.bak .env.production .env.staging .env.postgres .env.test
          echo "✓ Removed local .env files so the secret is the sole datasource"

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Migration status (before, informational)
        # Informational only. `prisma migrate status` exits non-zero when pending
        # migrations exist — EXPECTED here (the Module 2 finance migration is
        # pending). Capture and report the exit code but never fail the job on it,
        # so the deploy step can run. The post-deploy status step remains strict.
        run: |
          set +e
          npx prisma migrate status
          STATUS_CODE=$?
          set -e
          echo "Pre-deploy migrate status exit code: $STATUS_CODE"
          echo "Non-zero before deploy is expected when pending migrations exist."
          exit 0

      - name: Apply migration (prisma migrate deploy)
        run: npx prisma migrate deploy

      - name: Migration status (after)
        run: npx prisma migrate status

      - name: Summary (no secrets)
        run: |
          echo "Target label        : ${{ github.event.inputs.target }}"
          echo "Migration command   : npx prisma migrate deploy (20260611120000_module2_finance)"
          echo "Tables created      : owner_financial_snapshots, owner_finance_cycles,"
          echo "                      owner_finance_findings, owner_finance_actions,"
          echo "                      owner_finance_verifications (additive only)"
          echo "Status              : completed"
          echo "Next                : Module 2 Slice 6 (API routes) once migration is applied"
