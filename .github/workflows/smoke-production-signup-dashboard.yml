name: Production Signup Dashboard Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Approved Production origin to test (fixed allow-list; free-text URLs are not accepted)"
        required: true
        type: choice
        default: "https://o-ps-iq.vercel.app"
        options:
          - "https://o-ps-iq.vercel.app"
          - "https://opsiq.solutions"
          - "https://www.opsiq.solutions"

jobs:
  smoke-test:
    name: Signup → Real Dashboard
    environment: production-smoke
    permissions:
      contents: read
    env:
      BASE_URL: ${{ inputs.base_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Assert workflow origin is main (fail-closed)
        run: |
          set -euo pipefail
          [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || { echo "::error::refusing to run: unexpected trigger '${GITHUB_EVENT_NAME}'"; exit 1; }
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::refusing to run: ref is '${GITHUB_REF}', must be refs/heads/main"; exit 1; }
          case "${GITHUB_WORKFLOW_REF}" in
            *"@refs/heads/main") ;;
            *) echo "::error::refusing to run: the workflow definition is not from refs/heads/main"; exit 1 ;;
          esac

      - name: Validate smoke destination (approved origins only; fail-closed)
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          case "${BASE_URL}" in
            "https://o-ps-iq.vercel.app"|"https://opsiq.solutions"|"https://www.opsiq.solutions") echo "Destination approved: ${BASE_URL}" ;;
            *) echo "::error::refusing to run: base_url is not an approved origin"; exit 1 ;;
          esac

      - name: Require smoke diagnostic key (fail-closed, no repository-level fallback)
        env:
          SMOKE_DIAGNOSTIC_KEY: ${{ secrets.SMOKE_DIAGNOSTIC_KEY }}
        run: |
          [ -n "${SMOKE_DIAGNOSTIC_KEY:-}" ] || { echo "::error::SMOKE_DIAGNOSTIC_KEY is not set in the production-smoke environment"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Get current commit SHA
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Wait for Vercel deployment
        run: |
          TARGET_COMMIT="${{ steps.commit.outputs.sha }}"
          MAX_RETRIES=30
          RETRY_INTERVAL=10

          echo "Waiting for Vercel to deploy commit ${TARGET_COMMIT:0:7}..."

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."

            RESPONSE=$(curl -s --proto '=https' --max-redirs 0 "$BASE_URL/api/internal/build-info" 2>/dev/null || echo '{}')
            DEPLOYED_COMMIT=$(echo "$RESPONSE" | jq -r '.commit // "unknown"' 2>/dev/null)

            if [ "$DEPLOYED_COMMIT" = "$TARGET_COMMIT" ]; then
              echo "✓ Vercel deployed commit $TARGET_COMMIT"
              exit 0
            fi

            echo "  Current: ${DEPLOYED_COMMIT:0:7}, Target: ${TARGET_COMMIT:0:7}"

            if [ $i -lt $MAX_RETRIES ]; then
              sleep $RETRY_INTERVAL
            fi
          done

          echo "❌ Timeout waiting for Vercel deployment"
          exit 1

      - name: Run smoke test
        env:
          BASE_URL: ${{ inputs.base_url }}
          OPSIQ_DIAGNOSTIC_KEY: ${{ secrets.SMOKE_DIAGNOSTIC_KEY }}
        run: npx tsx scripts/smoke-production-signup-dashboard.ts
        timeout-minutes: 2

      - name: Test passed
        if: success()
        run: |
          echo "✅ Production signup and dashboard smoke test passed"
          echo "   Signup flow working"
          echo "   Dashboard returns real data (no mock)"
          echo "   Empty workspace state verified"

      - name: Test failed
        if: failure()
        run: |
          echo "❌ Production smoke test FAILED"
          echo ""
          echo "Smoke Test: Signup → Owner Dashboard"
          echo "Base URL: ${BASE_URL}"
          echo "Target Commit: ${{ steps.commit.outputs.sha }}"
          echo ""
          echo "What this means:"
          echo "  The signup → owner dashboard production value path is broken."
          echo "  Users cannot signup or see their dashboard."
          echo ""
          echo "Check logs above for details. Likely causes:"
          echo "  1. Vercel deployment failed or rolled back"
          echo "  2. Authentication flow regression"
          echo "  3. Session/cookie handling broken"
          echo "  4. Workspace isolation regression"
          echo "  5. Database connectivity issue"
          echo ""
          echo "Escalation:"
          echo "  1. Check Vercel deployment status at https://vercel.com"
          echo "  2. Review database health"
          echo "  3. Check recent commits for breaking changes"
          echo "  4. Run local test suite: npm test -- auth workspace owner-dashboard"
          exit 1
