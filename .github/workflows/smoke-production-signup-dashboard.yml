name: Production Signup Dashboard Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (default: production)"
        required: false
        default: "https://o-ps-iq.vercel.app"

jobs:
  smoke-test:
    name: Signup → Real Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BASE_URL: ${{ inputs.base_url || 'https://o-ps-iq.vercel.app' }}
      OPSIQ_DIAGNOSTIC_KEY: ${{ secrets.OPSIQ_DIAGNOSTIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run smoke test
        run: npx tsx scripts/smoke-production-signup-dashboard.ts
        timeout-minutes: 2

      - name: Test passed
        if: success()
        run: |
          echo "✅ Production signup and dashboard smoke test passed"
          echo "   Signup flow working"
          echo "   Dashboard returns real data (no mock)"
          echo "   Empty workspace state verified"

      - name: Test failed
        if: failure()
        run: |
          echo "❌ Production smoke test failed"
          echo "   Check logs above for details"
          exit 1
