name: Resolve Failed Migration (P3009 metadata fix)

# Resolves P3009 caused by 20260511_add_aggregate_locks having finished_at=NULL.
#
# Background:
#   Ghost migration 1778679447_add_aggregate_locks (2026-05-13, out-of-band CLI)
#   applied aggregate_locks table, index, AND unique_event_number_per_aggregate
#   constraint before the tracked migration ran. When 20260511_add_aggregate_locks
#   ran on 2026-05-21, the non-idempotent ADD CONSTRAINT failed. Prisma left
#   finished_at=NULL in _prisma_migrations (started_at set, finished_at NULL).
#   All schema objects are correct and present. Only the metadata row is wrong.
#
# Prisma P3009 condition:
#   Row exists in _prisma_migrations WHERE migration_name = '...' AND
#   finished_at IS NULL AND rolled_back_at IS NULL.
#   (There is NO failed_at column in _prisma_migrations.)
#
# This workflow:
#   1. Verifies all schema objects exist (read-only)
#   2. Confirms _prisma_migrations row has finished_at IS NULL (P3009 condition)
#   3. Runs prisma migrate resolve --applied (sets finished_at, no schema changes)
#   4. Confirms finished_at is now set (post-resolve read-only check)
#   5. Runs prisma migrate status (post-resolve read-only)
#   6. Runs prisma migrate deploy (applies 22 pending migrations)
#   7. Runs vitest (non-DB unit tests) to confirm no regressions
#
# HARD STOPS:
#   - Any expected schema object missing -> workflow fails before resolve
#   - finished_at already set (migration cleanly applied) -> no resolve needed
#   - rolled_back_at set -> different condition, do not resolve here
#   - migrate deploy fails -> workflow fails, surfaces error
#
# NEVER touches production.
# NEVER runs prisma migrate reset.
# NEVER runs prisma db push.
# NEVER drops, recreates, renames, or alters schema objects.

on:
  workflow_dispatch:
    inputs:
      confirm_test_db_only:
        description: >
          I confirm this targets the Neon TEST database only, not production or staging.
          Set to "yes" to proceed.
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      migration_name:
        description: >
          Migration to resolve. Must be exactly: 20260511_add_aggregate_locks
          Any other value will abort.
        required: true
        default: '20260511_add_aggregate_locks'
        type: string

concurrency:
  group: resolve-failed-migration
  cancel-in-progress: false

jobs:
  resolve-failed-migration:
    name: 'Resolve Failed Migration (prisma migrate resolve --applied)'
    if: >
      github.event.inputs.confirm_test_db_only == 'yes' &&
      github.event.inputs.migration_name == '20260511_add_aggregate_locks'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # -- Safety Gate 1: URL must be a real PostgreSQL URL --------------------
      - name: Assert MIGRATION_DATABASE_URL is set and is a real URL
        id: url-check
        run: |
          URL="${{ secrets.MIGRATION_DATABASE_URL }}"
          if [ -z "$URL" ]; then
            echo "MIGRATION_DATABASE_URL secret is not set. Cannot proceed."
            exit 1
          fi
          if ! echo "$URL" | grep -qE '^postgres(ql)?://';
          then
            echo "MIGRATION_DATABASE_URL does not look like a valid PostgreSQL URL."
            exit 1
          fi
          LEN=${#URL}
          echo "MIGRATION_DATABASE_URL is set and looks like a valid URL (length=$LEN)"

      # -- Safety Gate 2: must be direct (non-pooler) -------------------------
      - name: Assert MIGRATION_DATABASE_URL is direct (not pooler)
        id: pooler-check
        run: |
          URL="${{ secrets.MIGRATION_DATABASE_URL }}"
          if echo "$URL" | grep -qi '\-pooler'; then
            echo "MIGRATION_DATABASE_URL appears to be a pooler URL."
            echo "prisma migrate requires a direct (non-pooler) Neon endpoint."
            exit 1
          fi
          echo "MIGRATION_DATABASE_URL is direct (no '-pooler' detected)"

      # -- Safety Gate 3: no placeholders ------------------------------------
      - name: Assert MIGRATION_DATABASE_URL is not a placeholder
        id: placeholder-check
        run: |
          URL="${{ secrets.MIGRATION_DATABASE_URL }}"
          if echo "$URL" | grep -qE 'REPLACE_|PLACEHOLDER|your_neon_url|example\.com|TEST_DATABASE_URL|DATABASE_URL'; then
            echo "MIGRATION_DATABASE_URL contains a placeholder or unresolved reference."
            exit 1
          fi
          echo "MIGRATION_DATABASE_URL does not contain placeholder values"

      # -- Safety Gate 4: schema must be valid before touching DB -------------
      - name: Prisma validate
        id: validate
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # -- Install psql for read-only verification ----------------------------
      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      # -- Pre-resolution read-only verification ------------------------------
      # Hard stop if any expected object is missing or P3009 condition not present.
      # NOTE: _prisma_migrations has NO failed_at column. P3009 condition is:
      #   started_at IS NOT NULL AND finished_at IS NULL AND rolled_back_at IS NULL
      - name: Pre-resolution schema verification (read-only)
        id: pre-verify
        run: |
          URL="${{ secrets.MIGRATION_DATABASE_URL }}"
          echo "=== PRE-RESOLUTION SCHEMA VERIFICATION (READ-ONLY) ==="

          # 1. aggregate_locks table
          TABLE_EXISTS=$(psql "$URL" -tAc "
            SELECT EXISTS (
              SELECT 1 FROM information_schema.tables
              WHERE table_schema = 'public'
              AND table_name = 'aggregate_locks'
            );
          ")
          echo "aggregate_locks table exists: $TABLE_EXISTS"
          if [ "$TABLE_EXISTS" != "t" ]; then
            echo "HARD STOP: aggregate_locks table is missing. Cannot safely resolve."
            exit 1
          fi
          echo "aggregate_locks table: EXISTS"

          # 2. idx_aggregate_locks_workspace index
          INDEX_EXISTS=$(psql "$URL" -tAc "
            SELECT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname = 'public'
              AND tablename = 'aggregate_locks'
              AND indexname = 'idx_aggregate_locks_workspace'
            );
          ")
          echo "idx_aggregate_locks_workspace index exists: $INDEX_EXISTS"
          if [ "$INDEX_EXISTS" != "t" ]; then
            echo "HARD STOP: idx_aggregate_locks_workspace index is missing. Cannot safely resolve."
            exit 1
          fi
          echo "idx_aggregate_locks_workspace index: EXISTS"

          # 3. unique_event_number_per_aggregate constraint on canonical_events
          CONSTRAINT_EXISTS=$(psql "$URL" -tAc "
            SELECT EXISTS (
              SELECT 1 FROM information_schema.table_constraints
              WHERE table_schema = 'public'
              AND table_name = 'canonical_events'
              AND constraint_name = 'unique_event_number_per_aggregate'
              AND constraint_type = 'UNIQUE'
            );
          ")
          echo "unique_event_number_per_aggregate constraint exists: $CONSTRAINT_EXISTS"
          if [ "$CONSTRAINT_EXISTS" != "t" ]; then
            echo "HARD STOP: unique_event_number_per_aggregate constraint is missing. Cannot safely resolve."
            exit 1
          fi
          echo "unique_event_number_per_aggregate constraint: EXISTS"

          # 4. _prisma_migrations row exists and has finished_at IS NULL (P3009 condition)
          #    _prisma_migrations schema: id, checksum, finished_at, migration_name,
          #    logs, rolled_back_at, started_at, applied_steps_count
          #    There is NO failed_at column.
          ROW_EXISTS=$(psql "$URL" -tAc "
            SELECT EXISTS (
              SELECT 1 FROM _prisma_migrations
              WHERE migration_name = '20260511_add_aggregate_locks'
            );
          " | xargs)
          echo "_prisma_migrations row exists: $ROW_EXISTS"
          if [ "$ROW_EXISTS" != "t" ]; then
            echo "HARD STOP: No _prisma_migrations row found for 20260511_add_aggregate_locks."
            exit 1
          fi

          FINISHED_AT=$(psql "$URL" -tAc "
            SELECT COALESCE(finished_at::text, 'NULL') FROM _prisma_migrations
            WHERE migration_name = '20260511_add_aggregate_locks'
            LIMIT 1;
          " | xargs)
          echo "_prisma_migrations finished_at: '$FINISHED_AT'"
          if [ "$FINISHED_AT" != "NULL" ]; then
            echo "HARD STOP: finished_at is already set ('$FINISHED_AT'). Migration is already cleanly applied. No resolve needed."
            exit 1
          fi

          ROLLED_BACK_AT=$(psql "$URL" -tAc "
            SELECT COALESCE(rolled_back_at::text, 'NULL') FROM _prisma_migrations
            WHERE migration_name = '20260511_add_aggregate_locks'
            LIMIT 1;
          " | xargs)
          echo "_prisma_migrations rolled_back_at: '$ROLLED_BACK_AT'"
          if [ "$ROLLED_BACK_AT" != "NULL" ]; then
            echo "HARD STOP: rolled_back_at is set ('$ROLLED_BACK_AT'). Migration was explicitly rolled back. Use --rolled-back path, not --applied."
            exit 1
          fi

          echo ""
          echo "_prisma_migrations.finished_at: NULL (P3009 condition confirmed)"
          echo "_prisma_migrations.rolled_back_at: NULL (not explicitly rolled back)"
          echo ""
          echo "=== PRE-RESOLUTION VERIFICATION PASSED ==========================================================="
          echo "All schema objects present. P3009 condition confirmed (finished_at IS NULL)."
          echo "Proceeding to: npx prisma migrate resolve --applied 20260511_add_aggregate_locks"
        env:
          PGSSLMODE: require

      # -- Metadata-only resolve ----------------------------------------------
      # Sets finished_at in _prisma_migrations. No SQL executed against schema.
      - name: prisma migrate resolve --applied 20260511_add_aggregate_locks
        id: migrate-resolve
        run: |
          echo "Running: npx prisma migrate resolve --applied 20260511_add_aggregate_locks"
          npx prisma migrate resolve --applied 20260511_add_aggregate_locks
          echo "prisma migrate resolve completed"
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # -- Post-resolve metadata check ----------------------------------------
      - name: Post-resolve metadata verification (read-only)
        id: post-verify
        run: |
          URL="${{ secrets.MIGRATION_DATABASE_URL }}"
          echo "=== POST-RESOLVE METADATA VERIFICATION ==="

          FINISHED_AT=$(psql "$URL" -tAc "
            SELECT COALESCE(finished_at::text, 'NULL') FROM _prisma_migrations
            WHERE migration_name = '20260511_add_aggregate_locks'
            LIMIT 1;
          " | xargs)
          echo "finished_at after resolve: '$FINISHED_AT'"

          if [ "$FINISHED_AT" = "NULL" ] || [ -z "$FINISHED_AT" ]; then
            echo "finished_at is still NULL after resolve. Something went wrong."
            exit 1
          fi
          echo "finished_at: SET ($FINISHED_AT)"
          echo "=== POST-RESOLVE METADATA VERIFIED - P3009 CONDITION CLEARED ==="
        env:
          PGSSLMODE: require

      # -- Post-resolve migrate status ----------------------------------------
      - name: prisma migrate status (post-resolve, read-only)
        id: post-status
        run: |
          echo "=== POST-RESOLVE MIGRATION STATUS ==="
          npx prisma migrate status 2>&1 | tee post-resolve-status.txt || true
          echo "====================================="
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # -- Apply 22 pending migrations ----------------------------------------
      - name: prisma migrate deploy (apply pending migrations)
        id: migrate-deploy
        run: |
          echo "=== DEPLOYING PENDING MIGRATIONS ==="
          npx prisma migrate deploy
          echo "prisma migrate deploy completed"
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # -- Post-deploy status -------------------------------------------------
      - name: prisma migrate status (post-deploy, read-only)
        id: post-deploy-status
        run: |
          echo "=== POST-DEPLOY MIGRATION STATUS ==="
          npx prisma migrate status 2>&1 | tee post-deploy-status.txt || true
          echo "====================================="
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # -- Non-DB unit test gate ----------------------------------------------
      - name: Run vitest (non-DB unit tests)
        id: unit-tests
        run: npx vitest run --reporter=verbose 2>&1 | tee vitest-results.txt || true
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          NODE_ENV: test

      # -- Upload artifacts ---------------------------------------------------
      - name: Upload resolution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolve-failed-migration-logs
          path: |
            post-resolve-status.txt
            post-deploy-status.txt
            vitest-results.txt
          retention-days: 30
          if-no-files-found: warn

      # -- Summary ------------------------------------------------------------
      - name: Write GITHUB_STEP_SUMMARY
        if: always()
        run: |
          URL_CHK="${{ steps.url-check.outcome }}"
          POOL_CHK="${{ steps.pooler-check.outcome }}"
          PH_CHK="${{ steps.placeholder-check.outcome }}"
          VALIDATE="${{ steps.validate.outcome }}"
          PRE_VERIFY="${{ steps.pre-verify.outcome }}"
          RESOLVE="${{ steps.migrate-resolve.outcome }}"
          POST_VERIFY="${{ steps.post-verify.outcome }}"
          POST_STATUS="${{ steps.post-status.outcome }}"
          DEPLOY="${{ steps.migrate-deploy.outcome }}"
          POST_DEPLOY="${{ steps.post-deploy-status.outcome }}"
          TESTS="${{ steps.unit-tests.outcome }}"
          ok() { [ "$1" = "success" ] && echo "PASS" || echo "FAIL"; }
          if [ "$DEPLOY" = "success" ]; then
            OVERALL="P3009_RESOLVED - MIGRATIONS_DEPLOYED"
            CLASS="LANE_A_VERIFICATION_REQUIRED"
          elif [ "$RESOLVE" = "success" ]; then
            OVERALL="RESOLVED_BUT_DEPLOY_FAILED"
            CLASS="INVESTIGATE_DEPLOY_FAILURE"
          else
            OVERALL="RESOLUTION_FAILED"
            CLASS="HARD_STOP_HIT - check pre-verify step logs"
          fi
          {
            echo "## Resolve Failed Migration - P3009 Fix"
            echo ""
            echo "**Result:** $OVERALL"
            echo "**Classification:** $CLASS"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| MIGRATION_DATABASE_URL is real URL | $(ok $URL_CHK) |"
            echo "| MIGRATION_DATABASE_URL is direct (not pooler) | $(ok $POOL_CHK) |"
            echo "| No placeholder values | $(ok $PH_CHK) |"
            echo "| Prisma schema valid | $(ok $VALIDATE) |"
            echo "| Pre-resolution schema verification (read-only) | $(ok $PRE_VERIFY) |"
            echo "| prisma migrate resolve --applied | $(ok $RESOLVE) |"
            echo "| Post-resolve metadata verification (read-only) | $(ok $POST_VERIFY) |"
            echo "| prisma migrate status (post-resolve) | $(ok $POST_STATUS) |"
            echo "| prisma migrate deploy (pending migrations) | $(ok $DEPLOY) |"
            echo "| prisma migrate status (post-deploy) | $(ok $POST_DEPLOY) |"
            echo "| vitest (non-DB unit tests) | $(ok $TESTS) |"
            echo ""
            echo "**Target:** Neon TEST database (MIGRATION_DATABASE_URL secret)"
            echo "**Migration resolved:** 20260511_add_aggregate_locks"
            echo "**Triggered by:** @${{ github.actor }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "**Next step:** Trigger DB Verification workflow with use_neon_secrets=true to confirm LANE_A passes."
          } >> $GITHUB_STEP_SUMMARY
