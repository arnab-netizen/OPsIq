name: GSC read-only access probe

# One-off, read-only verification that the owner-configured Workload Identity Federation service
# account can read Search Console for sc-domain:opsiq.solutions. It runs ONLY by manual
# workflow_dispatch from `main` (a branch run is rejected by the federation's own attribute
# condition, which this workflow neither changes nor bypasses).
#
# SAFETY PROPERTIES
#  - Fail-closed: the job fails (nonzero) on any mandatory failure: auth, HTTP 401/403/429/5xx,
#    timeout, malformed response, missing property, insufficient permission. A valid empty result is
#    a success; optional URL inspection is graded separately and cannot hide the Search Analytics result.
#  - Public repository: output is limited to fixed status tokens by .github/scripts/gsc_probe.py. No raw
#    API responses, tokens, other properties, queries, pages, metrics or URL-inspection details are logged,
#    summarised or uploaded as artifacts.
#  - Minimal credential materialisation: no credentials file and no exported environment variables; the
#    short-lived webmasters.readonly access token is passed only to the one step that uses it.
#  - No database, no secrets, no deployment, no application code, no permission changes, no schedule.
#  - Third-party actions are pinned to immutable commit SHAs (tag shown in the comment).

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gsc-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Search Console read-only probe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.ref == 'refs/heads/main' && github.repository == 'arnab-netizen/OPsIq'
    steps:
      - name: Check out probe script only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Check configuration (fail closed)
        env:
          WIP: ${{ vars.GSC_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ vars.GSC_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$WIP" ] || [ -z "$SA" ]; then
            echo "CONFIGURATION=FAIL_MISSING_VARIABLES"
            exit 10
          fi
          if [ "$SA" != "gsc-readonly-ingestion@opsiq-production.iam.gserviceaccount.com" ]; then
            echo "CONFIGURATION=FAIL_UNEXPECTED_SERVICE_ACCOUNT"
            exit 10
          fi
          echo "CONFIGURATION=PASS"

      - name: Authenticate to Google Cloud (WIF, webmasters.readonly only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GSC_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GSC_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          create_credentials_file: false
          export_environment_variables: false

      - name: Probe Search Console (sanitized, fail-closed)
        env:
          GSC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 -I .github/scripts/gsc_probe.py
