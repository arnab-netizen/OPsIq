name: Production Diagnosis → Dashboard Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (default: production)"
        required: false
        default: "https://o-ps-iq.vercel.app"

jobs:
  smoke-test:
    name: Diagnosis → Real Recommendations on Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Get current commit SHA
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Wait for Vercel deployment
        run: |
          BASE_URL="${{ inputs.base_url || 'https://o-ps-iq.vercel.app' }}"
          TARGET_COMMIT="${{ steps.commit.outputs.sha }}"
          MAX_RETRIES=30
          RETRY_INTERVAL=10

          echo "Waiting for Vercel to deploy commit ${TARGET_COMMIT:0:7}..."

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."

            RESPONSE=$(curl -s "$BASE_URL/api/internal/build-info" 2>/dev/null || echo '{}')
            DEPLOYED_COMMIT=$(echo "$RESPONSE" | jq -r '.commit // "unknown"' 2>/dev/null)

            if [ "$DEPLOYED_COMMIT" = "$TARGET_COMMIT" ]; then
              echo "✓ Vercel deployed commit $TARGET_COMMIT"
              exit 0
            fi

            echo "  Current: ${DEPLOYED_COMMIT:0:7}, Target: ${TARGET_COMMIT:0:7}"

            if [ $i -lt $MAX_RETRIES ]; then
              sleep $RETRY_INTERVAL
            fi
          done

          echo "❌ Timeout waiting for Vercel deployment"
          exit 1

      - name: Run smoke test
        env:
          BASE_URL: ${{ inputs.base_url || 'https://o-ps-iq.vercel.app' }}
          OPSIQ_DIAGNOSTIC_KEY: ${{ secrets.OPSIQ_DIAGNOSTIC_KEY }}
        run: npx tsx scripts/smoke-production-diagnosis-dashboard.ts
        timeout-minutes: 2

      - name: Test passed
        if: success()
        run: |
          echo "✅ Production diagnosis → dashboard smoke test passed"
          echo "   Signup flow working"
          echo "   Diagnosis creates engagement + recommendations + actions"
          echo "   Dashboard shows real recommendations (not generic fallback)"
          echo "   Empty workspace state verified"

      - name: Test failed
        if: failure()
        run: |
          echo "❌ Production smoke test FAILED"
          echo ""
          echo "Smoke Test: Diagnosis → Dashboard"
          echo "Base URL: ${{ inputs.base_url || 'https://o-ps-iq.vercel.app' }}"
          echo "Target Commit: ${{ steps.commit.outputs.sha }}"
          echo ""
          echo "What this means:"
          echo "  The diagnosis → dashboard production value path is broken."
          echo "  Users cannot create diagnoses or see recommendations on dashboard."
          echo ""
          echo "Check logs above for details. Likely causes:"
          echo "  1. Vercel deployment failed or rolled back"
          echo "  2. Database migration issue"
          echo "  3. Authentication/workspace isolation regression"
          echo "  4. Schema mismatch or missing field"
          echo "  5. Transaction/atomicity failure in diagnosis creation"
          echo ""
          echo "Escalation:"
          echo "  1. Check Vercel deployment status at https://vercel.com"
          echo "  2. Review database health"
          echo "  3. Check recent commits for breaking changes"
          echo "  4. Run local test suite: npm test -- auth workspace diagnosis"
          exit 1
