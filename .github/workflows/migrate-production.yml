name: Migrate Production Database

# Manual trigger only - no automatic runs. Production migrations are a
# deliberate, human-gated operation. This workflow NEVER seeds, resets, or
# performs any destructive operation; it only applies pending Prisma migrations.
#
# Three modes:
#   MAIN            - applies whatever pending migrations already exist in
#                      main's own prisma/migrations directory. Unchanged
#                      behavior from the original single-mode workflow.
#   MAIN_BATCH      - applies an ORDERED BATCH of migrations already committed to
#                      main, authorized by a version-controlled, PR-reviewed
#                      manifest (.claude/production-migration-batches/<batch_id>.json).
#                      It exists because MAIN's exact-one-pending gate (below)
#                      always refuses a database that is more than one migration
#                      behind main. The MAIN gate is NOT weakened: it still runs,
#                      unchanged, for MAIN. MAIN_BATCH replaces it with a stricter,
#                      manifest-bound proof (scripts/release/migration-batch.mjs):
#                      exact main SHA, exact DB host, pending set == manifest (or a
#                      resumable suffix of it), pre-batch ledger anchor, per-file
#                      sha256, static additive-only scan, then the SAME single
#                      `prisma migrate deploy`, a blocking post-batch verification,
#                      and the SAME runtime-role reconcile gate and redeploy hook.
#                      Implemented as a mode of THIS workflow (not a second file)
#                      so exactly one workflow can ever mutate production.
#                      Runbook: docs/opsiq/ci/PRODUCTION_BATCH_MIGRATION_RUNBOOK.md
#   PINNED_PREDEPLOY - applies exactly ONE additional, owner-authorized
#                      migration from an exact, unmerged PR commit SHA,
#                      before that PR is merged. Used only when application
#                      code slated to ship AFTER this migration requires the
#                      column/table to already exist (new code reading a
#                      column the current schema lacks). The unmerged
#                      commit's application code and scripts are NEVER
#                      checked out or executed while this workflow holds
#                      OPERATOR_DATABASE_URL -- only the single named
#                      migration.sql file is read, via a git-object-level
#                      read (git show), verified against a GitHub-API
#                      provenance check and a caller-supplied checksum, then
#                      copied into the working tree that was checked out
#                      from main. Every other step (npm ci, prisma generate,
#                      prisma migrate deploy, secret handling) runs
#                      identically to MAIN mode, against main's own trusted
#                      node_modules/prisma installation. Additionally, the
#                      caller must pin the exact expected production DB
#                      hostname (expected_database_host, bare hostname
#                      only); the workflow parses OPERATOR_DATABASE_URL's
#                      actual hostname at runtime and aborts before any
#                      migration deploy on any mismatch -- a syntactically
#                      valid direct Neon URL belonging to the wrong
#                      project/branch would otherwise pass the existing
#                      placeholder/pooler checks undetected.
#
# TRANSIENT STATE NOTE (PINNED_PREDEPLOY): after a pinned migration is
# applied, production's _prisma_migrations table will contain a migration
# whose folder does not yet exist in main's prisma/migrations directory.
# This is a deliberate, temporary, and expected state: `prisma migrate
# status` run by anyone against production between now and the source PR's
# merge will report that migration as present in the database but not
# found locally. That is NOT corruption and requires NO manual repair --
# it reconciles automatically the moment the source PR merges into main
# (the migration folder then exists in both places). Do not run `prisma
# migrate resolve` or hand-edit `_prisma_migrations` in response to this.
#
# EXACT-HOST GATE (both modes): the owner-pinned expected_database_host
# comparison originally shipped as a PINNED_PREDEPLOY-only control. Both
# modes mutate the same production database via the same
# OPERATOR_DATABASE_URL secret and are equally exposed to a syntactically
# valid direct (non-pooler) Neon URL that happens to point at the wrong
# project/branch -- MAIN mode had no more protection against that than
# PINNED_PREDEPLOY did before this control existed. expected_database_host
# is therefore now a required input and the host-identity check runs
# unconditionally for every dispatch, not just PINNED_PREDEPLOY.
#
# MAIN-MODE EXACT-ONE-PENDING GATE: MAIN mode previously had no automated
# check that exactly the intended migration -- and only it -- was pending
# before `prisma migrate deploy` ran; it only logged `prisma migrate
# status` output for a human to read, then deployed unconditionally.
# migration_name is therefore now a required input for MAIN mode too (not
# just PINNED_PREDEPLOY): the caller must state which migration this
# dispatch is authorized to apply. Two checks now gate MAIN mode before
# deploy: (1) migration_name must already exist as a folder in main's own
# prisma/migrations (checked out by this workflow) -- MAIN mode only ever
# applies what is already committed to main, so a name that isn't there is
# refused outright; (2) the same version-controlled classifier PINNED_PREDEPLOY
# already used (scripts/classify-migrate-status.mjs) is now invoked
# unconditionally for both modes, requiring PREFLIGHT_CLASSIFICATION=
# PENDING_EXPECTED for exactly migration_name -- zero pending, multiple
# pending, a different migration pending, a failed prior migration, a
# database connection error, or unparseable `prisma migrate status` output
# all abort the job before `prisma migrate deploy` is ever reached.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      mode:
        description: 'MAIN (one migration already in main), MAIN_BATCH (a manifest-authorized ordered batch already in main) or PINNED_PREDEPLOY (one owner-authorized migration from an exact unmerged PR SHA)'
        required: true
        default: 'MAIN'
        type: choice
        options:
          - MAIN
          - MAIN_BATCH
          - PINNED_PREDEPLOY
      confirm:
        description: 'MAIN: type "MIGRATE PRODUCTION". MAIN_BATCH: type "MIGRATE PRODUCTION BATCH". PINNED_PREDEPLOY: type "MIGRATE PRODUCTION PINNED PREDEPLOY".'
        required: true
        type: string
      source_pr:
        description: '[PINNED_PREDEPLOY only] Source PR number the migration comes from'
        required: false
        type: string
      source_sha:
        description: '[PINNED_PREDEPLOY only] Exact 40-char commit SHA authorized by the owner (must equal the PR''s current head SHA)'
        required: false
        type: string
      migration_name:
        description: 'Required for both MAIN and PINNED_PREDEPLOY (enforced by their input-validation steps); must be empty for MAIN_BATCH. Migration folder name that must be the sole pending migration before deploy, e.g. 20260819000001_startup_session_business_handoff. MAIN mode requires this folder to already exist in main; PINNED_PREDEPLOY requires it to NOT yet exist there (see Verify migration-chain integrity).'
        required: false
        type: string
      migration_sha256:
        description: '[PINNED_PREDEPLOY only] SHA-256 checksum of the migration.sql file, as authorized by the owner'
        required: false
        type: string
      batch_id:
        description: '[MAIN_BATCH only] Batch manifest id: the file name (without .json) under .claude/production-migration-batches/ in main. The manifest, not this dispatch, defines the migrations.'
        required: false
        type: string
      expected_main_sha:
        description: '[MAIN_BATCH only] Exact 40-char lowercase SHA of main that was reviewed; the job refuses unless the checked-out HEAD equals it.'
        required: false
        type: string
      expected_database_host:
        description: 'Required for every mode. Exact owner-authorized production DB hostname, bare hostname only (e.g. ep-xxxx.region.aws.neon.tech) — never a full URL, credentials, path, or query string'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Prisma Migrations on Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-operator

    steps:
      # ── Workflow-origin guard (fail-closed; FIRST step, before anything that references a secret) ───────────
      # `ref: main` on a later checkout only selects which repository CONTENT is built. The steps that run -- and
      # the secrets they reference -- come from the workflow FILE of the ref this run was dispatched from. This
      # step fails the job unless the trigger, the ref and the workflow definition are all main. It is defence in
      # depth against an accidental off-main dispatch; the ENFORCING control is the `production-operator`
      # environment's deployment-branch rule (main only) -- see docs/opsiq/ci/PRODUCTION_SECRET_ISOLATION.md.
      - name: Assert workflow origin is main (fail-closed)
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch|schedule) ;;
            *) echo "::error::refusing to run: unexpected trigger '${GITHUB_EVENT_NAME}'"; exit 1 ;;
          esac
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::refusing to run: ref is '${GITHUB_REF}', must be refs/heads/main"
            exit 1
          fi
          case "${GITHUB_WORKFLOW_REF}" in
            *"@refs/heads/main") ;;
            *) echo "::error::refusing to run: the workflow definition is not from refs/heads/main"; exit 1 ;;
          esac
          echo "Workflow origin verified: ${GITHUB_WORKFLOW_REF}"

      - name: Validate mode input
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$INPUT_MODE" in
            MAIN|MAIN_BATCH|PINNED_PREDEPLOY) ;;
            *)
              echo "::error::Invalid mode '$INPUT_MODE'. Must be MAIN, MAIN_BATCH or PINNED_PREDEPLOY."
              exit 1
              ;;
          esac
          echo "✓ Mode: $INPUT_MODE"

      - name: Confirm explicit intent
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$INPUT_MODE" == "PINNED_PREDEPLOY" ]; then
            if [ "$INPUT_CONFIRM" != "MIGRATE PRODUCTION PINNED PREDEPLOY" ]; then
              echo "::error::PINNED_PREDEPLOY mode requires the confirm input to be exactly \"MIGRATE PRODUCTION PINNED PREDEPLOY\". Aborting."
              exit 1
            fi
          elif [ "$INPUT_MODE" == "MAIN_BATCH" ]; then
            if [ "$INPUT_CONFIRM" != "MIGRATE PRODUCTION BATCH" ]; then
              echo "::error::MAIN_BATCH mode requires the confirm input to be exactly \"MIGRATE PRODUCTION BATCH\". Aborting."
              exit 1
            fi
          else
            if [ "$INPUT_CONFIRM" != "MIGRATE PRODUCTION" ]; then
              echo "::error::Confirmation phrase not matched. Aborting."
              exit 1
            fi
          fi
          echo "✓ Explicit confirmation received for mode $INPUT_MODE"

      - name: Validate PINNED_PREDEPLOY inputs
        if: inputs.mode == 'PINNED_PREDEPLOY'
        run: |
          SOURCE_PR="${{ inputs.source_pr }}"
          SOURCE_SHA="${{ inputs.source_sha }}"
          MIGRATION_NAME="${{ inputs.migration_name }}"
          MIGRATION_SHA256="${{ inputs.migration_sha256 }}"

          if [ -z "$SOURCE_PR" ] || [ -z "$SOURCE_SHA" ] || [ -z "$MIGRATION_NAME" ] || [ -z "$MIGRATION_SHA256" ]; then
            echo "::error::PINNED_PREDEPLOY mode requires source_pr, source_sha, migration_name, and migration_sha256 to all be set."
            exit 1
          fi
          if ! echo "$SOURCE_PR" | grep -qE '^[0-9]+$'; then
            echo "::error::source_pr must be a plain PR number (digits only). Got: $SOURCE_PR"
            exit 1
          fi
          if ! echo "$SOURCE_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::source_sha must be a full 40-character lowercase hex commit SHA. Got: $SOURCE_SHA"
            exit 1
          fi
          if ! echo "$MIGRATION_NAME" | grep -qE '^[0-9]{14}_[a-zA-Z0-9_]+$'; then
            echo "::error::migration_name must match Prisma's <14-digit-timestamp>_<name> convention (digits, letters, underscores only). Got: $MIGRATION_NAME"
            exit 1
          fi
          case "$MIGRATION_NAME" in
            *..*|*/*|*' '*)
              echo "::error::migration_name contains disallowed characters ('..', '/', or whitespace) — refusing to use it in a path."
              exit 1
              ;;
          esac
          if ! echo "$MIGRATION_SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::migration_sha256 must be a 64-character lowercase hex SHA-256 checksum. Got: $MIGRATION_SHA256"
            exit 1
          fi
          echo "✓ PINNED_PREDEPLOY inputs validated: PR #$SOURCE_PR @ $SOURCE_SHA, migration=$MIGRATION_NAME"

      - name: Validate MAIN inputs
        if: inputs.mode == 'MAIN'
        run: |
          MIGRATION_NAME="${{ inputs.migration_name }}"

          if [ -z "$MIGRATION_NAME" ]; then
            echo "::error::MAIN mode requires migration_name to be set (the migration this dispatch is authorized to apply)."
            exit 1
          fi
          if ! echo "$MIGRATION_NAME" | grep -qE '^[0-9]{14}_[a-zA-Z0-9_]+$'; then
            echo "::error::migration_name must match Prisma's <14-digit-timestamp>_<name> convention (digits, letters, underscores only). Got: $MIGRATION_NAME"
            exit 1
          fi
          case "$MIGRATION_NAME" in
            *..*|*/*|*' '*)
              echo "::error::migration_name contains disallowed characters ('..', '/', or whitespace) — refusing to use it in a path."
              exit 1
              ;;
          esac
          echo "✓ MAIN inputs validated: migration=$MIGRATION_NAME"

      - name: Validate MAIN_BATCH inputs
        if: inputs.mode == 'MAIN_BATCH'
        env:
          BATCH_ID: ${{ inputs.batch_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          MIGRATION_NAME: ${{ inputs.migration_name }}
          SOURCE_PR: ${{ inputs.source_pr }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$BATCH_ID" | grep -qE '^[a-z0-9][a-z0-9-]{2,63}$'; then
            echo "::error::MAIN_BATCH requires batch_id matching ^[a-z0-9][a-z0-9-]{2,63}$ (the manifest file name without .json)."
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_MAIN_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::MAIN_BATCH requires expected_main_sha to be a full 40-character lowercase hex SHA."
            exit 1
          fi
          if [ -n "$MIGRATION_NAME$SOURCE_PR$SOURCE_SHA$MIGRATION_SHA256" ]; then
            echo "::error::MAIN_BATCH takes only batch_id, expected_main_sha, expected_database_host and confirm. migration_name, source_pr, source_sha and migration_sha256 must be empty: the manifest defines the migrations."
            exit 1
          fi
          echo "✓ MAIN_BATCH inputs validated: batch_id=$BATCH_ID expected_main_sha=$EXPECTED_MAIN_SHA"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Print and verify checked-out SHA
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(git rev-parse origin/main)
          echo "Checked-out SHA: $CURRENT_SHA"
          echo "origin/main SHA: $MAIN_SHA"
          # Stale-release guard BEFORE any database step: the SHA this run was dispatched against must be exactly
          # what is checked out. If main advanced between dispatch and checkout, stop now, not after the migration.
          if [ "$CURRENT_SHA" != "${GITHUB_SHA}" ]; then
            echo "::error::Checked-out SHA ($CURRENT_SHA) differs from the SHA this run was dispatched on (${GITHUB_SHA}); main advanced. Re-dispatch against the current main. No database step has run."
            exit 1
          fi
          # Verify the checked-out commit is an ancestor of (or equal to) main.
          # This workflow always checks out main directly (see "ref: main"
          # above); this check documents and enforces that invariant rather
          # than trusting the pin alone.
          if ! git merge-base --is-ancestor "$CURRENT_SHA" "$MAIN_SHA" && [ "$CURRENT_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Checked-out SHA ($CURRENT_SHA) is not an ancestor of origin/main. Aborting."
            exit 1
          fi
          echo "✓ SHA ancestry verified"
          echo "MIGRATION_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"

      - name: Assert checked-out HEAD equals the reviewed expected_main_sha (MAIN_BATCH, before any database step)
        if: inputs.mode == 'MAIN_BATCH'
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$EXPECTED_MAIN_SHA" ]; then
            echo "::error::Checked-out HEAD ($HEAD_SHA) is not the reviewed expected_main_sha ($EXPECTED_MAIN_SHA); main moved or the wrong SHA was supplied. Re-review the manifest at the new SHA and re-dispatch. No database step has run."
            exit 1
          fi
          echo "✓ HEAD equals expected_main_sha: $HEAD_SHA"

      - name: Verify migration exists on current main
        if: inputs.mode == 'MAIN'
        run: |
          MIG_NAME="${{ inputs.migration_name }}"
          if [ ! -d "prisma/migrations/$MIG_NAME" ]; then
            echo "::error::Migration $MIG_NAME does not exist in checked-out main's prisma/migrations directory. MAIN mode only applies migrations already committed to main -- refusing to proceed against a migration_name that isn't there. If this migration is still on an unmerged PR, use PINNED_PREDEPLOY instead."
            exit 1
          fi
          if [ ! -f "prisma/migrations/$MIG_NAME/migration.sql" ]; then
            echo "::error::prisma/migrations/$MIG_NAME exists but does not contain migration.sql."
            exit 1
          fi
          echo "✓ $MIG_NAME confirmed present in main's prisma/migrations directory"

      - name: Verify source PR/SHA provenance via GitHub API
        if: inputs.mode == 'PINNED_PREDEPLOY'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.source_pr }}")
          PR_HEAD_SHA=$(echo "$PR_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).head.sha))")
          PR_BASE_REF=$(echo "$PR_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).base.ref))")
          PR_STATE=$(echo "$PR_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).state))")
          PR_MERGED=$(echo "$PR_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(String(JSON.parse(d).merged)))")
          PR_HEAD_REPO_FULL=$(echo "$PR_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.head.repo?j.head.repo.full_name:'')})")

          echo "PR #${{ inputs.source_pr }}: head=$PR_HEAD_SHA base=$PR_BASE_REF state=$PR_STATE merged=$PR_MERGED head_repo=$PR_HEAD_REPO_FULL"

          if [ "$PR_HEAD_SHA" != "${{ inputs.source_sha }}" ]; then
            echo "::error::source_sha does not match PR #${{ inputs.source_pr }}'s current head SHA ($PR_HEAD_SHA). The PR may have advanced since authorization, or the SHA is wrong. Refusing."
            exit 1
          fi
          if [ "$PR_BASE_REF" != "main" ]; then
            echo "::error::PR #${{ inputs.source_pr }} does not target main (base=$PR_BASE_REF). Refusing."
            exit 1
          fi
          if [ "$PR_STATE" != "open" ]; then
            echo "::error::PR #${{ inputs.source_pr }} is not open (state=$PR_STATE). If it already merged, use MAIN mode instead. Refusing."
            exit 1
          fi
          if [ "$PR_HEAD_REPO_FULL" != "${{ github.repository }}" ]; then
            echo "::error::PR #${{ inputs.source_pr }} head is not in this repository (found: '$PR_HEAD_REPO_FULL'). Refusing to fetch from an external fork."
            exit 1
          fi
          echo "✓ Source PR/SHA provenance verified via GitHub API"

      - name: Fetch pinned commit object (git object only — no checkout)
        if: inputs.mode == 'PINNED_PREDEPLOY'
        run: |
          git fetch --no-tags origin "${{ inputs.source_sha }}"
          if ! git cat-file -e "${{ inputs.source_sha }}^{commit}" 2>/dev/null; then
            echo "::error::source_sha ${{ inputs.source_sha }} could not be fetched as a valid commit object."
            exit 1
          fi
          echo "✓ Pinned commit object fetched into the local object store (working tree unchanged — still main)"

      - name: Extract ONLY the verified migration file via git-object read (no checkout, no execution)
        if: inputs.mode == 'PINNED_PREDEPLOY'
        run: |
          MIG_NAME="${{ inputs.migration_name }}"
          FILES=$(git ls-tree -r --name-only "${{ inputs.source_sha }}" -- "prisma/migrations/$MIG_NAME")
          FILE_COUNT=$(echo "$FILES" | grep -c . || true)
          if [ "$FILE_COUNT" != "1" ] || [ "$FILES" != "prisma/migrations/$MIG_NAME/migration.sql" ]; then
            echo "::error::Expected exactly one file (migration.sql) in prisma/migrations/$MIG_NAME at ${{ inputs.source_sha }}. Found:"
            echo "$FILES"
            exit 1
          fi
          git show "${{ inputs.source_sha }}:prisma/migrations/$MIG_NAME/migration.sql" > /tmp/pinned-migration.sql
          echo "✓ Extracted single migration.sql via 'git show' object read — no checkout of ${{ inputs.source_sha }}, no script from it executed"

      - name: Verify extracted migration checksum
        if: inputs.mode == 'PINNED_PREDEPLOY'
        run: |
          ACTUAL_SHA256=$(sha256sum /tmp/pinned-migration.sql | awk '{print $1}')
          if [ "$ACTUAL_SHA256" != "${{ inputs.migration_sha256 }}" ]; then
            echo "::error::Checksum mismatch. Expected ${{ inputs.migration_sha256 }}, got $ACTUAL_SHA256. Refusing to apply unverified content."
            exit 1
          fi
          echo "✓ Migration checksum verified: $ACTUAL_SHA256"

      - name: Verify migration-chain integrity against main and materialize verified file
        if: inputs.mode == 'PINNED_PREDEPLOY'
        run: |
          MIG_NAME="${{ inputs.migration_name }}"
          if [ -d "prisma/migrations/$MIG_NAME" ]; then
            echo "::error::Migration $MIG_NAME already exists in main — it is already merged. Use MAIN mode instead."
            exit 1
          fi
          LAST_LOCAL=$(ls prisma/migrations | grep -E '^[0-9]{14}_' | sort | tail -1)
          if [ -n "$LAST_LOCAL" ] && [ "$(printf '%s\n%s\n' "$LAST_LOCAL" "$MIG_NAME" | sort | tail -1)" != "$MIG_NAME" ]; then
            echo "::error::$MIG_NAME does not sort after the latest migration already in main ($LAST_LOCAL). Migration-chain integrity violated — refusing."
            exit 1
          fi
          mkdir -p "prisma/migrations/$MIG_NAME"
          cp /tmp/pinned-migration.sql "prisma/migrations/$MIG_NAME/migration.sql"
          echo "✓ Chain integrity verified ($MIG_NAME sorts after ${LAST_LOCAL:-<none>}); verified file materialized into the main-derived working tree"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Preflight check - OPERATOR_DATABASE_URL secret exists
        run: |
          if [ -z "${{ secrets.OPERATOR_DATABASE_URL }}" ]; then
            echo "::error::OPERATOR_DATABASE_URL secret is missing or empty"
            exit 1
          fi
          echo "✓ OPERATOR_DATABASE_URL secret is configured"

      - name: Remove local environment files
        run: |
          rm -f .env .env.local .env.production .env.staging .env.postgres .env.local.bak
          echo "✓ Removed all local .env files to prevent placeholder contamination"

      - name: Prisma generate
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
        run: npx prisma generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
        run: npx prisma validate

      - name: Validate DATABASE_URL safety
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
        run: |
          # Reject obvious placeholder values.
          if echo "$DATABASE_URL" | grep -qE 'REPLACE_|PLACEHOLDER|your_neon_url|example\.com'; then
            echo "::error::DATABASE_URL contains placeholder value - secret not properly configured"
            exit 1
          fi
          # Extract host for logging WITHOUT printing credentials.
          DB_HOST=$(node -e "try { const u = new URL(process.env.DATABASE_URL); console.log(u.hostname); } catch(e) { console.log('unparseable'); }" 2>/dev/null || echo "unparseable")
          echo "Database host: $DB_HOST"
          # Reject Neon pooler URL — migrations require a direct connection (no pgbouncer/advisory-lock issues).
          if echo "$DB_HOST" | grep -q '\-pooler\.'; then
            echo "::error::DATABASE_URL hostname contains '-pooler.' — migrations require a DIRECT (non-pooler) Neon URL."
            echo "::error::Set OPERATOR_DATABASE_URL in GitHub Secrets to the direct endpoint (without '-pooler' in the hostname)."
            exit 1
          fi
          echo "✓ DATABASE_URL safety checks passed (host: $DB_HOST)"
          echo "Note: this same secret and the same placeholder/pooler checks above apply identically in both MAIN and PINNED_PREDEPLOY mode — there is no mode-specific database target."

      - name: Verify exact production database host matches owner-pinned expectation
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
        run: node scripts/validate-expected-db-host.mjs

      # MAIN_BATCH preflight: READ ONLY and fail closed. Verifies, before ANY mutation: the manifest is valid and in main;
      # every batch migration.sql matches its manifest sha256 and passes the static additive-only scan; the live ledger has
      # no failed/unfinished/rolled-back row; the pending set is exactly the manifest (FRESH) or a resumable suffix of it
      # with the applied prefix finished and checksum-equal (RESUME); the non-batch ledger equals the manifest anchor
      # (count + hash); none of the objects about to be created already exists. Then it records the recovery point
      # (UTC time, WAL LSN, database name, ledger anchor). All reads are fixed, parameterized, inside BEGIN READ ONLY with
      # default_transaction_read_only=on enforced (the script refuses a session that is not read-only).
      - name: MAIN_BATCH preflight (read-only, fail-closed; records recovery point)
        if: inputs.mode == 'MAIN_BATCH'
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          BATCH_ID: ${{ inputs.batch_id }}
          OUTPUT_DIR: ${{ runner.temp }}/batch
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          node scripts/release/migration-batch.mjs preflight | tee "$RUNNER_TEMP/batch-preflight.txt"
          grep -q '^BATCH_GATE=PASS$' "$RUNNER_TEMP/batch-preflight.txt"
          {
            echo "## Production batch recovery point (recorded BEFORE any mutation)"
            echo ""
            echo '```json'
            cat "$OUTPUT_DIR/batch-recovery-point.json"
            echo '```'
            echo ""
            echo "Point-in-time-recovery coordinate. The provider's history-retention window on this project is 6 hours: a restore to this point is possible only inside that window."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "BATCH_PREFLIGHT_PASSED=true" >> "$GITHUB_ENV"

      - name: Upload batch recovery point and preflight record (before mutation)
        if: success() && inputs.mode == 'MAIN_BATCH'
        uses: actions/upload-artifact@v4
        with:
          name: batch-recovery-point
          path: ${{ runner.temp }}/batch/*.json
          if-no-files-found: error
          retention-days: 30

      - name: MAIN_BATCH cross-check against prisma migrate status (read-only)
        if: inputs.mode == 'MAIN_BATCH'
        env:
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
          MIGRATION_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          BATCH_ID: ${{ inputs.batch_id }}
          OUTPUT_DIR: ${{ runner.temp }}/batch
        run: |
          # `prisma migrate status` exits non-zero when migrations are pending (the expected state); guard the capture.
          set +e
          PRISMA_STATUS_TEXT=$(npx prisma migrate status 2>&1)
          PRISMA_STATUS_CODE=$?
          set -e
          echo "$PRISMA_STATUS_TEXT" | tee migration-status-before.txt
          STATUS_EXIT="$PRISMA_STATUS_CODE" STATUS_OUTPUT="$PRISMA_STATUS_TEXT" node scripts/release/migration-batch.mjs status-crosscheck
          echo "PREFLIGHT_PASSED=true" >> "$GITHUB_ENV"

      - name: Check pending migrations (pre-deploy)
        if: inputs.mode != 'MAIN_BATCH'
        env:
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
          MIGRATION_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
        run: |
          echo "=== Pre-deploy migration status ==="
          # `prisma migrate status` exits non-zero whenever migrations are
          # pending -- the EXPECTED state here. Capturing it via
          # `VAR=$(cmd)` under the shell's default `set -e` would abort
          # THIS LINE ITSELF before any of the parsing below ever ran.
          # set +e / capture / restore set -e is the safe idiom; the
          # classifier below is the actual gate.
          set +e
          STATUS_OUTPUT=$(npx prisma migrate status 2>&1)
          STATUS_EXIT=$?
          set -e
          echo "$STATUS_OUTPUT" | tee migration-status-before.txt
          echo "=== End pre-deploy status (exit $STATUS_EXIT) ==="

          # Both modes now require exactly migration_name to be the sole
          # pending migration before deploy is allowed to run. A non-zero
          # exit here (from the classifier's own process.exit(1), fail
          # closed on anything other than PREFLIGHT_CLASSIFICATION=
          # PENDING_EXPECTED) fails this step under set -e, which stops the
          # job before the Deploy migrations step below is ever reached.
          STATUS_EXIT="$STATUS_EXIT" STATUS_OUTPUT="$STATUS_OUTPUT" EXPECTED_MIGRATION_NAME="${{ inputs.migration_name }}" node scripts/classify-migrate-status.mjs
          echo "PREFLIGHT_PASSED=true" >> "$GITHUB_ENV"

      - name: Deploy migrations
        env:
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
          MIGRATION_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          OPSIQ_PRODUCTION_OPERATION: migrate deploy
        run: |
          echo "DEPLOY_STARTED=true" >> "$GITHUB_ENV"
          npx prisma migrate deploy
          echo "DEPLOY_SUCCEEDED=true" >> "$GITHUB_ENV"

      - name: MAIN_BATCH post-batch verification (blocking, ledger equals pre-batch anchor plus batch, every object present)
        if: inputs.mode == 'MAIN_BATCH'
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          BATCH_ID: ${{ inputs.batch_id }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          node scripts/release/migration-batch.mjs postverify | tee "$RUNNER_TEMP/batch-postverify.txt"
          grep -q '^BATCH_POSTVERIFY=PASS$' "$RUNNER_TEMP/batch-postverify.txt"
          echo "BATCH_POSTVERIFY_SUCCEEDED=true" >> "$GITHUB_ENV"

      - name: Verify migration status (post-deploy)
        env:
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
          MIGRATION_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
        run: |
          echo "=== Post-deploy migration status ==="
          # Same errexit hazard as the pre-deploy check above -- a failed
          # deploy leaves migrations pending/failed, which makes this
          # capture itself exit non-zero under set -e if not guarded.
          set +e
          STATUS_OUTPUT=$(npx prisma migrate status 2>&1)
          set -e
          echo "$STATUS_OUTPUT" | tee migration-status-after.txt
          echo "=== End post-deploy status ==="
          # Fail if any migration is not applied.
          if echo "$STATUS_OUTPUT" | grep -qiE 'pending|failed|not applied'; then
            echo "::error::One or more migrations remain pending or failed after deploy. Inspect migration-status-after.txt."
            exit 1
          fi
          echo "✓ All migrations applied successfully"
          echo "POST_VERIFY_SUCCEEDED=true" >> "$GITHUB_ENV"

      # Informational, READ-ONLY, NON-BLOCKING runtime-role access check (gap-detection follow-up to
      # docs/opsiq/product/RUNTIME_ROLE_CUTOVER.md §3's "After EVERY production migration that adds a
      # table: run `apply --only-if-present`..."). This step only RUNS `verify --phase post` -- the same
      # read-only catalog-check command .github/workflows/reconcile-runtime-role.yml's DISCOVER mode uses --
      # against the SAME OPERATOR_DATABASE_URL secret this job already holds (re-exposed under the
      # OWNER_DATABASE_URL name the tool itself requires; no new secret). It never calls `apply`, never
      # mutates anything, and `continue-on-error: true` guarantees a non-PASS result, or the check being
      # unable to run at all, can never fail this migration job. (The blocking reconcile and least-privilege gate
      # that follows this step is what decides promotion; this informational step only feeds a pre-reconcile summary
      # snapshot.) Its read-only guarantee now comes from the tool's own explicit BEGIN READ ONLY verification; PGOPTIONS
      # below is a redundant extra layer, not the guarantee. The result is parsed by the shared
      # scripts/db/parse-role-topology-verify.mjs and only ever surfaced in the job summary below.
      - name: Informational - check runtime role access after migration (read-only, non-blocking)
        if: success() && env.POST_VERIFY_SUCCEEDED == 'true'
        continue-on-error: true
        env:
          OWNER_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
          # Postgres itself rejects any write on this session, independent of what the tool contains.
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set +e
          npx tsx scripts/db/opsiq-role-cutover.ts verify --target production \
            --expected-host "$EXPECTED_DATABASE_HOST" \
            --phase post > runtime-role-verify-after-migration.txt 2>&1
          echo "=== Runtime role (opsiq_app) access check after migration (informational only) ==="
          cat runtime-role-verify-after-migration.txt
          echo "=== End runtime role access check ==="
          node scripts/db/parse-role-topology-verify.mjs runtime-role-verify-after-migration.txt > runtime-role-verify-summary.txt 2>&1
          cat runtime-role-verify-summary.txt
          echo "RUNTIME_ROLE_CHECK_RAN=true" >> "$GITHUB_ENV"
          # Always exit 0: continue-on-error already covers an unexpected failure above, but this step's
          # own job is only to inform, never to gate -- it must never contribute a red X to this job.
          exit 0

      # BLOCKING runtime-role reconcile (root-cause fix for the search_console_metrics incident: a migration
      # added a table, nothing reconciled opsiq_app's grants, and six consecutive production builds were
      # refused by the release gate). Applying a migration and reconciling the runtime role are now ONE
      # dependent sequence inside this already-approved, exact-host-pinned job: migration -> reconcile ->
      # least-privilege verification -> redeploy hook. Same reviewed tool, same OPERATOR_DATABASE_URL secret
      # this job already holds (no new secret, no new identity). The tool is reconcile-only: it never creates
      # the role, never sets a password, and recomputes the exact privilege set from prisma/schema.prisma.
      # MAIN mode only: PINNED_PREDEPLOY runs before the source PR merges, so its schema is not yet the
      # schema the reconcile would be computed from. A failure here fails the job and the redeploy hook below
      # does not run, so a release whose grants are not verified is never promoted.
      - name: Reconcile runtime role grants (blocking, reconcile-only)
        if: success() && (inputs.mode == 'MAIN' || inputs.mode == 'MAIN_BATCH') && env.POST_VERIFY_SUCCEEDED == 'true'
        env:
          OWNER_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          OPSIQ_RECONCILE_TARGET: production
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
        run: |
          set -euo pipefail
          # All decisions live in the unit-tested gate: valid exit statuses, complete/consistent verifier output,
          # production runtime role present, no grant gap/excess, no DDL/ownership/membership, exact release SHA.
          node scripts/release/runtime-role-reconcile-gate.mjs | tee "$RUNNER_TEMP/rr-gate.txt"
          grep -q '^RUNTIME_ROLE_GATE=PASS$' "$RUNNER_TEMP/rr-gate.txt"
          echo "RUNTIME_ROLE_RECONCILED=true" >> "$GITHUB_ENV"

      - name: Structural post-migration verification (version-controlled, parameterized query — no arbitrary SQL)
        if: inputs.mode == 'PINNED_PREDEPLOY'
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          MIGRATION_NAME: ${{ inputs.migration_name }}
        run: node scripts/verify-pinned-migration.mjs

      # Release gate hand-off (incident 58f1d87e). The production build of a commit
      # whose migrations are unapplied is refused by
      # scripts/release/production-migration-gate.mjs, so production stays on the
      # previous deployment. Once THIS workflow has applied and post-verified the
      # migration, redeploy main so the gate re-checks and the release is promoted.
      # The hook only asks Vercel to build main; the gate still decides. Optional:
      # without the VERCEL_PRODUCTION_DEPLOY_HOOK_URL secret the operator redeploys
      # main in Vercel (docs/deployment/PRODUCTION_RELEASE_PROCEDURE.md). The hook
      # URL is a secret and is never echoed.
      - name: Trigger production redeploy of main (release gate re-check)
        if: success() && (inputs.mode == 'MAIN' || inputs.mode == 'MAIN_BATCH') && env.POST_VERIFY_SUCCEEDED == 'true' && env.RUNTIME_ROLE_RECONCILED == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "REDEPLOY=manual" >> "$GITHUB_ENV"
            echo "::notice::VERCEL_PRODUCTION_DEPLOY_HOOK_URL is not configured - redeploy main in Vercel so the release gate re-checks and promotes it."
            exit 0
          fi
          curl -fsS -X POST --max-time 30 -o /dev/null "$DEPLOY_HOOK_URL"
          echo "REDEPLOY=triggered" >> "$GITHUB_ENV"

      - name: Migration summary
        if: always()
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_HOST: ${{ inputs.expected_database_host }}
          INPUT_MIGRATION_NAME: ${{ inputs.migration_name }}
          INPUT_BATCH_ID: ${{ inputs.batch_id }}
          INPUT_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          INPUT_SOURCE_PR: ${{ inputs.source_pr }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
        run: |
          echo "## Production Database Migration Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | $INPUT_MODE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Timestamp | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migration SHA (checked-out, always main) | \`${MIGRATION_SHA:-unknown}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Preflight passed | ${PREFLIGHT_PASSED:-false} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy started | ${DEPLOY_STARTED:-false} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy succeeded | ${DEPLOY_SUCCEEDED:-false} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Post-verify succeeded | ${POST_VERIFY_SUCCEEDED:-false} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime role reconciled and verified (blocking gate) | ${RUNTIME_ROLE_RECONCILED:-false} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/rr-gate.txt" ]; then
            GATE_CODE=$(grep -m1 '^RUNTIME_ROLE_GATE_CODE=' "$RUNNER_TEMP/rr-gate.txt" | cut -d= -f2 | tr -cd 'A-Z_')
            echo "| Runtime role gate code | ${GATE_CODE:-none} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Expected DB host (owner-pinned, exact-match enforced — both modes) | \`$INPUT_HOST\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migration (owner-authorized, exact-one-pending enforced — both modes) | \`$INPUT_MIGRATION_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$INPUT_MODE" == "MAIN_BATCH" ]; then
            echo "| Batch id (manifest-authorized) | \`$INPUT_BATCH_ID\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Expected main SHA (exact, enforced) | \`$INPUT_EXPECTED_MAIN_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Batch preflight passed (manifest, sha256, additive scan, ledger anchor, pending set) | ${BATCH_PREFLIGHT_PASSED:-false} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Batch post-verification passed | ${BATCH_POSTVERIFY_SUCCEEDED:-false} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$INPUT_MODE" == "PINNED_PREDEPLOY" ]; then
            echo "| Source PR | #$INPUT_SOURCE_PR |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Source SHA (git-object read only, never checked out) | \`$INPUT_SOURCE_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Migration checksum | \`$INPUT_MIGRATION_SHA256\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Operation | prisma migrate deploy (no seed, no reset) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f migration-status-after.txt ]; then
            echo "### Post-deploy migration status" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat migration-status-after.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Informational, non-blocking, PRE-RECONCILE snapshot: what the read-only check saw right after the migration and
          # BEFORE the blocking reconcile/gate step. It never affects DEPLOY_SUCCEEDED/POST_VERIFY_SUCCEEDED or the job outcome.
          echo "### Runtime role (\`opsiq_app\`) access right after the migration, before the reconcile — informational, non-blocking" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${RUNTIME_ROLE_CHECK_RAN:-false}" == "true" ] && [ -f runtime-role-verify-summary.txt ]; then
            RR_PARSE_RESULT=$(grep '^PARSE_RESULT=' runtime-role-verify-summary.txt | cut -d= -f2)
            RR_STATE=$(grep '^RUNTIME_ROLE_STATE=' runtime-role-verify-summary.txt | cut -d= -f2)
            RR_GAP_COUNT=$(grep '^GRANT_GAP_COUNT=' runtime-role-verify-summary.txt | cut -d= -f2)
            RR_GAP_TABLES=$(grep '^GRANT_GAP_TABLES=' runtime-role-verify-summary.txt | cut -d= -f2)
            if [ "$RR_PARSE_RESULT" != "OK" ]; then
              echo "Could not determine the runtime role's grant state after this migration (the check did not complete — see this run's \"Informational - check runtime role access after migration\" step log). This has **not** blocked the migration." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$RR_STATE" == "ABSENT" ]; then
              echo "The \`opsiq_app\` runtime role does not exist in production yet (the runtime-role cutover has not been performed). This check is only meaningful after that cutover; no action is needed from this migration alone." >> "$GITHUB_STEP_SUMMARY"
            elif [ -n "$RR_GAP_COUNT" ] && [ "$RR_GAP_COUNT" != "0" ]; then
              if [ "${RUNTIME_ROLE_RECONCILED:-false}" == "true" ]; then
                echo "This migration added table(s) the runtime role could not yet access; the blocking reconcile in this run has since granted and verified them (see the gate row above)." >> "$GITHUB_STEP_SUMMARY"
              else
              echo "⚠️ **This migration added table(s) the runtime role cannot yet access and the blocking reconcile did not complete — run the 'Reconcile Runtime Role' workflow (APPLY mode) before relying on this table in production, or the next deploy's release gate will block again.**" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Inaccessible table(s) ($RR_GAP_COUNT): \`${RR_GAP_TABLES:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "✓ The runtime role already has full access to every Prisma-modelled table — no reconcile needed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "This check did not run for this dispatch (e.g. the migration deploy or its post-verify did not succeed). This has **not** blocked the migration." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Result" >> "$GITHUB_STEP_SUMMARY"
          # Success language is derived from actual step outcomes, never
          # from mode alone -- a preflight-only failure must never claim
          # the migration was applied (see incident: the pre-deploy status
          # capture could previously abort the job under bash's default
          # set -e before prisma migrate deploy ever ran, while this
          # always()-run summary still unconditionally printed "Production
          # now has <migration> applied").
          if [ "${DEPLOY_SUCCEEDED:-false}" == "true" ] && [ "${POST_VERIFY_SUCCEEDED:-false}" == "true" ]; then
            if [ "$INPUT_MODE" == "PINNED_PREDEPLOY" ]; then
              echo "Production now has \`$INPUT_MIGRATION_NAME\` applied." >> "$GITHUB_STEP_SUMMARY"
            else
              if [ "${RUNTIME_ROLE_RECONCILED:-false}" == "true" ]; then
              echo "Production migrations applied successfully and the runtime role was reconciled and verified." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**Migrations applied, but the runtime-role gate did NOT pass: the release is NOT promoted (no redeploy). Inspect the gate step.**" >> "$GITHUB_STEP_SUMMARY"
            fi
            fi
          elif [ "${DEPLOY_STARTED:-false}" != "true" ]; then
            echo "**MIGRATION_NOT_EXECUTED** — preflight did not pass; \`prisma migrate deploy\` was never run. No production schema mutation occurred in this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**MIGRATION_RESULT_UNCERTAIN_OR_FAILED** — deploy was started but did not both complete and pass post-verification. Inspect this job's logs and migration-status-after.txt (if present) before taking any action. Do not assume the migration is applied." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$INPUT_MODE" == "PINNED_PREDEPLOY" ] && [ "${DEPLOY_SUCCEEDED:-false}" == "true" ] && [ "${POST_VERIFY_SUCCEEDED:-false}" == "true" ]; then
            echo "### Transient state — expected until source PR merges" >> "$GITHUB_STEP_SUMMARY"
            echo "Production now has \`$INPUT_MIGRATION_NAME\` applied, but that migration folder" >> "$GITHUB_STEP_SUMMARY"
            echo "does not yet exist in \`main\`. Anyone running \`prisma migrate status\` against" >> "$GITHUB_STEP_SUMMARY"
            echo "production before PR #$INPUT_SOURCE_PR merges will see it reported as" >> "$GITHUB_STEP_SUMMARY"
            echo "\"applied but not found locally\" — this is expected and requires no action." >> "$GITHUB_STEP_SUMMARY"
            echo "It reconciles automatically once PR #$INPUT_SOURCE_PR merges into main." >> "$GITHUB_STEP_SUMMARY"
            echo "Do NOT run \`prisma migrate resolve\` or hand-edit \`_prisma_migrations\` in response to this." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Production redeploy of main (release gate re-check): ${REDEPLOY:-not attempted}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Important:** Verify the production app is healthy after migrations (e.g. \`/api/health\`, \`/api/readiness\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "If \`prisma migrate deploy\` reported a failed migration, do not re-run this workflow blindly:" >> "$GITHUB_STEP_SUMMARY"
          echo "inspect the failure in migration-status-after.txt, fix the underlying issue, then apply" >> "$GITHUB_STEP_SUMMARY"
          echo "\`prisma migrate resolve --applied <name>\` or \`--rolled-back <name>\` as appropriate before retrying." >> "$GITHUB_STEP_SUMMARY"
