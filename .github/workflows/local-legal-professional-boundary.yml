name: Local / Legal / Professional-Boundary Pack (DB + Browser + Mobile)

# Proof that all 100 counted Local/Legal/Professional-Boundary scenarios run through the REAL DB-backed owner plan
# path and render the runtime-fed Supervisor Summary in a real browser (desktop + mobile). OpsIQ respects the
# professional boundary: it prepares + routes tax/legal/compliance matters to the owner + a qualified professional,
# blocks professional/legal boundaries (professional-review-required) and fabricated documents, owner-gates
# material engage/settle/pay calls, and only files already-professional-prepared routine items. Additive lane; does
# NOT modify any existing workflow.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  llb-db:
    name: All-100 Local/Legal/Boundary DB-backed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      TEST_WITH_DB: "true"
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: opsiq_test }
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 10s
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: npm }
      - run: npm ci
      - name: Prisma migrate + generate
        run: |
          npx prisma migrate deploy
          npx prisma generate
      - name: Local/Legal schema + invariant tests
        run: npx vitest run src/__tests__/scenarios/local-legal-professional-boundary-pack.test.ts
      - name: All-100 Local/Legal DB-backed proof
        run: npx vitest run src/__tests__/scenarios/local-legal-professional-boundary-db.db.test.ts
      - name: Assert Local/Legal DB covered exactly 100
        run: |
          node -e '
            const d=require("./OPSIQ_LOCAL_LEGAL_PROFESSIONAL_BOUNDARY_PACK.run.json");
            const pass=Object.values(d.results).filter(r=>r.dbStatus==="pass").length;
            if(d.count!==100||pass!==100){console.error("LLB DB not 100/100:",d.count,pass);process.exit(1);}
            console.log("LLB DB 100/100 OK");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llb-db-ledger
          path: OPSIQ_LOCAL_LEGAL_PROFESSIONAL_BOUNDARY_PACK.run.json
          retention-days: 7

  llb-browser:
    name: All-100 Local/Legal/Boundary desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      AUTH_SECRET: e2e-test-auth-secret-not-a-real-secret
      AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      BASE_URL: http://localhost:3001
      TEST_WITH_DB: "true"
      LLB_SHARD_INDEX: ${{ matrix.shard }}
      LLB_SHARD_TOTAL: 2
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: opsiq_test }
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 10s
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: npm }
      - run: npm ci
      - name: Configure .env.local
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          AUTH_SECRET=e2e-test-auth-secret-not-a-real-secret
          AUTH_URL=http://localhost:3001
          NEXT_PUBLIC_APP_URL=http://localhost:3001
          TEST_WITH_DB=true
          EOF
      - name: Prisma migrate + generate
        run: |
          npx prisma migrate deploy
          npx prisma generate
      - name: Build app
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Seed all 100 Local/Legal businesses
        run: npx tsx scripts/seed-local-legal-professional-boundary-e2e.ts
      - name: Start app
        run: |
          PORT=3001 npm run start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login || echo 000)
            if [ "$code" != "000" ]; then echo "app up (HTTP $code)"; break; fi
            sleep 2
          done
      - name: Local/Legal desktop shard ${{ matrix.shard }}/2
        run: npx playwright test tests/browser/37-local-legal-desktop.spec.ts --project=chromium
      - name: Local/Legal mobile shard ${{ matrix.shard }}/2
        run: npx playwright test tests/browser/38-local-legal-mobile.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llb-browser-shard-${{ matrix.shard }}
          path: "OPSIQ_LOCAL_LEGAL_PROFESSIONAL_BOUNDARY_*.run.json"
          retention-days: 7
