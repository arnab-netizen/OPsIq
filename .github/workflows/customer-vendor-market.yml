name: Customer / Vendor / Market Pack (DB + Browser + Mobile)

# Proof that all 100 counted Customer/Vendor/Market scenarios run through the REAL DB-backed owner plan path and
# render the runtime-fed Supervisor Summary in a real browser (desktop + mobile). OpsIQ handles customer/vendor/
# market decisions safely: routine in-policy handling proceeds, missing figures block on data, material
# relationship/contract/pricing calls are owner-gated, and consumer/contract/anti-competitive boundaries or a
# fraudulent refund / falsified vendor credential are blocked. Additive lane; does NOT modify any existing workflow.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  cvm-db:
    name: All-100 Customer/Vendor/Market DB-backed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      TEST_WITH_DB: "true"
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: opsiq_test }
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 10s
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: npm }
      - name: Install dependencies (bounded retry on transient npm failure)
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i/3); retrying in $((i*10))s..."
            sleep $((i*10))
          done
      - name: Prisma migrate + generate
        run: |
          npx prisma migrate deploy
          npx prisma generate
      - name: Customer/Vendor schema + invariant tests
        run: npx vitest run src/__tests__/scenarios/customer-vendor-market-pack.test.ts
      - name: All-100 Customer/Vendor DB-backed proof
        run: npx vitest run src/__tests__/scenarios/customer-vendor-market-db.db.test.ts
      - name: Assert Customer/Vendor DB covered exactly 100
        run: |
          node -e '
            const d=require("./OPSIQ_CUSTOMER_VENDOR_MARKET_PACK.run.json");
            const pass=Object.values(d.results).filter(r=>r.dbStatus==="pass").length;
            if(d.count!==100||pass!==100){console.error("CVM DB not 100/100:",d.count,pass);process.exit(1);}
            console.log("CVM DB 100/100 OK");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvm-db-ledger
          path: OPSIQ_CUSTOMER_VENDOR_MARKET_PACK.run.json
          retention-days: 7

  cvm-browser:
    name: All-100 Customer/Vendor/Market desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      AUTH_SECRET: e2e-test-auth-secret-not-a-real-secret
      AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      BASE_URL: http://localhost:3001
      TEST_WITH_DB: "true"
      CVM_SHARD_INDEX: ${{ matrix.shard }}
      CVM_SHARD_TOTAL: 2
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: opsiq_test }
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 10s
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: npm }
      - name: Install dependencies (bounded retry on transient npm failure)
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i/3); retrying in $((i*10))s..."
            sleep $((i*10))
          done
      - name: Configure .env.local
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          AUTH_SECRET=e2e-test-auth-secret-not-a-real-secret
          AUTH_URL=http://localhost:3001
          NEXT_PUBLIC_APP_URL=http://localhost:3001
          TEST_WITH_DB=true
          EOF
      - name: Prisma migrate + generate
        run: |
          npx prisma migrate deploy
          npx prisma generate
      - name: Build app
        run: npm run build
        env:
          # CI-only heap bump. `next build`'s TypeScript/codegen pass intermittently
          # hits the default ~2 GB limit on these browser packs (FATAL: heap out of
          # memory / SIGABRT). Mirrors the required build-and-test lane (ci.yml).
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Install Playwright Chromium
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            echo "playwright install failed (attempt $i/3); retrying in $((i*15))s..."
            sleep $((i*15))
          done
      - name: Seed all 100 Customer/Vendor businesses
        run: npx tsx scripts/seed-customer-vendor-market-e2e.ts
      - name: Start app
        run: |
          PORT=3001 npm run start > /tmp/app.log 2>&1 &
          up=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login || echo 000)
            if [ "$code" != "000" ]; then echo "app up (HTTP $code)"; up=1; break; fi
            sleep 2
          done
          if [ "$up" != "1" ]; then
            echo "::error::APP_START_FAILED — app did not respond on :3001 within 120s (build/start collapse, not a test failure). Dumping /tmp/app.log:"
            cat /tmp/app.log || true
            exit 1
          fi
      - name: Customer/Vendor desktop shard ${{ matrix.shard }}/2
        run: npx playwright test tests/browser/35-customer-vendor-desktop.spec.ts --project=chromium
      - name: Customer/Vendor mobile shard ${{ matrix.shard }}/2
        run: npx playwright test tests/browser/36-customer-vendor-mobile.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvm-browser-shard-${{ matrix.shard }}
          path: "OPSIQ_CUSTOMER_VENDOR_MARKET_*.run.json"
          retention-days: 7
