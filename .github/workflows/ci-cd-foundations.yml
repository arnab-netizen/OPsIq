name: CI/CD Foundations - Phase 13 Slice 1

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build + Type + Prisma Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    permissions:
      contents: read
      pull-requests: write
      issues: write

    # DB-backed tests in the maintained suite need a real database. Mirror the
    # proven postgres:16 pattern from the green `ci.yml` build-and-test lane so the
    # full suite runs WITH a DB (TEST_WITH_DB=true) instead of failing on the
    # DB-backed tests it was running without one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
          POSTGRES_INITDB_ARGS: "-c log_min_messages=warning"
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      SKIP_ENV_VALIDATION: "true"
      TEST_WITH_DB: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure .env.local for CI PostgreSQL service
        # prisma.config.ts loads .env.local with override:true; write the CI service
        # URL before Prisma runs (mirrors ci.yml).
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          TEST_WITH_DB=true
          EOF

      - name: Prisma database migration
        run: npx prisma migrate deploy

      - name: Regenerate Prisma client after migrations
        run: npx prisma generate

      - name: Run tests
        run: |
          set +e
          # Full maintained suite WITH a DB, excluding only the pre-existing
          # quarantined files (identical policy to the green ci.yml lane).
          EXCLUDES=$(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.files.map(f=>'--exclude '+f.path).join(' '))")
          npx vitest run --maxWorkers 1 $EXCLUDES 2>&1 | tee run-tests.log
          GATE_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "## run-tests diagnostic summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- exit_code: ${GATE_EXIT_CODE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: vitest run (quarantine-excluded)" >> "$GITHUB_STEP_SUMMARY"
          echo "- environment: TEST_WITH_DB=true (postgres:16), NODE_ENV=test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$GATE_EXIT_CODE" -ne 0 ]; then
            echo "**First 120 error-related lines:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -nE 'FAIL|Failed|Error:|AssertionError|Expected|Received|TypeError|ReferenceError|DATABASE_URL|Prisma|vitest|exit code|Cannot|failed|timeout' run-tests.log | head -120 >> "$GITHUB_STEP_SUMMARY" || echo "(no matching error lines)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Final 120 lines of output:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -120 run-tests.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          FIRST_ERROR="$(grep -nE 'FAIL|Failed|Error:|AssertionError|Expected|Received|TypeError|ReferenceError|DATABASE_URL|Prisma|vitest|exit code' run-tests.log | head -1 || true)"
          if [ -n "$FIRST_ERROR" ]; then
            echo "::error title=run-tests first error::$FIRST_ERROR"
          fi

          exit "$GATE_EXIT_CODE"

      - name: Post test failure to PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logContent = fs.readFileSync('run-tests.log', 'utf8');
            const lines = logContent.split('\n');

            // Extract first 120 error lines
            const errorLines = lines.filter(l => /FAIL|Failed|Error:|AssertionError|Expected|Received|TypeError|ReferenceError|DATABASE_URL|Prisma|vitest|exit code|Cannot|failed|timeout|TEST_WITH_DB/.test(l)).slice(0, 120);

            // Get final 120 lines
            const finalLines = lines.slice(-120);

            // Build comment
            let comment = `## PR #28 CI Diagnostic — Run Tests Failed\n\n`;
            comment += `**Workflow:** CI/CD Foundations - Phase 13 Slice 1\n`;
            comment += `**Job:** Run Tests\n`;
            comment += `**Commit:** ${context.payload.pull_request.head.sha.substring(0, 7)}\n`;
            comment += `**Command:** npm test\n`;
            comment += `**Status:** FAILED\n\n`;

            if (errorLines.length > 0) {
              comment += `**First Error Lines:**\n\`\`\`\n${errorLines.join('\n')}\n\`\`\`\n\n`;
            }

            comment += `**Final 120 Log Lines:**\n\`\`\`\n${finalLines.join('\n')}\n\`\`\`\n\n`;
            comment += `<!-- PR28-CI-RUN-TESTS-DIAGNOSTIC -->`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes('PR28-CI-RUN-TESTS-DIAGNOSTIC'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Upload test logs (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-tests-logs
          path: run-tests.log
          retention-days: 7

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "Tests executed on ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  branch-protection:
    name: Enforce Branch Protection
    runs-on: ubuntu-latest
    needs: [verify, test]
    if: always()

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR status
        if: github.event_name == 'pull_request'
        run: |
          # All previous jobs must pass
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "::error::Build/Type/Prisma verify failed"
            exit 1
          fi
          echo "✓ CI/CD gate passed for PR #${{ github.event.pull_request.number }}"

      - name: Report workflow status
        if: always()
        run: |
          echo "### Workflow Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Verify (build/type/prisma) | ${{ needs.verify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow**: [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Auto-deploy to Staging
    runs-on: ubuntu-latest
    needs: [verify, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'staging',
              auto_merge: false,
              required_contexts: [],
              description: 'Auto-deployment to staging from CI/CD pipeline'
            });
            console.log('Deployment created:', deployment.data.id);

      - name: Deployment notification
        run: |
          echo "### Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Staged deployment prepared for commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "(Manual approval required before production push)" >> $GITHUB_STEP_SUMMARY
