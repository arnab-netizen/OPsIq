name: CI/CD Foundations - Phase 13 Slice 1

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build + Type + Prisma Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    env:
      NODE_ENV: test
      SKIP_ENV_VALIDATION: "true"
      TEST_WITH_DB: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          set +e
          npm test 2>&1 | tee ci-cd-foundations-tests.log
          GATE_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "## ci-cd-foundations-tests diagnostic summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- exit_code: ${GATE_EXIT_CODE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: npm test (with TEST_WITH_DB=false)" >> "$GITHUB_STEP_SUMMARY"
          echo "- purpose: Non-database tests only (fast gate)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -400 ci-cd-foundations-tests.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          FIRST_ERROR="$(grep -nE 'FAIL|Failed|Error:|AssertionError|Expected|Received|TypeError|ReferenceError|vitest|exit code' ci-cd-foundations-tests.log | head -1 || true)"
          if [ -n "$FIRST_ERROR" ]; then
            echo "::error title=ci-cd-foundations-tests first error::$FIRST_ERROR"
          fi

          exit "$GATE_EXIT_CODE"

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "Tests executed on ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  upload-test-logs:
    name: Upload Test Logs
    runs-on: ubuntu-latest
    if: always()
    needs: test

    steps:
      - name: Upload ci-cd-foundations test logs (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-foundations-test-logs
          path: ci-cd-foundations-tests.log
          retention-days: 7

  branch-protection:
    name: Enforce Branch Protection
    runs-on: ubuntu-latest
    needs: [verify, test]
    if: always()

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR status
        if: github.event_name == 'pull_request'
        run: |
          # All previous jobs must pass
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "::error::Build/Type/Prisma verify failed"
            exit 1
          fi
          echo "✓ CI/CD gate passed for PR #${{ github.event.pull_request.number }}"

      - name: Report workflow status
        if: always()
        run: |
          echo "### Workflow Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Verify (build/type/prisma) | ${{ needs.verify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow**: [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Auto-deploy to Staging
    runs-on: ubuntu-latest
    needs: [verify, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'staging',
              auto_merge: false,
              required_contexts: [],
              description: 'Auto-deployment to staging from CI/CD pipeline'
            });
            console.log('Deployment created:', deployment.data.id);

      - name: Deployment notification
        run: |
          echo "### Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Staged deployment prepared for commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "(Manual approval required before production push)" >> $GITHUB_STEP_SUMMARY
