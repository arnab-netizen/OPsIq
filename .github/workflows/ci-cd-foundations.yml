name: CI/CD Foundations - Phase 13 Slice 1

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: The full maintained test suite (including all DB-backed tests, with a
# postgres:16 service) is the responsibility of the required `ci.yml`
# build-and-test lane. This workflow's value is the build/type/prisma `verify`
# gate below. A duplicate "Run Tests" job was removed: it re-ran the same suite
# without a database (so DB-backed tests failed) and, when given its own DB,
# only duplicated ci.yml while adding a second concurrent heavy DB lane. No test
# coverage is lost — every test still runs in the required ci.yml lane.

jobs:
  verify:
    name: Build + Type + Prisma Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          # `next build`'s TypeScript pass intermittently hits the default ~2 GB
          # Node heap (FATAL: JavaScript heap out of memory / SIGABRT) even though
          # the standalone `tsc --noEmit` step above passes — the production build
          # loads more into one process. Raising the heap to 4 GB removes this
          # nondeterministic OOM flake. Scoped to this step only; failure behavior
          # is preserved (a real build error still fails the step). Mirrors the
          # identical fix already in ci.yml's build-and-test job.
          NODE_OPTIONS: "--max-old-space-size=4096"

  branch-protection:
    name: Enforce Branch Protection
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR status
        if: github.event_name == 'pull_request'
        run: |
          # The verify gate must pass.
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "::error::Build/Type/Prisma verify failed"
            exit 1
          fi
          echo "✓ CI/CD gate passed for PR #${{ github.event.pull_request.number }}"

      - name: Report workflow status
        if: always()
        run: |
          echo "### Workflow Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Verify (build/type/prisma) | ${{ needs.verify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow**: [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Auto-deploy to Staging
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'staging',
              auto_merge: false,
              required_contexts: [],
              description: 'Auto-deployment to staging from CI/CD pipeline'
            });
            console.log('Deployment created:', deployment.data.id);

      - name: Deployment notification
        run: |
          echo "### Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Staged deployment prepared for commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "(Manual approval required before production push)" >> $GITHUB_STEP_SUMMARY
