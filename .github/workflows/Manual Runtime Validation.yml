name: Manual Runtime Validation

on:
  workflow_dispatch:
    inputs:
      reset_database:
        description: "DANGER: Drop public schema before deploy"
        required: true
        default: "false"
      run_tests:
        description: "Run unit tests"
        required: true
        default: "true"

jobs:
  validate:
    name: Runtime validation against Neon DB
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Hard reset public schema
        if: ${{ inputs.reset_database == 'true' }}
        run: |
          npx prisma db execute --stdin <<'SQL'
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          GRANT ALL ON SCHEMA public TO public;
          SQL

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check schema drift
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Build application
        run: npm run build

      - name: Run unit tests
        if: ${{ inputs.run_tests == 'true' }}
        run: npm run test:merge

      - name: Success note
        run: echo "DB RESET + MIGRATIONS + BUILD + TESTS PASSED"
