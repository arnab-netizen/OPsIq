name: Module 2 Finance Runtime Proof

# Manual only. Proves the deployed Module 2 Finance API loop against a
# network-reachable deployment over HTTP (no direct DB access). Creates a
# synthetic owner session and exercises /api/owner/finance/* end to end, then
# runs security checks. It does NOT run migrations and does NOT print secrets.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed base URL to prove'
        required: false
        default: 'https://o-ps-iq.vercel.app'
      confirm:
        description: 'Must equal RUN_MODULE2_FINANCE_RUNTIME_PROOF'
        required: true

concurrency:
  group: module-2-finance-runtime-proof
  cancel-in-progress: false

jobs:
  runtime-proof:
    name: Finance API deployed runtime proof
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Confirmation phrase guard (fail closed)
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RUN_MODULE2_FINANCE_RUNTIME_PROOF" ]; then
            echo "::error::Confirmation phrase mismatch. Type RUN_MODULE2_FINANCE_RUNTIME_PROOF to proceed."
            exit 1
          fi
          echo "✓ Confirmation accepted. Target: ${{ github.event.inputs.base_url || 'https://o-ps-iq.vercel.app' }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Full install (NOT --omit=dev): the smoke script runs via `tsx`, a devDependency.
      - name: Install dependencies
        run: npm ci

      # The smoke script imports no server code, but `npm ci` runs `prisma generate`
      # via postinstall; this is a harmless explicit refresh and never connects to a DB.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Finance deployed runtime proof
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://o-ps-iq.vercel.app' }}
        run: |
          set -o pipefail
          npx tsx scripts/smoke-owner-finance-runtime-proof.ts | tee finance-runtime-proof.log

      - name: Upload runtime-proof summary (safe — masked IDs only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-2-finance-runtime-proof-log
          path: finance-runtime-proof.log
          if-no-files-found: ignore

      - name: Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Module 2 Finance deployed runtime proof PASSED against ${{ github.event.inputs.base_url || 'https://o-ps-iq.vercel.app' }}"
          else
            echo "❌ Module 2 Finance deployed runtime proof FAILED — see log/artifact for the exact failing step, endpoint, and status."
          fi
