name: DB Verification

# Verifies DB schema, migration state, and full DB test suite.
#
# CI-MIN-01 owner correction (items 1-3): this workflow is workflow_dispatch
# ONLY now. It is NOT a merge gate and was never one in practice -- the only
# required GitHub status check on main is `branch-protection` (confirmed via
# the repo's branch ruleset), so this workflow's own pull_request-triggered
# run could be red, absent, or stale on a DB-risk PR and nothing would block
# the merge. Automatic pre-merge DB validation now runs INSIDE ci.yml's own
# `db-verify` job, gated directly by the classifier's `db_required` output
# (see scripts/ci-risk-classifier.mjs) -- one classifier is authoritative
# for DB risk, not a second, separate static path-filter list here. This
# workflow stays available for explicit Neon/throwaway-Postgres
# re-verification (LANE_A/LANE_B below), never as an automatic gate.
#
# Two lanes:
#   LANE_B (default) — spins up a throwaway postgres:16 service container,
#                      runs prisma migrate deploy against it, then runs the full
#                      DB test suite. Safe for all branches. No secrets needed.
#
#   LANE_A (opt-in)  — triggered via workflow_dispatch with use_neon_secrets=true.
#                      Uses DATABASE_URL / TEST_DATABASE_URL / MIGRATION_DATABASE_URL
#                      from GitHub secrets. Runs prisma migrate status (read-only)
#                      and the DB test suite against TEST_DATABASE_URL.
#                      Does NOT run prisma migrate deploy — operator runs that
#                      from a controlled environment once status confirms it is safe.
#
# NEVER runs against production.
# NEVER runs prisma migrate reset or prisma db push.
# LANE_A migrate deploy is intentionally absent — status + tests only.

on:
  workflow_dispatch:
    inputs:
      use_neon_secrets:
        description: 'LANE_A: use Neon secrets (DATABASE_URL, TEST_DATABASE_URL, MIGRATION_DATABASE_URL). Requires those secrets to be set. Set true only for staging/test Neon DB.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# workflow_dispatch runs (both lanes) are never cancelled by a concurrent
# run (no github.ref grouping needed now that there is no pull_request
# trigger to debounce).
concurrency:
  group: db-verification-${{ github.run_id }}
  cancel-in-progress: false

# ─── LANE B ───────────────────────────────────────────────────────────────────
jobs:
  lane-b-db-verify:
    name: 'LANE_B — Local Postgres (throwaway)'
    # workflow_dispatch is the only trigger now (CI-MIN-01) -- LANE_B runs
    # unless the operator explicitly opted into LANE_A via use_neon_secrets.
    if: github.event.inputs.use_neon_secrets != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
        ports:
          - 5432:5432

    env:
      OPSIQ_DB_TARGET: ci
      # All three URLs point at the throwaway postgres:16 container above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      TEST_WITH_DB: 'true'
      NODE_ENV: test
      SKIP_ENV_VALIDATION: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify rolldown native binding
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu'); console.log('✓ rolldown binding present')"

      - name: Configure local test environment
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          MIGRATION_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          NODE_ENV=test
          SKIP_ENV_VALIDATION=true
          EOF
          echo "✓ .env.local written for LANE_B postgres:16 service container"

      - name: Record exact checkout identity (SHA and tree)
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          if [ "$HEAD_SHA" != "${{ github.sha }}" ]; then
            echo "::error::checked-out SHA $HEAD_SHA != dispatched SHA ${{ github.sha }}"
            exit 1
          fi
          echo "::notice title=checkout-identity::sha=$HEAD_SHA tree=$TREE"
          echo "CHECKOUT_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "CHECKOUT_TREE=$TREE" >> "$GITHUB_ENV"

      # Root cause F-RESTORE-PROOF-PG-MAJOR-MISMATCH (run 45860892252 on this branch, and PR #660 run 43274968678): the
      # runner's default pg_dump is newer than the postgres:16 service container; a newer pg_dump emits
      # `SET transaction_timeout = 0;`, which a PG16 server rejects, so every runner-made dump failed to restore.
      # Use the client whose major matches the server and FAIL CLOSED if it does not. Same approach as ci.yml.
      - name: Install PostgreSQL 16 client and require matching client/server major
        id: pgclient
        run: |
          . /etc/os-release
          if ! sudo apt-get install -y --no-install-recommends postgresql-client-16 > "$RUNNER_TEMP/apt1.log" 2>&1; then
            echo "::warning title=apt-archive-install-failed::$(tail -5 "$RUNNER_TEMP/apt1.log" | tr '\n' ' ' | cut -c1-700)"
            sudo apt-get install -y --no-install-recommends curl ca-certificates
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update
            if ! sudo apt-get install -y --no-install-recommends postgresql-client-16 > "$RUNNER_TEMP/apt2.log" 2>&1; then
              echo "::error title=apt-pgdg-install-failed::$(tail -5 "$RUNNER_TEMP/apt2.log" | tr '\n' ' ' | cut -c1-700)"
              exit 1
            fi
          fi
          PGBIN=/usr/lib/postgresql/16/bin
          test -x "$PGBIN/pg_dump" && test -x "$PGBIN/psql"
          export PATH="$PGBIN:$PATH"
          echo "$PGBIN" >> "$GITHUB_PATH"
          SRV_NUM="$(PGPASSWORD=postgres psql -h localhost -U postgres -d opsiq_test -tAc 'show server_version_num')"
          SRV_MAJOR=$((SRV_NUM / 10000))
          DUMP_MAJOR="$(pg_dump --version | sed -E 's/^pg_dump \(PostgreSQL\) ([0-9]+).*/\1/')"
          PSQL_MAJOR="$(psql --version | sed -E 's/^psql \(PostgreSQL\) ([0-9]+).*/\1/')"
          if [ "$DUMP_MAJOR" != "$SRV_MAJOR" ] || [ "$PSQL_MAJOR" != "$SRV_MAJOR" ]; then
            echo "::error::client majors (pg_dump $DUMP_MAJOR, psql $PSQL_MAJOR) != PostgreSQL server major $SRV_MAJOR; dumps would not restore"
            exit 1
          fi
          echo "PG_SERVER_MAJOR=$SRV_MAJOR" >> "$GITHUB_ENV"
          echo "PG_CLIENT_MAJOR=$DUMP_MAJOR" >> "$GITHUB_ENV"
          echo "::notice title=pg-versions::$(pg_dump --version) | $(psql --version) | server_major=$SRV_MAJOR"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prisma validate
        id: validate
        run: npx prisma validate

      # MIGRATION_DATABASE_URL is the local throwaway container — safe to deploy.
      # migrate reset and db push are NOT run.
      - name: Prisma migrate deploy (throwaway container)
        id: migrate-deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}

      # Repository-standard gates (same commands as ci.yml), against the exact checked-out tree. No production
      # secret is needed: SKIP_ENV_VALIDATION is the repository's existing non-production build configuration.
      - name: TypeScript type checking
        id: typecheck
        run: npx tsc --noEmit

      - name: Run linter (single traversal -> JSON report)
        run: npm run lint -- -f json -o eslint-report.json
        continue-on-error: true

      - name: Lint ratchet (block new lint debt)
        id: lint-ratchet
        run: npm run lint:ratchet -- --from-result eslint-report.json

      - name: Production build
        id: build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Restore-portability proof (every test must pass, none skipped)
        id: restore-proof
        run: |
          npx vitest run src/__tests__/scripts/restore-database-portability.db.test.ts --reporter=json --outputFile="$RUNNER_TEMP/restore-portability.json"
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/restore-portability.json", "utf8"));
            const t = r.testResults.flatMap((f) => f.assertionResults);
            const by = (s) => t.filter((x) => x.status === s).length;
            const passed = by("passed"), failed = by("failed"), skipped = t.length - passed - failed;
            console.log("::notice title=restore-portability-results::tests=" + t.length + " passed=" + passed + " failed=" + failed + " skipped_or_pending=" + skipped);
            for (const x of t) console.log("::notice title=restore-portability-test::" + x.status + " | " + x.title.slice(0, 150));
            const has = (re) => t.some((x) => re.test(x.title) && x.status === "passed");
            const ok = t.length >= 7 && failed === 0 && skipped === 0 && has(/client and server majors match/) && has(/simulated stock macOS/) && has(/native tool environment/);
            if (!ok) { console.log("::error::restore portability proof incomplete: every test must pass (none skipped)"); process.exit(1); }
          '
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_WITH_DB: 'true'
          NODE_ENV: test
          OPSIQ_REQUIRE_RESTORE_PORTABILITY: '1'
          RESTORE_PORTABILITY_EXPECT_MAJOR: '16'

      - name: Run full DB test suite
        id: db-tests
        run: |
          mkdir -p artifacts/db-verification
          set +e
          npm test -- '.db.test.ts' --maxWorkers=1 \
            2>&1 | tee artifacts/db-verification/lane-b-db-tests.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          exit $TEST_EXIT
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_WITH_DB: 'true'
          NODE_ENV: test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lane-b-db-verification-logs
          path: artifacts/db-verification/
          retention-days: 14

      - name: Write GITHUB_STEP_SUMMARY
        if: always()
        run: |
          VALIDATE="${{ steps.validate.outcome }}"
          DEPLOY="${{ steps.migrate-deploy.outcome }}"
          TESTS="${{ steps.db-tests.outcome }}"
          ok() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          OVERALL=$([ "$TESTS" = "success" ] && [ '${{ steps.typecheck.outcome }}' = "success" ] && [ '${{ steps.lint-ratchet.outcome }}' = "success" ] && [ '${{ steps.build.outcome }}' = "success" ] && [ '${{ steps.restore-proof.outcome }}' = "success" ] && echo "✅ LANE_B_DB_VERIFIED" || echo "❌ LANE_B_DB_FAILED")
          echo "$OVERALL"
          {
            echo "## DB Verification — LANE_B (Local Postgres)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Prisma schema valid | $(ok $VALIDATE) |"
            echo "| Migrations deployed (throwaway) | $(ok $DEPLOY) |"
            echo "| Type-check | $(ok '${{ steps.typecheck.outcome }}') |"
            echo "| Lint ratchet | $(ok '${{ steps.lint-ratchet.outcome }}') |"
            echo "| Production build | $(ok '${{ steps.build.outcome }}') |"
            echo "| Restore-portability proof | $(ok '${{ steps.restore-proof.outcome }}') |"
            echo "| DB test suite | $(ok $TESTS) |"
            echo ""
            echo "**Checkout:** sha=\`$CHECKOUT_SHA\` tree=\`$CHECKOUT_TREE\`"
            echo "**PostgreSQL:** client major $PG_CLIENT_MAJOR, server major $PG_SERVER_MAJOR"
            echo "**Skipped tests (files with skipped tests, from the vitest log):**"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' artifacts/db-verification/lane-b-db-tests.log 2>/dev/null | grep -E '^ *(↓|✓|❯) .*[0-9]+ skipped' | sed -E 's/ [0-9]+ms$//' | head -80 || true
            echo '```'
            echo ""
            echo "**Lane:** LANE_B — GitHub Actions postgres:16 service container (not Neon, not production)"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> $GITHUB_STEP_SUMMARY

# ─── LANE A ───────────────────────────────────────────────────────────────────
  lane-a-neon-verify:
    name: 'LANE_A — Neon Secrets (status + tests, no deploy)'
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.use_neon_secrets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify rolldown native binding
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu'); console.log('✓ rolldown binding present')"

      # Fail-closed identity preflight (src/infra/production-db-identity.ts). A mislabeled secret that points at
      # PRODUCTION must stop HERE, before any test, migration or reset touches it. Static check (known production
      # endpoint) then a read-only in-database identity read. Prints variable names and refusal codes only —
      # never a URL, host, user or password.
      - name: Assert Neon databases are not production (identity preflight)
        run: npx tsx scripts/assert-non-production-database.ts DATABASE_URL TEST_DATABASE_URL MIGRATION_DATABASE_URL
        env:
          # Every variable that can reach a database below: the DB test suite (DATABASE_URL / TEST_DATABASE_URL =
          # secrets.TEST_DATABASE_URL) and migrate status (MIGRATION_DATABASE_URL). Prisma generate / validate
          # below do NOT connect (schema-only; verified against an unreachable loopback) and receive a loopback
          # placeholder, not a secret, so no secret reaches a database without passing this preflight.
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # Safety gate: MIGRATION_DATABASE_URL must NOT be a pooler URL.
      # Prisma migrate status requires a direct connection.
      # If the secret contains '-pooler', stop here before touching any DB.
      - name: Assert MIGRATION_DATABASE_URL is direct (not pooler)
        id: pooler-check
        run: |
          URL="${{ secrets.MIGRATION_DATABASE_URL }}"
          if [ -z "$URL" ]; then
            echo "❌ MIGRATION_DATABASE_URL secret is not set."
            exit 1
          fi
          if echo "$URL" | grep -qi '\-pooler'; then
            echo "❌ MIGRATION_DATABASE_URL appears to be a pooler URL (contains '-pooler')."
            echo "   Prisma migrate status/deploy requires a direct (non-pooler) Neon endpoint."
            echo "   Fix: supply the Neon direct URL (no '-pooler' in hostname) as MIGRATION_DATABASE_URL."
            exit 1
          fi
          LEN=${#URL}
          echo "✅ MIGRATION_DATABASE_URL is direct (length=$LEN, no '-pooler' detected)."

      - name: Configure Neon environment
        run: |
          cat > .env.local <<'EOF'
          NODE_ENV=test
          SKIP_ENV_VALIDATION=true
          EOF
          echo "✓ .env.local written (DB secrets injected via env: blocks, not written to disk)"

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

      - name: Prisma validate
        id: validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

      # Read-only status check. Shows applied and pending migrations. No mutations.
      - name: Prisma migrate status (read-only)
        id: migrate-status
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # DB tests run against TEST_DATABASE_URL (should be direct, non-pooler).
      # migrate deploy is NOT run in LANE_A — if migrations are pending the tests
      # will fail, which is the correct signal: deploy first, then re-run verification.
      - name: Run full DB test suite (Neon TEST_DATABASE_URL)
        id: db-tests
        run: |
          mkdir -p artifacts/db-verification
          set +e
          npm test -- '.db.test.ts' --maxWorkers=1 \
            2>&1 | tee artifacts/db-verification/lane-a-db-tests.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          exit $TEST_EXIT
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_WITH_DB: ${{ secrets.TEST_WITH_DB }}
          # Deliberate remote TEST database: explicit opt-in required by src/infra/test-database-guard.ts.
          OPSIQ_ALLOW_REMOTE_TEST_DB: 'true'
          NODE_ENV: test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lane-a-db-verification-logs
          path: artifacts/db-verification/
          retention-days: 14

      - name: Write GITHUB_STEP_SUMMARY
        if: always()
        run: |
          POOLER="${{ steps.pooler-check.outcome }}"
          VALIDATE="${{ steps.validate.outcome }}"
          STATUS="${{ steps.migrate-status.outcome }}"
          TESTS="${{ steps.db-tests.outcome }}"
          ok() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          warn() { [ "$1" = "success" ] && echo "✅" || echo "⚠️ pending migrations or unreachable"; }
          OVERALL=$([ "$TESTS" = "success" ] && echo "✅ LANE_A_DB_VERIFIED" || echo "❌ LANE_A_DB_FAILED")
          echo "$OVERALL"
          {
            echo "## DB Verification — LANE_A (Neon Secrets)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| MIGRATION_DATABASE_URL is direct (not pooler) | $(ok $POOLER) |"
            echo "| Prisma schema valid | $(ok $VALIDATE) |"
            echo "| Migration status (read-only) | $(warn $STATUS) |"
            echo "| DB test suite (TEST_DATABASE_URL) | $(ok $TESTS) |"
            echo ""
            echo "**Lane:** LANE_A — Neon secrets (migrate deploy NOT run — status + tests only)"
            echo "**Triggered by:** @${{ github.actor }}"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> $GITHUB_STEP_SUMMARY
