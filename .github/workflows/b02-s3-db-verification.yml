name: B02-S3 Owner Data Intake DB Verification

# B02-S3: Owner Confirmation Flow with state machine and persistence
# Tests draft → confirmed transitions, rollback safety, idempotency, workspace isolation
# PASS: all DB persistence tests execute and pass with GitHub Actions postgres:16 service container
# FAIL: any test skipped, mocked, or DB write fails

on:
  workflow_dispatch:
    description: 'Verify B02-S3 owner data intake DB persistence and state machine (GitHub Actions postgres:16 service container)'
  push:
    branches:
      - claude/execution-audit-phase-a-ulmljq
    paths:
      - .github/workflows/b02-s3-db-verification.yml
      - src/services/owner-data-intake.service.ts
      - src/__tests__/services/owner-data-intake.service.db.test.ts
      - prisma/**

jobs:
  b02-s3-db-verification:
    name: B02-S3 Owner Data Intake Tests (State Machine + Persistence)
    runs-on: ubuntu-latest

    # PostgreSQL 16 service container (localhost:5432)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      NODE_ENV: test

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm ci --include=optional

      # Step 3.1: Verify rolldown native binding
      - name: Verify rolldown native binding
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu'); console.log('✓ rolldown native binding present')"

      # Step 3.5: Configure CI PostgreSQL environment
      - name: Configure CI PostgreSQL environment
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          NODE_ENV=test
          EOF
          echo "✓ .env.local configured for CI PostgreSQL service"
          echo "Verification:"
          grep -E 'DATABASE_URL|DATABASE_URL_TEST|NODE_ENV' .env.local | sed 's/postgres:postgres@/postgres:****@/g'

      # Step 4: Prisma generate
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # Step 5: Prisma validate
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # Step 6: Prisma migrate deploy
      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # Step 7: Run B02-S3 Owner Data Intake Service Tests
      - name: Run B02-S3 Service Tests (13 DB + 2 logic = 15 tests)
        run: |
          mkdir -p artifacts/b02-s3

          set +e
          npm test -- --run \
            src/__tests__/services/owner-data-intake.service.db.test.ts \
            2>&1 | tee artifacts/b02-s3/service-tests.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          echo "B02-S3 service test exit code: $TEST_EXIT"
          exit $TEST_EXIT
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_WITH_DB: "true"

      # Step 8: Upload test logs for diagnosis
      - name: Upload B02-S3 test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b02-s3-test-logs
          path: artifacts/b02-s3/

      # Success summary
      - name: B02-S3 DB Verification Complete
        if: success()
        run: |
          echo "✅ B02_S3_DB_PERSISTENCE_VERIFIED"
          echo "Tests: 15 tests passed (13 DB + 2 logic)"
          echo ""
          echo "Verified:"
          echo "  ✓ Draft → Confirmed state transitions (atomic)"
          echo "  ✓ Idempotent confirmation (safe retries)"
          echo "  ✓ Workspace isolation enforcement"
          echo "  ✓ Validation status checks"
          echo "  ✓ Audit event emission"
          echo "  ✓ Rejection workflow"
          echo "  ✓ Transaction rollback safety"
          echo "  ✓ Multiple sequential confirmations"
          echo "  ✓ Timestamp consistency"
          echo ""
          echo "Database Verification:"
          echo "  - DB Method: GitHub Actions PostgreSQL 16 service container (localhost:5432)"
          echo "  - Migrations: deployed and verified"
          echo "  - Persistence: OwnerDataIntake table reads/writes verified"
          echo "  - Transactions: atomic state transitions verified"
          echo "  - Audit: audit events recorded for all state changes"
          echo "  - Workspace Isolation: enforced on all operations"
          echo ""
          echo "Workflow: b02-s3-db-verification.yml"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Failure summary
      - name: B02-S3 DB Verification Failed
        if: failure()
        run: |
          echo "❌ B02_S3_DB_VERIFICATION_FAILED"
          echo "One or more tests failed"
          echo "Review artifacts/b02-s3/ for detailed test output"
          exit 1
