name: DB Blocker Proof (GAP-DB-01)

# Targeted, clean proof that the GAP-DB-01 migration deploys on a fresh database and the
# previously-missing owner_input_quality_assessments chain works. The main ci.yml full DB
# suite has pre-existing flaky test-isolation failures (snapshot_data / canonical_events /
# owner_financial_snapshots races) that are red on main itself; this lane runs ONLY the
# migration + the relevant [db] tests so the GAP-DB-01 closure is provable in isolation.

on:
  push:
    branches: ["claude/full-repo-jarvis-db-blocker-closure"]
  workflow_dispatch:

jobs:
  db-blocker-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPSIQ_DB_TARGET: ci
      TEST_WITH_DB: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure .env.local for CI
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          TEST_WITH_DB=true
          EOF
      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
      - name: Prisma migrate deploy (fresh DB — proves the GAP-DB-01 migration)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
      - name: Prisma generate
        run: npx prisma generate
      # Stable DB proof: migrate deploy (above) applies ALL migrations incl. GAP-DB-01,
      # GAP-DB-02 (verification RESTRICT) and GAP-ISO-02 (engagement NOT NULL + index) on a
      # fresh DB; these [db] tests prove the owner input-quality chain + owner loop + schema
      # invariants. owner-budget [db] tests are intentionally NOT in this lane — they belong to
      # the pre-existing flaky population (GAP-CI-FLAKE-01) that is red on main independent of
      # this work; including them would re-introduce that flakiness here.
      - name: Run stable DB proof — owner schema + owner-loop + schema-hardening
        run: |
          npx vitest run --maxWorkers 1 \
            src/__tests__/owner-mode/owner-diagnosis-lifecycle.db.test.ts \
            src/__tests__/owner-mode/owner-loop.db.test.ts \
            src/__tests__/owner-mode/schema-hardening.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test
          TEST_WITH_DB: "true"
          NODE_ENV: test
