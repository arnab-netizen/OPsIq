name: Stage 6 DB Verification (LANE_B)

# Factory Stage 6 — LANE_B database proof workflow.
# Proves: S6-I4 (158 migrations deploy on fresh postgres:16), S6-I6 (post-migrate
# health probe returns valid), S6-I7 (workspace isolation), S6-I8 (index existence),
# S6-I9 (timing baseline captured).
# Method: GitHub Actions postgres:16 service container (no hosted Neon, no secrets).

on:
  workflow_dispatch:
    description: 'Stage 6 DB Verification — LANE_B postgres:16 service container'

jobs:
  stage6-db-verification:
    name: Stage 6 DB Proofs (LANE_B — postgres:16)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      TEST_WITH_DB: "true"
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci attempt $i failed; retrying in $((i*10))s..."
            sleep $((i*10))
          done

      - name: Configure CI PostgreSQL environment
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          TEST_WITH_DB=true
          NODE_ENV=test
          EOF
          echo "✓ .env.local configured for CI PostgreSQL service"

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Deploy Prisma migrations (proves S6-I4 — 158 migrations on fresh postgres:16)
        run: |
          echo "Deploying all migrations to fresh postgres:16..."
          npx prisma migrate deploy
          echo "✓ S6-I4: Migration chain deployed successfully"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify migration count
        run: |
          COUNT=$(psql "$DATABASE_URL" -t -c "SELECT COUNT(*) FROM _prisma_migrations WHERE rolled_back_at IS NULL;")
          COUNT=$(echo $COUNT | tr -d ' ')
          echo "Applied migrations: $COUNT"
          if [ "$COUNT" -lt 158 ]; then
            echo "❌ Expected ≥158 migrations, got $COUNT"
            exit 1
          fi
          echo "✓ S6-I4 confirmed: $COUNT migrations applied"

      - name: Post-migrate health probe (proves S6-I6)
        run: |
          RESULT=$(psql "$DATABASE_URL" -t -c "SELECT 1 AS ok;")
          echo "Health probe result: $RESULT"
          if ! echo "$RESULT" | grep -q "1"; then
            echo "❌ S6-I6 FAILED: health probe returned unexpected result"
            exit 1
          fi
          echo "✓ S6-I6: Post-migrate health probe returns 1 (database reachable)"

      - name: Run Stage 6 DB proof tests (proves S6-I6, S6-I7, S6-I8, S6-I9)
        run: |
          mkdir -p artifacts/stage6
          set +e
          npx vitest run \
            src/__tests__/stage6/s6-db-proofs.test.ts \
            2>&1 | tee artifacts/stage6/db-proof-tests.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "Stage 6 DB proof test exit code: $TEST_EXIT"
          exit $TEST_EXIT
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_URL_TEST: ${{ env.DATABASE_URL }}
          TEST_WITH_DB: "true"
          NODE_ENV: test

      - name: Upload Stage 6 DB proof test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-db-proof-logs
          path: artifacts/stage6/

      - name: Stage 6 DB Verification Complete
        if: success()
        run: |
          echo "✅ STAGE6_DB_VERIFIED_GITHUB_POSTGRES_SERVICE"
          echo ""
          echo "Invariants proven:"
          echo "  ✓ S6-I4: Full 158-migration chain deploys on fresh postgres:16"
          echo "  ✓ S6-I6: Post-migrate health probe returns DB connectivity"
          echo "  ✓ S6-I7: Workspace isolation enforced on hot-path queries"
          echo "  ✓ S6-I8: workspaceId index exists on engagements + workspace_memberships"
          echo "  ✓ S6-I9: Hot-path query baseline timing captured (p50/p95/max)"
          echo ""
          echo "DB Method: GitHub Actions PostgreSQL 16 service container (LANE_B)"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"

      - name: Stage 6 DB Verification Failed
        if: failure()
        run: |
          echo "❌ STAGE6_DB_VERIFICATION_FAILED"
          echo "Review artifacts/stage6/ for detailed test output"
          exit 1
