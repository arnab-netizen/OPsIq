name: B13 Token Lifecycle & Sync Management — DB Verification (LANE_B)

on:
  workflow_dispatch:
    inputs:
      run_token_lifecycle_tests:
        description: 'Run token-lifecycle tests'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_sync_manager_tests:
        description: 'Run sync-manager tests'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_ENV: test
  TEST_WITH_DB: 'true'
  SKIP_ENV_VALIDATION: 'true'

jobs:
  b13-db-verification:
    name: B13 DB-Backed Tests (LANE_B)
    runs-on: ubuntu-latest

    # PostgreSQL service container for test database
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      OPSIQ_DB_TARGET: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure test database URL
        run: |
          cat > .env.test << EOF
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/opsiq_test"
          DIRECT_URL="postgresql://postgres:postgres@localhost:5432/opsiq_test"
          TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/opsiq_test"
          NODE_ENV="test"
          SKIP_ENV_VALIDATION="true"
          EOF

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/opsiq_test"

      - name: Run token-lifecycle service tests
        if: ${{ inputs.run_token_lifecycle_tests == 'true' }}
        run: npm test -- src/__tests__/services/external-systems/token-lifecycle.service.db.test.ts --run
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/opsiq_test"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/opsiq_test"

      - name: Run sync-manager service tests
        if: ${{ inputs.run_sync_manager_tests == 'true' }}
        run: npm test -- src/__tests__/services/external-systems/sync-manager.service.db.test.ts --run
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/opsiq_test"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/opsiq_test"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: b13-test-results
          path: |
            test-results/
            coverage/
          retention-days: 30

  db-integration-summary:
    name: DB Integration Summary
    runs-on: ubuntu-latest
    needs: b13-db-verification
    if: always()

    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.b13-db-verification.result }}" == "success" ]; then
            echo "✓ B13 DB-Backed Tests Passed (LANE_B_GITHUB_POSTGRES_SERVICE)"
            echo "## B13 DB Verification Status ✓" >> $GITHUB_STEP_SUMMARY
            echo "- Token Lifecycle Tests: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- Sync Manager Tests: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- Workspace Isolation: VERIFIED" >> $GITHUB_STEP_SUMMARY
            echo "- Transaction Integrity: VERIFIED" >> $GITHUB_STEP_SUMMARY
          else
            echo "✗ B13 DB-Backed Tests Failed"
            echo "## B13 DB Verification Status ✗" >> $GITHUB_STEP_SUMMARY
            echo "Review logs above for details" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
