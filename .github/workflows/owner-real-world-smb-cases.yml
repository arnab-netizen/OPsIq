name: Owner Mode — Real-World SMB Cases

# CI-MIN-01 correction: this workflow's own test path
# (tests/owner-mode/real-world-smb-cases/**) is already covered by ci.yml's
# build-and-test broad non-DB suite, whose vitest.config.ts include glob is
# "tests/owner-mode/**/*.test.ts" -- any PR touching these paths already runs
# these exact tests once, in build-and-test. The automatic push/pull_request
# triggers here duplicated that run on every PR unconditionally. Kept
# workflow_dispatch-only for manual/ad-hoc re-runs; tests and jobs are
# unchanged.
on:
  workflow_dispatch:

jobs:
  smb-case-harness:
    name: SMB Case Fixture Validation and Scoring Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck SMB case harness files
        run: npx tsc --noEmit --project tsconfig.json 2>&1 | head -50 || true
        # Non-blocking typecheck — report errors but do not fail CI here.
        # The test suite below provides the hard gate.

      - name: Run SMB real-world case tests
        run: npm run test:owner-real-world-smb
        env:
          # No DB required for this test suite — fixture validation and scoring are pure.
          TEST_WITH_DB: "false"
