name: Smoke - Production Dashboard

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Approved Production origin to test (fixed allow-list; free-text URLs are not accepted)"
        required: true
        type: choice
        default: "https://o-ps-iq.vercel.app"
        options:
          - "https://o-ps-iq.vercel.app"
          - "https://opsiq.solutions"
          - "https://www.opsiq.solutions"

concurrency:
  group: smoke-production-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Test Production Dashboard
    environment: production-smoke
    permissions:
      contents: read
    env:
      BASE_URL: ${{ inputs.base_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Assert workflow origin is main (fail-closed)
        run: |
          set -euo pipefail
          [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || { echo "::error::refusing to run: unexpected trigger '${GITHUB_EVENT_NAME}'"; exit 1; }
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::refusing to run: ref is '${GITHUB_REF}', must be refs/heads/main"; exit 1; }
          case "${GITHUB_WORKFLOW_REF}" in
            *"@refs/heads/main") ;;
            *) echo "::error::refusing to run: the workflow definition is not from refs/heads/main"; exit 1 ;;
          esac

      - name: Validate smoke destination (approved origins only; fail-closed)
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          case "${BASE_URL}" in
            "https://o-ps-iq.vercel.app"|"https://opsiq.solutions"|"https://www.opsiq.solutions") echo "Destination approved: ${BASE_URL}" ;;
            *) echo "::error::refusing to run: base_url is not an approved origin"; exit 1 ;;
          esac

      - name: Require smoke diagnostic key (fail-closed, no repository-level fallback)
        env:
          SMOKE_DIAGNOSTIC_KEY: ${{ secrets.SMOKE_DIAGNOSTIC_KEY }}
        run: |
          [ -n "${SMOKE_DIAGNOSTIC_KEY:-}" ] || { echo "::error::SMOKE_DIAGNOSTIC_KEY is not set in the production-smoke environment"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Get current commit SHA
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Wait for Vercel deployment
        if: github.event_name == 'push'
        run: |
          BASE_URL="https://o-ps-iq.vercel.app"
          TARGET_COMMIT="${{ steps.commit.outputs.sha }}"
          MAX_RETRIES=30
          RETRY_INTERVAL=10

          echo "Waiting for Vercel to deploy commit ${TARGET_COMMIT:0:7}..."

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."

            RESPONSE=$(curl -s --proto '=https' --max-redirs 0 "$BASE_URL/api/internal/build-info" 2>/dev/null || echo '{}')
            DEPLOYED_COMMIT=$(echo "$RESPONSE" | jq -r '.commit // "unknown"' 2>/dev/null)

            if [ "$DEPLOYED_COMMIT" = "$TARGET_COMMIT" ]; then
              echo "✓ Vercel deployed commit $TARGET_COMMIT"
              exit 0
            fi

            echo "  Current: ${DEPLOYED_COMMIT:0:7}, Target: ${TARGET_COMMIT:0:7}"

            if [ $i -lt $MAX_RETRIES ]; then
              sleep $RETRY_INTERVAL
            fi
          done

          echo "❌ Timeout waiting for Vercel deployment"
          exit 1

      - name: Run dashboard smoke test
        env:
          BASE_URL: ${{ inputs.base_url }}
          OPSIQ_DIAGNOSTIC_KEY: ${{ secrets.SMOKE_DIAGNOSTIC_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "Testing dashboard at: $BASE_URL"
          npx tsx scripts/smoke-production-dashboard.ts

      - name: Log completion
        if: always()
        run: |
          echo "## ✅ Dashboard Smoke Test Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${BASE_URL}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Dashboard verification passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Dashboard verification failed" >> $GITHUB_STEP_SUMMARY
          fi
