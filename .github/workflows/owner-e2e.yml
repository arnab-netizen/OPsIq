name: Owner Browser E2E (GAP-E2E-01)

# Real browser owner-flow proof: boots the built app against a seeded postgres, logs in as a
# real OWNER, and asserts the rendered owner command center shows the server-driven safety
# state (owner-action / handled-by-OpsIQ summary). Server enforcement stays active; no client
# fakery. Runs in GitHub Actions; installs the browser; needs no production secrets.

on:
  push:
    branches:
      - "claude/full-repo-jarvis-db-blocker-closure"
      - "claude/phase-3-execution-closure-plan-pid5a6"
      - "claude/phase-4-owner-business-operating-system"
      - "claude/phase-5-startup-mode-zero-to-validated-business"
      - "claude/stage-3-operational-closure"
  workflow_dispatch:

jobs:
  owner-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test
      AUTH_SECRET: e2e-test-auth-secret-not-a-real-secret
      AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      BASE_URL: http://localhost:3001
      TEST_WITH_DB: "true"
      # next build TypeScript check hits the default ~2 GB heap limit (FATAL: heap out of
      # memory / SIGABRT). Mirrors the fix already present in ci.yml and all other E2E workflows.
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Running 7 specs generates >10 login attempts from localhost, tripping the rate limiter.
      # CI-only ceiling; production default stays 10. Mirrors owner-pilot-e2e.yml.
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: "200"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Configure .env.local
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          AUTH_SECRET=e2e-test-auth-secret-not-a-real-secret
          AUTH_URL=http://localhost:3001
          NEXT_PUBLIC_APP_URL=http://localhost:3001
          TEST_WITH_DB=true
          EOF
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
      - name: Prisma generate
        run: npx prisma generate
      - name: Build app
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Seed loginable owner + archetype
        run: npx tsx scripts/seed-e2e-owner.ts
      - name: Seed Phase 3 execution lifecycle fixtures
        run: npx tsx scripts/seed-e2e-phase3.ts
      - name: Seed Phase 4 BOS fixtures
        run: npx tsx scripts/seed-e2e-phase4.ts
      - name: Seed Phase 5 Startup Mode fixtures
        run: npx tsx scripts/seed-e2e-phase5.ts
      - name: Start app
        run: |
          PORT=3001 npm run start > /tmp/app.log 2>&1 &
          # Connectivity check (NOT -f: the login page may return a redirect/non-2xx; we only
          # need the server to accept connections). Accept any HTTP code as "up".
          up=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login || echo 000)
            if [ "$code" != "000" ]; then echo "app up (HTTP $code)"; up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then echo "app failed to start"; tail -80 /tmp/app.log; exit 1; fi
      - name: Run owner-flow browser tests (A–F + Phase 3 + Phase 4 + Phase 5)
        # A: control center · B: server rejection · C: finance/budget safety ·
        # D: indicators/opportunity · E: RBAC/workspace · F: legacy UI safety ·
        # G: Phase 3 execution lifecycle loop · H: Phase 4 BOS panel · I: Phase 5 Startup Mode.
        run: >-
          npx playwright test
          tests/browser/06-owner-control-center.spec.ts
          tests/browser/07-owner-server-rejection.spec.ts
          tests/browser/08-owner-finance-budget-safety.spec.ts
          tests/browser/09-owner-indicators.spec.ts
          tests/browser/10-rbac-workspace.spec.ts
          tests/browser/11-legacy-ui-safety.spec.ts
          tests/browser/54-owner-phase3-execution-loop.spec.ts
          tests/browser/55-owner-phase4-bos-panel.spec.ts
          tests/browser/56-startup-mode-journey.spec.ts
          --project=chromium
      - name: Print Playwright failures + app log
        if: always()
        run: |
          echo "PWFAIL_BEGIN"
          node -e '
            try {
              const r=require("./test-results/results.json");
              const walk=(s)=>{ (s.suites||[]).forEach(walk); for(const sp of (s.specs||[])){ for(const t of (sp.tests||[])){ for(const res of (t.results||[])){ if(res.status!=="passed"){ const err=(res.error&&res.error.message)||""; console.log("PWFAIL "+sp.title+" :: "+res.status+" :: "+String(err).replace(/\s+/g," ").slice(0,500)); } } } } };
              (r.suites||[]).forEach(walk);
            } catch(e){ console.log("PWFAIL_NOJSON "+e.message); }
          ' 2>&1 | head -60
          echo "PWFAIL_END"
          echo "APPLOG_BEGIN"; tail -40 /tmp/app.log || true; echo "APPLOG_END"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
