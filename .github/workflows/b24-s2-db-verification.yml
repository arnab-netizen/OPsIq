name: B24-S2 DB Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b24-s2-db-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  db-verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
      NODE_ENV: test
      CI: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma validate

      - run: npx prisma generate

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Push schema to database
        run: npx prisma db push --url postgresql://postgres:postgres@localhost:5432/opsiq_test --accept-data-loss

      - run: npm run test -- src/__tests__/services/private-mode/role-access.service.db.test.ts --run
        env:
          TEST_WITH_DB: true
