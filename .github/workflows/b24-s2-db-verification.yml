name: B24-S2 DB Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b24-s2-db-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  db-verify:
    runs-on: ubuntu-latest
    env:
      OPSIQ_DB_TARGET: ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      NODE_ENV: test
      CI: 'true'
      TEST_WITH_DB: 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma validate

      - run: npx prisma generate

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Diagnostic — datasource env presence (redacted)
        run: |
          echo "DATABASE_URL present: $([ -n "$DATABASE_URL" ] && echo yes || echo no)"
          echo "TEST_DATABASE_URL present: $([ -n "$TEST_DATABASE_URL" ] && echo yes || echo no)"
          echo "CI: ${CI:-unset}"

      - name: Deploy migrations
        run: npx prisma migrate deploy

      - name: Run B24-S2 DB-backed tests
        run: npm run test -- src/__tests__/services/private-mode/role-access.service.db.test.ts --run
