name: Stage 7 — Evidence Capture (Canonical)

# ─── DEFECT 11 remediation ────────────────────────────────────────────────────
# This workflow does NOT accept caller-controlled observation commands, lane
# values, proof types, assertions, or results. Those are all derived from the
# hardcoded contract matrix below based on the owner-selected invariant_id.
#
# Only values the owner may legitimately supply:
#   - invariant_id: which invariant to capture (validated against the matrix)
#   - deployment_id: the live Vercel deployment ID (LANE_C only — required by the
#     contract; the owner must supply the exact deployment ID they are observing)
#   - supersedes: artifact_id of a prior artifact this corrects (optional)
#
# The observation command, lane, proof_type, environment, method, assertion, and
# result are ALL hardcoded per invariant_id. The result field is derived from the
# command exit code, never from an input.
#
# Owner-lane invariants (LANE_F, OWNER_ACCEPTANCE) are NOT captured by this
# workflow. They require the owner to make an attestation comment on a PR/issue
# and use the owner-attestation capture flow.
#
# OPTION A gate (inside scripts/capture-evidence.mjs):
#   Verifies GITHUB_SHA == closure_subject_sha from D-13 on origin/main.
#   The owner dispatches this workflow manually AFTER D-13 merges.

on:
  workflow_dispatch:
    inputs:
      invariant_id:
        description: |
          Stage 7 invariant id. LANE_C: S7-I1/I2/I4/I5. LANE_E: S7-I11/I12. S7-I10 requires two separate dispatches.
          NOTE: S7-I3 is blocked by owner decisions D-2/D-3 (deferred amendment A2) — the current
          deployment-preflight.mjs reads local process.env and cannot probe the live environment.
          Do NOT dispatch S7-I3 until D-2/D-3 are resolved and A2 is applied.
        required: true
        type: choice
        options:
          - S7-I1
          - S7-I2
          - S7-I4
          - S7-I5
          - S7-I10-LANE_C
          - S7-I10-LANE_E
          - S7-I11
          - S7-I12
      deployment_id:
        description: "Vercel deployment ID (required for LANE_C invariants). Format: dpl_..."
        required: false
        type: string
        default: ""
      supersedes:
        description: "artifact_id of a prior artifact this corrects (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    # GitHub Environment restricts EVIDENCE_SIGNING_KEY to refs matching
    # stage7-evidence-subject-* tag pattern (requires GitHub Pro or higher for
    # private repos). The owner creates this environment and tag-restriction rule
    # after PR-A merges, before dispatching captures. The tag is applied to INF_SHA.
    environment: stage7-evidence-signing
    steps:
      - name: Checkout at GITHUB_SHA with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main (required by OPTION A gate)
        run: git fetch origin main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # ── Contract matrix ──────────────────────────────────────────────────────
      # Invariant → lane, proof_type, environment, method, assertion, command.
      # result is derived from command exit code: 0 = PASS, non-zero = FAIL.
      # deployment_id is required for LANE_C and must not be present for LANE_E.
      # All values are hardcoded — the caller cannot override them.
      - name: Resolve contract parameters from invariant_id
        id: contract
        env:
          INVARIANT_ID: ${{ inputs.invariant_id }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail

          case "$INVARIANT_ID" in
            S7-I1)
              echo "lane=LANE_C" >> "$GITHUB_OUTPUT"
              echo "proof_type=production_runtime_check" >> "$GITHUB_OUTPUT"
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "method=http_probe" >> "$GITHUB_OUTPUT"
              echo "assertion=Deployed SHA matches authorized candidate; production health probe returns 200." >> "$GITHUB_OUTPUT"
              echo "command=node scripts/stage7-probes/s7-i1-health-probe.mjs" >> "$GITHUB_OUTPUT"
              echo "requires_deployment_id=true" >> "$GITHUB_OUTPUT"
              ;;
            S7-I2)
              echo "lane=LANE_C" >> "$GITHUB_OUTPUT"
              echo "proof_type=production_migration_check" >> "$GITHUB_OUTPUT"
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "method=db_query" >> "$GITHUB_OUTPUT"
              echo "assertion=All approved migrations applied; zero pending migrations confirmed against production DB." >> "$GITHUB_OUTPUT"
              echo "command=node scripts/stage7-probes/s7-i2-migration-check.mjs" >> "$GITHUB_OUTPUT"
              echo "requires_deployment_id=true" >> "$GITHUB_OUTPUT"
              ;;
            # S7-I3 is intentionally absent from this matrix.
            # Deferred amendment A2, blocked by owner decisions D-2/D-3:
            # The current scripts/deployment-preflight.mjs reads local process.env
            # and cannot probe the live environment. S7-I3 capture is blocked until
            # D-2/D-3 are resolved and A2 is applied to the manifest.
            S7-I4)
              echo "lane=LANE_C" >> "$GITHUB_OUTPUT"
              echo "proof_type=production_auth_check" >> "$GITHUB_OUTPUT"
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "method=http_probe" >> "$GITHUB_OUTPUT"
              echo "assertion=Owner login, logout, session expiry, and unauthorized-user rejection all confirmed on production deployment." >> "$GITHUB_OUTPUT"
              echo "command=node scripts/stage7-probes/s7-i4-auth-check.mjs" >> "$GITHUB_OUTPUT"
              echo "requires_deployment_id=true" >> "$GITHUB_OUTPUT"
              ;;
            S7-I5)
              echo "lane=LANE_C" >> "$GITHUB_OUTPUT"
              echo "proof_type=production_boundary_check" >> "$GITHUB_OUTPUT"
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "method=http_probe" >> "$GITHUB_OUTPUT"
              echo "assertion=Cross-workspace rejection confirmed on production; secret values absent from all owner-visible API responses and health output." >> "$GITHUB_OUTPUT"
              echo "command=node scripts/stage7-probes/s7-i5-boundary-check.mjs" >> "$GITHUB_OUTPUT"
              echo "requires_deployment_id=true" >> "$GITHUB_OUTPUT"
              ;;
            S7-I10-LANE_C)
              echo "lane=LANE_C" >> "$GITHUB_OUTPUT"
              echo "proof_type=simulation_and_production_audit_check" >> "$GITHUB_OUTPUT"
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "method=db_query" >> "$GITHUB_OUTPUT"
              echo "assertion=All six attribution fields present in audit records for pilot transitions; no raw payload copied into any audit record." >> "$GITHUB_OUTPUT"
              echo "command=node scripts/stage7-probes/s7-i10-audit-check-lane-c.mjs" >> "$GITHUB_OUTPUT"
              echo "requires_deployment_id=true" >> "$GITHUB_OUTPUT"
              ;;
            S7-I10-LANE_E)
              echo "lane=LANE_E" >> "$GITHUB_OUTPUT"
              echo "proof_type=simulation_and_production_audit_check" >> "$GITHUB_OUTPUT"
              echo "environment=isolated_simulation" >> "$GITHUB_OUTPUT"
              echo "method=test_run" >> "$GITHUB_OUTPUT"
              echo "assertion=Simulation confirms all six audit attribution fields present; no raw payload in audit records across all simulated paths." >> "$GITHUB_OUTPUT"
              echo "command=npx vitest run src/__tests__/completion-factory/stage7-audit-check.test.ts --reporter=default" >> "$GITHUB_OUTPUT"
              echo "requires_deployment_id=false" >> "$GITHUB_OUTPUT"
              ;;
            S7-I11)
              echo "lane=LANE_E" >> "$GITHUB_OUTPUT"
              echo "proof_type=simulation_adversarial" >> "$GITHUB_OUTPUT"
              echo "environment=isolated_simulation" >> "$GITHUB_OUTPUT"
              echo "method=test_run" >> "$GITHUB_OUTPUT"
              echo "assertion=Nine adversarial failure scenarios each fail safely, visibly, and recoverably in isolated simulation." >> "$GITHUB_OUTPUT"
              echo "command=npx vitest run src/__tests__/completion-factory/stage7-evidence-artifact.test.ts src/__tests__/completion-factory/stage7-ed25519-hostile.test.ts --reporter=default" >> "$GITHUB_OUTPUT"
              echo "requires_deployment_id=false" >> "$GITHUB_OUTPUT"
              ;;
            S7-I12)
              echo "lane=LANE_E" >> "$GITHUB_OUTPUT"
              echo "proof_type=simulation_runbook_recovery" >> "$GITHUB_OUTPUT"
              echo "environment=isolated_simulation" >> "$GITHUB_OUTPUT"
              echo "method=test_run" >> "$GITHUB_OUTPUT"
              echo "assertion=Staged failure introduced; recovery confirmed following DEPLOYMENT_RUNBOOK.md without undocumented steps." >> "$GITHUB_OUTPUT"
              echo "command=node scripts/stage7-probes/s7-i12-runbook-recovery.mjs" >> "$GITHUB_OUTPUT"
              echo "requires_deployment_id=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "REFUSED: '$INVARIANT_ID' is not a supported invariant_id for CI capture." >&2
              echo "Owner-lane invariants (S7-I6/I7/I8/I9/I13/I14/I15/I16/OWNER_ACCEPTANCE) require the owner-attestation flow." >&2
              exit 1
              ;;
          esac

      - name: Validate deployment_id requirement
        env:
          REQUIRES: ${{ steps.contract.outputs.requires_deployment_id }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          INVARIANT_ID: ${{ inputs.invariant_id }}
        run: |
          set -euo pipefail
          if [ "$REQUIRES" = "true" ] && [ -z "$DEPLOYMENT_ID" ]; then
            echo "REFUSED: $INVARIANT_ID (LANE_C) requires --deployment_id." >&2
            echo "Provide the exact Vercel deployment ID (dpl_...) you are observing." >&2
            exit 1
          fi
          if [ "$REQUIRES" = "false" ] && [ -n "$DEPLOYMENT_ID" ]; then
            echo "REFUSED: $INVARIANT_ID (LANE_E) must not supply deployment_id." >&2
            exit 1
          fi

      - name: Run observation (hardcoded command — not caller-supplied)
        id: observe
        env:
          OBSERVATION_COMMAND: ${{ steps.contract.outputs.command }}
          METHOD: ${{ steps.contract.outputs.method }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          obs_file="$RUNNER_TEMP/observation.txt"
          # Execute the hardcoded observation command and hold its exit status
          # INTERNALLY. Nothing is written to $GITHUB_OUTPUT until the observation
          # has been validated below: an exit status is only evidence of an
          # assertion outcome once we know an observation actually took place.
          # Caller cannot override the command, method, result, or observation content.
          observed_exit=0
          eval "$OBSERVATION_COMMAND" > "$obs_file" 2>&1 || observed_exit=$?

          if [ ! -s "$obs_file" ]; then
            echo "REFUSED: observation command produced no output" >&2
            exit 1
          fi

          # ── ANSI normalisation for MARKER MATCHING ONLY ──────────────────────
          # $obs_file is the evidence. It is never rewritten: the artifact records
          # the verbatim bytes the observation command produced, ANSI and all.
          #
          # The validity gates below match structural markers, and GitHub Actions
          # runners colourise vitest. On run 33633377692 a genuine, completed,
          # 74/74-passing S7-I11 observation was REFUSED because the summary line
          # arrived as:
          #   ESC[2m Test Files ESC[22m ESC[1mESC[32m2 passed ESC[39m...
          # so "Test Files" was followed by an escape sequence rather than the
          # digit the marker requires. A real observation was discarded as a
          # non-observation. (The failure direction was safe — refusal, never
          # fabrication — but it blocks every LANE_E capture.)
          #
          # The gates therefore read a NORMALISED COPY. The pattern removes only
          # CSI sequences — ESC '[' , digits and ';' , one ASCII final byte — so
          # it cannot touch ordinary text: a literal '[' or a digit in the
          # observation has no leading ESC and is left alone, and a malformed or
          # truncated escape simply does not match and is preserved. LC_ALL=C
          # keeps sed byte-oriented so the UTF-8 in vitest output passes through.
          validation_file="$RUNNER_TEMP/observation.normalized.txt"
          LC_ALL=C sed -E $'s/\033\\[[0-9;]*[A-Za-z]//g' "$obs_file" > "$validation_file"

          # ── Fail-closed test-runner validity gate ────────────────────────────
          # A non-zero exit means "the assertion did not hold" ONLY when the runner
          # actually executed tests. A vitest run that dies during startup — removed
          # or misspelled reporter, unknown CLI option, config parse error,
          # unresolvable module, no matching test files — also exits non-zero and
          # also writes to stderr, which is redirected into $obs_file. The
          # empty-output guard above therefore does not catch it, and without this
          # gate that non-observation is captured, signed, filed as an evidence PR
          # and handed to the trusted verifier as an observed invariant FAIL.
          #
          # Marker: vitest prints its "Test Files <n> ..." summary on a passing run
          # and on a genuinely failing run, and never when it aborts before
          # executing. Matched against $validation_file so runner colourisation
          # cannot hide it. The match stays case-sensitive on purpose — vitest's
          # "No test files found" message is lowercase, and that case must refuse.
          #
          # Scoped to vitest invocations, not to method alone: S7-I12 is also
          # method=test_run but runs a node probe, which emits no vitest summary.
          # Both METHOD and OBSERVATION_COMMAND come from the hardcoded contract
          # matrix, so neither this scope nor the gate is caller-reachable.
          #
          # Classification is exhaustive over the matrix as it stands: 6 entries are
          # Stage 7 node probes (S7-I1, S7-I2, S7-I4, S7-I5, S7-I10-LANE_C, S7-I12)
          # and 2 are vitest (S7-I10-LANE_E, S7-I11). Anything else is unclassified
          # and refuses — a future observation command no validity gate governs is
          # exactly the hole this step exists to close.
          case "$OBSERVATION_COMMAND" in
            *"vitest run"*)                 observation_runner="vitest" ;;
            "node scripts/stage7-probes/"*) observation_runner="stage7_node_probe" ;;
            *)                              observation_runner="unclassified" ;;
          esac

          if [ "$METHOD" = "test_run" ] && [ "$observation_runner" = "vitest" ]; then
            if ! grep -qE '(^|[[:space:]])Test Files[[:space:]]+[0-9]+' "$validation_file"; then
              echo "REFUSED: the vitest run did not execute any tests." >&2
              echo "No test-execution summary was found in the observation output, so a" >&2
              echo "non-zero exit here reflects a runner or configuration failure, not an" >&2
              echo "observed assertion failure. Nothing was observed, so there is nothing" >&2
              echo "to capture: no artifact, no evidence PR, no verifier dispatch." >&2
              echo "--- observation output (first 40 lines) ---" >&2
              head -40 "$obs_file" >&2
              exit 1
            fi

          elif [ "$observation_runner" = "stage7_node_probe" ]; then
            # ── Stage 7 node-probe terminal-verdict gate ─────────────────────────
            # Every probe under scripts/stage7-probes/ ends its governed run by
            # printing exactly one terminal verdict line and exiting to match:
            #   console.log("\nRESULT: PASS"); process.exit(0);
            #   console.log("\nRESULT: FAIL"); process.exit(1);
            # Its unhandled-error path prints "Unhandled error: ..." and exits 1
            # WITHOUT a verdict line. So a module-resolution failure, a syntax
            # error, a missing dependency, a Node loader failure or any uncaught
            # exception is distinguishable from a governed FAIL by the absence of
            # that line — and without this gate all of them were captured, signed
            # and filed as an observed invariant FAIL.
            #
            # The match is anchored to a whole line so the probes' own per-check
            # lines ("[PASS] database_check_status: ...") and their summary line
            # ("Checks: 10 PASS, 0 FAIL") cannot be mistaken for a verdict. It runs
            # against $validation_file too, so a probe that ever colourises its
            # output cannot be falsely refused the way vitest was.
            verdict_count=$(grep -cE '^[[:space:]]*RESULT:[[:space:]]+(PASS|FAIL)[[:space:]]*$' "$validation_file" || true)
            pass_count=$(grep -cE '^[[:space:]]*RESULT:[[:space:]]+PASS[[:space:]]*$' "$validation_file" || true)
            fail_count=$(grep -cE '^[[:space:]]*RESULT:[[:space:]]+FAIL[[:space:]]*$' "$validation_file" || true)

            if [ "$verdict_count" -eq 0 ]; then
              echo "REFUSED: the Stage 7 probe did not reach a controlled verdict." >&2
              echo "No 'RESULT: PASS' or 'RESULT: FAIL' terminal line was found, so the" >&2
              echo "probe never completed its own verdict protocol — this is an" >&2
              echo "infrastructure or runtime failure, not an observation. Nothing was" >&2
              echo "observed, so there is nothing to capture." >&2
              echo "--- observation output (first 40 lines) ---" >&2
              head -40 "$obs_file" >&2
              exit 1
            fi

            if [ "$verdict_count" -ne 1 ]; then
              echo "REFUSED: the Stage 7 probe emitted $verdict_count terminal verdict lines" >&2
              echo "($pass_count PASS, $fail_count FAIL). A governed observation carries exactly" >&2
              echo "one verdict; more than one means the probe did not terminate through a" >&2
              echo "single controlled path and the observation is not trustworthy." >&2
              echo "--- observation output (first 40 lines) ---" >&2
              head -40 "$obs_file" >&2
              exit 1
            fi

            if [ "$pass_count" -eq 1 ] && [ "$observed_exit" -ne 0 ]; then
              echo "REFUSED: the Stage 7 probe declared 'RESULT: PASS' but exited $observed_exit." >&2
              echo "The verdict and the exit status disagree, so one of them is wrong and" >&2
              echo "neither can be signed as evidence." >&2
              exit 1
            fi

            if [ "$fail_count" -eq 1 ] && [ "$observed_exit" -eq 0 ]; then
              echo "REFUSED: the Stage 7 probe declared 'RESULT: FAIL' but exited 0." >&2
              echo "The verdict and the exit status disagree, so one of them is wrong and" >&2
              echo "neither can be signed as evidence." >&2
              exit 1
            fi

          else
            echo "REFUSED: observation command is not a governed Stage 7 observation." >&2
            echo "It is neither a vitest run nor a scripts/stage7-probes/ node probe, so no" >&2
            echo "validity gate governs its output and its exit status cannot be trusted as" >&2
            echo "a verdict. Add the command to the classification above before capturing." >&2
            echo "command: $OBSERVATION_COMMAND" >&2
            exit 1
          fi

          # Only now is the exit status meaningful as an observed result.
          if [ "$observed_exit" -eq 0 ]; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          fi
          echo "observation_file=$obs_file" >> "$GITHUB_OUTPUT"

      # S7-I10 is dispatched as S7-I10-LANE_C or S7-I10-LANE_E to disambiguate
      # the lane; the canonical invariant_id passed to the artifact is always S7-I10.
      - name: Normalize invariant_id
        id: normalize
        env:
          INVARIANT_ID: ${{ inputs.invariant_id }}
        run: |
          normalized="${INVARIANT_ID%%-LANE_*}"
          echo "invariant_id=$normalized" >> "$GITHUB_OUTPUT"

      - name: Capture evidence artifact
        id: capture
        uses: ./.github/actions/stage7-evidence-capture
        with:
          invariant: ${{ steps.normalize.outputs.invariant_id }}
          lane: ${{ steps.contract.outputs.lane }}
          proof_type: ${{ steps.contract.outputs.proof_type }}
          environment: ${{ steps.contract.outputs.environment }}
          method: ${{ steps.contract.outputs.method }}
          assertion: ${{ steps.contract.outputs.assertion }}
          result: ${{ steps.observe.outputs.result }}
          observation_file: ${{ steps.observe.outputs.observation_file }}
          replay_command: ${{ steps.contract.outputs.command }}
          deployment_id: ${{ inputs.deployment_id }}
          classification: "INTERNAL_ONLY"
          supersedes: ${{ inputs.supersedes }}
          signing_key: ${{ secrets.EVIDENCE_SIGNING_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Push the artifact to an evidence branch forked from origin/main and open a
      # PR targeting main. The diff is add-only by construction (branch from main,
      # one file added). The trusted verifier validates the artifact as data from a
      # privileged context before the PR is merged.
      - name: Create evidence branch and open PR
        id: evidence_pr
        uses: ./.github/actions/stage7-create-evidence-pr
        with:
          artifact_path: ${{ steps.capture.outputs.artifact_path }}
          artifact_id: ${{ steps.capture.outputs.artifact_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Dispatch the trusted verifier via repository_dispatch using GITHUB_TOKEN.
      #
      # The verifier declares `on: repository_dispatch: types: [stage7-verify-artifacts]`
      # and reads github.event.client_payload.*, so this call MUST use the repository
      # dispatch endpoint and the event_type/client_payload envelope. Posting the
      # workflow_dispatch envelope to /actions/workflows/<file>/dispatches cannot reach
      # it and additionally needs Actions: write, which this job deliberately does not
      # hold — see ci-governance-check rule 12, which forbids widening that grant.
      #
      # POST /repos/{owner}/{repo}/dispatches needs only Contents: write (already
      # granted above) and returns 204 No Content on success. repository_dispatch is
      # one of the two events GITHUB_TOKEN may raise (with workflow_dispatch); the
      # automatic triggers (push, pull_request) remain blocked, so no loop is possible.
      # No PAT or DISPATCH_TOKEN required.
      #
      # client_payload contract, as consumed by stage7-trusted-verifier.yml:
      #   pr_number    string of digits — the verifier asserts ^[0-9]+$
      #   head_sha     hint only; the verifier re-resolves the live PR HEAD itself
      #   artifact_ids comma-separated string; each id must match ^evd_[0-9a-f]{32}$
      - name: Dispatch trusted verifier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.evidence_pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.evidence_pr.outputs.pr_head_sha }}
          ARTIFACT_ID: ${{ steps.capture.outputs.artifact_id }}
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/dispatches" \
            -d "$(jq -nc \
              --arg event_type "stage7-verify-artifacts" \
              --arg pr_number "$PR_NUMBER" \
              --arg head_sha "$PR_HEAD_SHA" \
              --arg artifact_ids "$ARTIFACT_ID" \
              '{event_type: $event_type, client_payload: {pr_number: $pr_number, head_sha: $head_sha, artifact_ids: $artifact_ids}}')")

          if [ "$HTTP_STATUS" != "204" ]; then
            echo "FAILED: repository_dispatch returned HTTP $HTTP_STATUS (expected 204)." >&2
            exit 1
          fi
          echo "Dispatched stage7-trusted-verifier (repository_dispatch stage7-verify-artifacts) for PR #$PR_NUMBER (head: $PR_HEAD_SHA)."
