name: Reusable PR Validation

# CI-MIN-01: no longer called by ci.yml. Its steps (governance scans, tsc,
# prisma validate, recurrence scanners, bundle manifest + Stage 7 evidence
# validators) were merged directly into ci.yml's build-and-test job so a PR
# pays for `npm ci` once instead of once per job that used to call this
# reusable workflow -- confirmed duplicate: this workflow ran as its own
# job with its own checkout + npm ci on every single PR, unconditionally.
# Left in place (still a valid, self-contained workflow_call-only workflow)
# for any future bundle-specific verification workflow that wants the same
# standard sequence without duplicating it.
#
# Usage from a caller workflow:
#   jobs:
#     validate:
#       uses: ./.github/workflows/reusable-pr-validation.yml
#       with:
#         node_version: '20.x'
#         run_bundle_validator: true

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        default: '20.x'
        type: string
      run_bundle_validator:
        description: 'Run bundle manifest + stage acceptance validator'
        required: false
        default: false
        type: boolean
      run_recurrence_scanners:
        description: 'Run recurrence defect scanners'
        required: false
        default: true
        type: boolean
      test_pattern:
        description: 'Vitest test pattern override (default: exclude *.db.test.ts)'
        required: false
        default: ''
        type: string
      run_test_suite:
        description: >-
          Run the non-DB vitest suite in this call. Default true for any
          caller other than ci.yml. ci.yml's own build-and-test job already
          runs this exact suite in the same PR -- ci.yml passes false here
          to stop paying for the identical ~28,000-test run twice per PR
          (confirmed duplicate: both jobs ran
          `vitest run --maxWorkers 1 --exclude '**/*.db.test.ts' ...`,
          consistently taking ~25 minutes each in parallel, e.g. PR #374's
          real CI run). This is a drift from this repo's own documented
          target (docs/audits/2026-07-12/FINAL_CI_ARCHITECTURE.md: the
          suite runs once), not an intentional design -- restoring that.
        required: false
        default: true
        type: boolean

jobs:
  validate:
    name: Non-DB Validation
    runs-on: ubuntu-latest
    # Same defect class already fixed in ci.yml's build-and-test job (see that
    # job's comment): a 25-minute job cap was killing this job during its own
    # successful cleanup, right after every test had already passed -- not a
    # timeout on a hanging step, but the job itself running out of room.
    # Confirmed directly: two consecutive runs on the same PR both completed
    # "1069 passed | 2 skipped" / "30001 passed | 155 skipped" with zero
    # failures, then hit `##[error]The operation was canceled.` seconds later
    # during "Cleaning up test environment...". This job runs MORE steps
    # before the test suite than ci.yml's version (governance/auth/recurrence
    # scanners, tsc, prisma validate, bundle manifest + Stage 7 evidence
    # validators), so its overhead is at least as large. 40 matches ci.yml's
    # value and gives the same real margin.
    timeout-minutes: 40

    env:
      TEST_WITH_DB: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i); retrying in $((i*10))s..."
            sleep $((i*10))
          done

      # governance:scan:a77 shells out to the `rg` binary and was silently
      # reporting every gate as PASS on runners that don't have it (ubuntu-latest
      # does not ship ripgrep by default) -- a spawn failure was indistinguishable
      # from "0 matches found". The script now fails loudly instead of silently
      # passing (see scripts/a77-prevention-gates.ts's assertRgAvailable), so this
      # step is required for that gate to run at all, not just to run correctly.
      - name: Install ripgrep (required by governance:scan:a77)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Governance compliance scan
        run: npm run governance:scan:strict
        continue-on-error: false

      - name: Auth route governance scan
        run: npm run governance:scan:auth
        continue-on-error: false

      - name: A7.7 recurrence prevention gates
        run: npm run governance:scan:a77
        continue-on-error: false

      - name: TypeScript type checking
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Prisma schema validation
        run: npx prisma validate
        continue-on-error: false

      - name: Wrapped handlers ratchet
        run: npm run audit:wrapped-handlers:ratchet
        continue-on-error: false

      - name: CI workflow governance check
        run: node scripts/ci-governance-check.mjs
        continue-on-error: false

      - name: Recurrence defect scanners
        if: inputs.run_recurrence_scanners
        run: node scripts/scan-recurrence-defects.mjs
        continue-on-error: false

      - name: Bundle manifest validator
        if: inputs.run_bundle_validator
        run: node scripts/validate-bundle-manifests.mjs
        continue-on-error: false

      # Default mode: blocks on REJECTED artifacts only, so a malformed or forged
      # artifact fails on the PR that introduces it. Signature and provenance are not
      # checked here — the PR gate holds no signing key, and a gate that cannot check
      # provenance must never report it as verified. A closure gate runs the same
      # validator with --require-accepted --require-provenance.
      - name: Stage 7 evidence artifact validator
        if: inputs.run_bundle_validator
        run: node scripts/validate-evidence-artifacts.mjs
        continue-on-error: false

      - name: Run non-DB test suite
        if: inputs.run_test_suite
        run: |
          if [ -n "${{ inputs.test_pattern }}" ]; then
            npx vitest run --maxWorkers 1 ${{ inputs.test_pattern }}
          else
            EXCLUDES=$(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.files.map(f=>'--exclude '+f.path).join(' '))")
            npx vitest run --maxWorkers 1 --exclude '**/*.db.test.ts' $EXCLUDES
          fi
        env:
          TEST_WITH_DB: "false"
          NODE_ENV: test
        continue-on-error: false
