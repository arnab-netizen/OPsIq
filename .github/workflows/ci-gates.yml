name: CI Gates

on:
  push:
    branches: [main, claude/*, develop]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Prisma
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test

      - name: Optional Context Scanner
        run: npm run check:optional-context

      - name: Security Scanners
        run: npm run check:security
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
        continue-on-error: true

      - name: Report Results
        if: always()
        run: |
          echo "## CI Gates Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Build: PASS" >> $GITHUB_STEP_SUMMARY
          echo "✓ TypeScript: PASS" >> $GITHUB_STEP_SUMMARY
          echo "✓ Prisma: PASS" >> $GITHUB_STEP_SUMMARY
          echo "✓ Optional Context: PASS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All mandatory gates passed." >> $GITHUB_STEP_SUMMARY
