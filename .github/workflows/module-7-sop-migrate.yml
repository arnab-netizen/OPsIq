name: Module 7 SOP Migration

# Manual only. Applies the Module 7 SOP, Process & Execution Accountability
# migration (prisma/migrations/20260613150000_module7_sop) to a network-enabled
# Neon target using the DIRECT (non-pooler) URL from the MIGRATION_DATABASE_URL
# secret. Additive only (creates 5 sop tables). It does NOT deploy the app and
# does NOT run any destructive command.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Database target label (staging only: production schema changes go through migrate-production.yml)'
        required: true
        type: choice
        options:
          - staging
      confirm:
        description: 'Must equal APPLY_MODULE7_SOP_MIGRATION'
        required: true

concurrency:
  group: module-7-sop-migrate-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Module 7 SOP migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.target }}
    env:
      OPSIQ_DB_TARGET: staging
      OPSIQ_APPROVED_STAGING_ENDPOINT_IDS: ${{ vars.OPSIQ_APPROVED_STAGING_ENDPOINT_IDS }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

    steps:
      - name: Confirmation phrase guard (fail closed)
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPLY_MODULE7_SOP_MIGRATION" ]; then
            echo "::error::Confirmation phrase mismatch. Type APPLY_MODULE7_SOP_MIGRATION to proceed."
            exit 1
          fi
          echo "✓ Confirmation accepted. Target: ${{ github.event.inputs.target }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Module 7 sop migration file exists
        run: |
          test -f prisma/migrations/20260613150000_module7_sop/migration.sql
          echo "✓ Migration file present: 20260613150000_module7_sop"

      - name: Preflight - MIGRATION_DATABASE_URL secret present (fail closed, no print)
        run: |
          if [ -z "${{ secrets.MIGRATION_DATABASE_URL }}" ]; then
            echo "::error::MIGRATION_DATABASE_URL secret is missing or empty. Aborting."
            exit 1
          fi
          echo "✓ MIGRATION_DATABASE_URL secret is configured (value not printed)"

      - name: Remove local env files (prevent placeholder/pooler contamination)
        run: |
          rm -f .env .env.local .env.local.bak .env.production .env.staging .env.postgres .env.test
          echo "✓ Removed local .env files so the secret is the sole datasource"

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Migration status (before, informational)
        run: |
          set +e
          npx prisma migrate status
          STATUS_CODE=$?
          set -e
          echo "Pre-deploy migrate status exit code: $STATUS_CODE"
          echo "Non-zero before deploy is expected when pending migrations exist."
          exit 0

      - name: Apply migration (prisma migrate deploy)
        run: npx prisma migrate deploy

      - name: Migration status (after)
        run: npx prisma migrate status

      - name: Summary (no secrets)
        run: |
          echo "Target label        : ${{ github.event.inputs.target }}"
          echo "Migration command   : npx prisma migrate deploy (20260613150000_module7_sop)"
          echo "Tables created      : owner_sop_snapshots, owner_sop_cycles,"
          echo "                      owner_sop_findings, owner_sop_actions,"
          echo "                      owner_sop_verifications (additive only)"
          echo "Status              : completed"
          echo "Next                : Module 7 API + services slice once migration is applied"
