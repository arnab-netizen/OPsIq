name: Main Integration

# Full integration suite — runs on push to main only.
# PR static + non-DB checks are handled by ci.yml (the required PR gate).
# Scenario packs and browser proof are dispatch-only (deep-proof.yml).
# Target: <40 runner-minutes, single postgres:16 job.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ROOT-CAUSE FIX (2026-08-29): this workflow ran its full DB suite
  # unconditionally on every push to main regardless of what changed --
  # confirmed directly on a real merge (PR #373, a 1-line whitespace fix to
  # one workflow file) costing 2595s (~43 min) of full-DB-suite runtime for
  # a change with zero DB/schema/runtime impact. This classifier computes
  # actual risk from the push's real diff so the expensive job below only
  # runs when the change could plausibly need it. A manual workflow_dispatch
  # always runs the full suite regardless of classification -- that path
  # exists specifically for disaster-recovery re-verification of main
  # ("is main actually green"), which the classifier's job is not to
  # second-guess. See scripts/ci-risk-classifier.mjs for the rule set.
  classify:
    name: Classify change risk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full_suite: ${{ steps.decide.outputs.run_full_suite }}
      risk_class: ${{ steps.decide.outputs.risk_class }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Determine changed files and classify risk
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch -- always runs the full suite regardless of risk class (disaster-recovery re-verification path, not a normal push)."
            echo "risk_class=MANUAL_DISPATCH" >> "$GITHUB_OUTPUT"
            echo "run_full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ROOT-CAUSE FIX (owner correction pass, 2026-08-29, Issue 3 --
          # "a potential safety-critical classifier defect"): this MUST use
          # the push event's own before/after commit identities, never a
          # diff against origin/main computed after checkout, because in a
          # job triggered BY this same push origin/main may already equal
          # the new HEAD -- producing a false-empty diff that silently skips
          # full validation on a risky change. classifyPushEvent() in
          # scripts/ci-risk-classifier.mjs implements this with an explicit
          # zero-SHA guard and a fail-safe (any git failure resolving the
          # range classifies UNKNOWN/full, never "no changes"). Proven by 5
          # real-git-repo PUSH TEST scenarios in
          # src/__tests__/workflows/ci-risk-classifier.test.ts.
          node scripts/ci-risk-classifier.mjs --push "${{ github.event.before }}" "${{ github.event.after }}" > /tmp/classify_output.txt
          cat /tmp/classify_output.txt
          RISK_CLASS=$(grep '^risk_class=' /tmp/classify_output.txt | cut -d= -f2)
          RUN_FULL=$(grep '^run_main_integration_full_suite=' /tmp/classify_output.txt | cut -d= -f2)
          echo "risk_class=$RISK_CLASS" >> "$GITHUB_OUTPUT"
          echo "run_full_suite=$RUN_FULL" >> "$GITHUB_OUTPUT"

  full-suite:
    name: Full DB Integration Suite
    needs: classify
    if: needs.classify.outputs.run_full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110

    env:
      TEST_WITH_DB: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
          POSTGRES_INITDB_ARGS: "-c log_min_messages=warning"
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity gate (fail-closed — dispatch must target exact HEAD of main)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "MAIN_INTEGRATION_IDENTITY_FAIL: HEAD=$actual expected=$expected"
            exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "MAIN_INTEGRATION_IDENTITY_FAIL: ref=${{ github.ref }} — dispatch must target refs/heads/main"
            exit 1
          fi
          git fetch origin main --depth=1
          origin_main=$(git rev-parse origin/main)
          if [ "$origin_main" != "$expected" ]; then
            echo "MAIN_INTEGRATION_IDENTITY_FAIL: origin/main=$origin_main != expected=$expected — main advanced after dispatch; re-dispatch required"
            exit 1
          fi
          echo "MAIN_INTEGRATION_IDENTITY_PASS: ref=${{ github.ref }} sha=$actual origin/main=$origin_main"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i); retrying in $((i*10))s..."
            sleep $((i*10))
          done

      - name: Configure .env.local for CI
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          TEST_WITH_DB=true
          EOF
          echo "✓ .env.local configured for CI PostgreSQL service"

      - name: Governance compliance scan
        run: npm run governance:scan:strict
        continue-on-error: false

      - name: Auth route governance scan (blocking)
        run: npm run governance:scan:auth
        continue-on-error: false

      - name: TypeScript type checking
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Prisma schema validation
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
        continue-on-error: false

      - name: Prisma database migration
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
        continue-on-error: false

      - name: Regenerate Prisma client after migrations
        run: npx prisma generate
        continue-on-error: false

      - name: Wrapped handlers ratchet (prevent new violations)
        run: npm run audit:wrapped-handlers:ratchet
        continue-on-error: false

      - name: Stage acceptance integrity gate (CLOSED bundles must have full evidence)
        run: node scripts/validate-stage-acceptance.mjs --mode integrity --stage 3
        continue-on-error: false

      - name: Factory Stage 6 acceptance integrity gate
        run: node scripts/validate-stage-acceptance.mjs --mode integrity --stage factory-6
        continue-on-error: false

      - name: Factory Stage 7 acceptance integrity gate (closure condition 5)
        # Stage 7 closure requires invariant-level proof or an explicit owner waiver
        # (factory-stage-7-closure.yaml closure_conditions.5_invariant_proof). Without
        # this step the condition would be enforced on pull requests but not on main,
        # so a direct push flipping the contract to CLOSED with only the four metadata
        # fields populated would land unchecked.
        run: node scripts/validate-stage-acceptance.mjs --mode integrity --stage factory-7
        continue-on-error: false

      - name: Stage 7 evidence artifact validator
        # G-1: structural evidence enforcement must run on main, not only on pull
        # requests. Without this step a direct push could land a malformed, forged,
        # duplicated or secret-bearing artifact and no gate on main would read it —
        # structurally the same defect PR-1B closed for the Stage 7 closure gate.
        #
        # Default mode deliberately. Main holds no EVIDENCE_SIGNING_KEY and no
        # protected provenance context, so this step rejects structural invalidity
        # but never claims ACCEPTED provenance it cannot verify. Refusing an
        # artifact the right to back a PROVEN invariant is the closure gate's job
        # (scripts/lib/invariant-closure.mjs), which requires ACCEPTED.
        run: node scripts/validate-evidence-artifacts.mjs
        continue-on-error: false

      - name: Bundle manifest validator (evidence and closure conditions)
        # The only gate that reads every manifest in docs/opsiq/bundles/, including the
        # invariant block of stage-closure contracts. Previously ran on PR validation
        # only, leaving main without manifest-level closure enforcement.
        run: node scripts/validate-bundle-manifests.mjs
        continue-on-error: false

      - name: Run full test suite (blocking; quarantine excluded)
        # Full suite including DB tests. Quarantined files excluded from this blocking lane.
        # DB tests require TEST_WITH_DB=true and the postgres service above.
        timeout-minutes: 100
        run: |
          EXCLUDES=$(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.files.map(f=>'--exclude '+f.path).join(' '))")
          echo "Quarantined (excluded from blocking lane): $(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.total_files)") file(s)"
          npx vitest run --maxWorkers 1 $EXCLUDES
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test
          TEST_WITH_DB: "true"
          NODE_ENV: test
        continue-on-error: false

      - name: Run quarantined pre-existing failing tests (non-blocking)
        # Visibility lane: runs ONLY the quarantined files so their status stays
        # observable. Non-blocking — tracked under FULL_SUITE_TEST_DEBT_RECOVERY.
        continue-on-error: true
        run: |
          FILES=$(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.files.map(f=>f.path).join(' '))")
          echo "Running $(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.total_files)") quarantined file(s) (non-blocking):"
          echo "$FILES" | tr ' ' '\n'
          npx vitest run --maxWorkers 1 $FILES
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test
          TEST_WITH_DB: "true"
          NODE_ENV: test

      - name: Upload coverage (if generated)
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  # Always runs, regardless of whether full-suite ran, was skipped, or
  # failed -- this is the "cheap summary job" that makes the classifier's
  # decision and outcome visible without requiring anyone to dig through
  # the classify job's own logs.
  summary:
    name: Main Integration Summary
    needs: [classify, full-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record outcome
        run: |
          set -euo pipefail
          RESULT="${{ needs['full-suite'].result }}"
          if [ "${{ needs.classify.outputs.run_full_suite }}" = "true" ]; then
            if [ "$RESULT" = "success" ]; then
              echo "MAIN_INTEGRATION_EXECUTED_BY_RISK_CLASS=${{ needs.classify.outputs.risk_class }}" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Main Integration full suite required (risk class ${{ needs.classify.outputs.risk_class }}) but did not succeed (result: $RESULT)"
              exit 1
            fi
          else
            echo "MAIN_INTEGRATION_SKIPPED_BY_RISK_CLASS=${{ needs.classify.outputs.risk_class }}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
