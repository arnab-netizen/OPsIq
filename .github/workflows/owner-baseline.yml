name: Owner Pre-Training Baseline (Kolkata laundry)

# Captures OpsIQ's end-to-end response to one realistic messy laundry scenario through the real
# browser/UI/API on a built app + seeded postgres. Measurement only — no production behavior change.
# Uploads the raw capture artifact for before/after comparison after behavioral validation/training.

on:
  push:
    branches: ["claude/pretraining-baseline-hardening"]
  workflow_dispatch:

jobs:
  owner-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPSIQ_DB_TARGET: ci
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test
      AUTH_SECRET: baseline-test-auth-secret-not-a-real-secret
      AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      BASE_URL: http://localhost:3001
      TEST_WITH_DB: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Configure .env.local
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          AUTH_SECRET=baseline-test-auth-secret-not-a-real-secret
          AUTH_URL=http://localhost:3001
          NEXT_PUBLIC_APP_URL=http://localhost:3001
          TEST_WITH_DB=true
          EOF
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
      - name: Prisma generate
        run: npx prisma generate
      - name: Build app
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Seed realistic baseline scenario
        run: npx tsx scripts/seed-baseline-laundry.ts
      - name: Start app
        run: |
          PORT=3001 npm run start > /tmp/app.log 2>&1 &
          up=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login || echo 000)
            if [ "$code" != "000" ]; then echo "app up (HTTP $code)"; up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then echo "app failed to start"; tail -80 /tmp/app.log; exit 1; fi
      - name: Run baseline capture spec
        run: npx playwright test tests/browser/owner-realistic-baseline.spec.ts --project=chromium
      - name: Print captured baseline artifact + app log
        if: always()
        run: |
          echo "BASELINE_ARTIFACT_BEGIN"
          cat artifacts/pre-training-baseline/laundry-kolkata-baseline.json 2>/dev/null || echo "NO_ARTIFACT"
          echo "BASELINE_ARTIFACT_END"
          echo "APPLOG_BEGIN"; tail -30 /tmp/app.log || true; echo "APPLOG_END"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-training-baseline
          path: |
            artifacts/pre-training-baseline
            test-results
          retention-days: 30
