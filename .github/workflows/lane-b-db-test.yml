name: LANE_B — Database Test Bootstrap

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (e.g., claude/execution-audit-phase-a-ulmljq)'
        required: true
        type: string
      test_pattern:
        description: |
          Test file path — one file per dispatch. Known governance DB test files:
          src/__tests__/services/owner-finance/effectiveness-eligibility.db.test.ts
          src/__tests__/services/owner-finance/learning-bridge-concurrency.db.test.ts
          src/__tests__/services/benchmark/case-library.service.db.test.ts
        required: true
        type: string

env:
  NODE_ENV: test
  CI: 'true'
  TEST_WITH_DB: 'true'
  SKIP_ENV_VALIDATION: 'true'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public

jobs:
  lane-b-db-test:
    name: LANE_B DB Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      OPSIQ_DB_TARGET: ci
    steps:
      - name: Checkout code from specified branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Diagnostic — datasource env presence (redacted)
        run: |
          echo "DATABASE_URL present: $([ -n "$DATABASE_URL" ] && echo yes || echo no)"
          echo "TEST_DATABASE_URL present: $([ -n "$TEST_DATABASE_URL" ] && echo yes || echo no)"
          echo "CI: ${CI:-unset}"

      - name: Deploy migrations
        run: npx prisma migrate deploy

      - name: Print checkout details
        run: |
          echo "========================================"
          echo "LANE_B Checkout and Test Selection"
          echo "========================================"
          echo "Checked-out branch: $(git branch --show-current)"
          echo "Checked-out commit: $(git rev-parse HEAD)"
          echo "Requested test_pattern: ${{ github.event.inputs.test_pattern }}"
          echo "Working directory: $(pwd)"
          echo "========================================"

      - name: Validate test pattern is non-empty
        run: |
          TEST_PATTERN="${{ github.event.inputs.test_pattern }}"
          if [ -z "$TEST_PATTERN" ]; then
            echo "FATAL: test_pattern input is EMPTY"
            exit 1
          fi
          echo "✓ test_pattern is non-empty: $TEST_PATTERN"

      - name: Validate test file exists
        run: |
          TEST_PATTERN="${{ github.event.inputs.test_pattern }}"
          if [ ! -f "$TEST_PATTERN" ]; then
            echo "FATAL: test file DOES NOT EXIST at: $TEST_PATTERN"
            echo "Current directory contents (find):"
            find . -name "*.test.ts" -type f | head -20
            exit 1
          fi
          echo "✓ test file exists: $TEST_PATTERN"

      - name: Print test file content (head)
        run: |
          TEST_PATTERN="${{ github.event.inputs.test_pattern }}"
          echo "========================================"
          echo "Test File: $TEST_PATTERN"
          echo "========================================"
          grep -n "describe\|it(" "$TEST_PATTERN" | head -80 || echo "No describe/it patterns found"
          echo "========================================"

      - name: Run DB-backed tests (exact command)
        run: |
          set -o pipefail
          echo "Executing: npm test -- \"${{ github.event.inputs.test_pattern }}\" --run"
          npm test -- "${{ github.event.inputs.test_pattern }}" --run 2>&1 | tee test-output.log
          exit_code=$?

          # Hard guard: fail if Playwright/browser tests ran
          if grep -qE "tests/browser/|e2e/|Playwright|chromium_headless_shell|playwright" test-output.log; then
            echo ""
            echo "========================================"
            echo "FATAL: Playwright/browser tests ran instead of DB test"
            echo "========================================"
            cat test-output.log
            exit 1
          fi

          exit $exit_code

      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-test-results
          path: |
            test-output.log
            test-results/
            coverage/
          retention-days: 30
