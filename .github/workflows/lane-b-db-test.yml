name: LANE_B — Database Test Bootstrap

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (e.g., claude/execution-audit-phase-a-ulmljq)'
        required: true
        type: string
      test_pattern:
        description: 'Test file pattern (e.g., src/__tests__/services/benchmark/case-library.service.db.test.ts)'
        required: true
        type: string

env:
  NODE_ENV: test
  TEST_WITH_DB: 'true'
  SKIP_ENV_VALIDATION: 'true'

jobs:
  lane-b-db-test:
    name: LANE_B DB Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code from specified branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure test database URL
        run: |
          cat > .env.test << EOF
          DATABASE_URL="${{ secrets.TEST_DATABASE_URL }}"
          DIRECT_URL="${{ secrets.TEST_DATABASE_URL }}"
          TEST_DATABASE_URL="${{ secrets.TEST_DATABASE_URL }}"
          NODE_ENV="test"
          SKIP_ENV_VALIDATION="true"
          EOF

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Run DB-backed tests
        run: npm test -- '${{ github.event.inputs.test_pattern }}' --run
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-test-results
          path: |
            test-results/
            coverage/
          retention-days: 30
