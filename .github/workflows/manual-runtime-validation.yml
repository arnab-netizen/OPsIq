name: Manual Runtime Validation

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Optional description of this validation run'
        required: false
        type: string

jobs:
  runtime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      # Deliberate remote TEST database: explicit opt-in required by src/infra/test-database-guard.ts.
      OPSIQ_ALLOW_REMOTE_TEST_DB: 'true'
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail-closed identity preflight (src/infra/production-db-identity.ts). A mislabeled secret that points at
      # PRODUCTION must stop HERE, before any test, migration or reset touches it. Static check (known production
      # endpoint) then a read-only in-database identity read. Prints variable names and refusal codes only —
      # never a URL, host, user or password.
      # This workflow runs `prisma migrate deploy` against DATABASE_URL (a generically named secret).
      - name: Assert database is not production (identity preflight)
        run: npx tsx scripts/assert-non-production-database.ts DATABASE_URL DATABASE_URL_TEST?

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy migrations
        run: npx prisma migrate deploy

      - name: Check for schema drift
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm run test:merge

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  result-summary:
    runs-on: ubuntu-latest
    needs: runtime-validation
    if: always()
    steps:
      - name: Report success
        if: needs.runtime-validation.result == 'success'
        run: echo "✅ RUNTIME VALIDATION PASSED"

      - name: Report failure
        if: needs.runtime-validation.result == 'failure'
        run: |
          echo "❌ RUNTIME VALIDATION FAILED"
          exit 1
