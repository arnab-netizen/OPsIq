name: Scheduled Production Database Backup

# Automated cadence for the P2 "Backup/recovery automation" item in
# docs/opsiq/status/CURRENT_MAIN_CLOSURE_REGISTER.md. Runs scripts/
# backup-database.sh (root-cause-fixed 2026-08-27 -- see that file's
# header) against the production Neon database on a daily schedule, then
# uploads the checksummed, integrity-verified backup as a GitHub Actions
# artifact.
#
# WHY THIS AND NOT AN EXTERNAL BUCKET: this repo has no AWS/S3 (or other
# external storage) account or credential today. Adding one is an
# infrastructure decision -- and a new secret -- that belongs to the
# owner (see the runbook at docs/DATABASE_BACKUP_RECOVERY_RUNBOOK.md,
# "Storage target decision"). GitHub Actions artifacts require no new secret, no new
# vendor, and no new infrastructure: this repo is private
# (arnab-netizen/OPsIq) and already uses actions/upload-artifact@v4
# elsewhere. `retention-days` below is GitHub's own enforced, bounded
# expiry -- it satisfies "retention policy, not unbounded accumulation"
# without any pruning logic of our own. scripts/cleanup-old-backups.sh is
# NOT invoked by this workflow: it prunes a persistent local directory,
# and a GitHub Actions runner has no such persistent disk between runs --
# every backup this workflow ever produces lives only as a GitHub
# artifact, expired by GitHub itself. cleanup-old-backups.sh stays in the
# repo for the alternate scenario (self-hosted runner or external storage
# target with a persistent mount) where a local retention sweep would
# actually have something to prune.
#
# SECRET REUSE, NOT A NEW SECRET: uses secrets.PRODUCTION_DATABASE_URL,
# the same secret migrate-production.yml already uses -- confirmed by
# that workflow's own preflight comment to be the DIRECT (non-pooler)
# production endpoint, which is exactly what pg_dump needs (Neon's own
# guidance is to avoid pg_dump over a pooled connection).
#
# WHAT THIS DOES NOT DO: it does not restore anything, and it never
# touches any target other than the production database it reads from
# (read-only pg_dump). The restore path -- and the only place anything is
# ever written back -- is exercised exclusively by
# .github/workflows/restore-rehearsal.yml, against a disposable
# in-workflow container, never against production.

on:
  schedule:
    # Daily, off the top of the hour. Times are UTC.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scheduled-production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Production Database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight check - PRODUCTION_DATABASE_URL secret exists
        run: |
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "::error::PRODUCTION_DATABASE_URL secret is missing or empty"
            exit 1
          fi
          echo "PRODUCTION_DATABASE_URL secret is configured"

      # ROOT-CAUSE FIX (2026-08-28): the first real dispatch of this workflow
      # failed instantly with "pg_dump: error: aborting because of server
      # version mismatch" (server version: 18.6, pg_dump version: 16.15).
      # pg_dump hard-refuses to dump FROM a server whose major version is
      # NEWER than the pg_dump binary itself (the reverse direction --
      # dumping an older server with a newer pg_dump -- is fine and is
      # pg_dump's normal supported mode). Ubuntu 24.04's own default apt
      # repo caps `postgresql-client` at major version 16, which is now
      # older than Neon's actual running server (18). Every OTHER workflow
      # in this repo that touches Neon (production-db-status.yml,
      # reset-staging-db.yml, resolve-failed-migration.yml) only runs
      # `psql`, which has no such version gate -- this is the first
      # workflow to invoke `pg_dump` against the real database, which is
      # why this defect was invisible until now.
      #
      # Fix: install from the official PostgreSQL (PGDG) apt repository
      # instead of Ubuntu's, and take its unversioned `postgresql-client`
      # metapackage rather than pinning a specific major version -- PGDG
      # tracks the current stable major, so this stays ahead of Neon's own
      # server version over time instead of re-breaking on Neon's next
      # major upgrade.
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -qq -y postgresql-client

          # ROOT-CAUSE FIX #2 (2026-08-28, same day as the PGDG-repo fix
          # above): installing the PGDG package does NOT make its pg_dump
          # take over the bare `pg_dump` command on this runner image.
          # Confirmed directly on a real dispatch (run 33203186884):
          # postgresql-client-18 installed real binaries at
          # /usr/lib/postgresql/18/bin, but `pg_dump --version` right
          # after this same install step still printed "16.15 (Ubuntu
          # 16.15-1.pgdg24.04+2)" -- this runner image already carries
          # Ubuntu's own postgresql-client, and /usr/bin/pg_dump's
          # wrapper/alternative was never repointed at the newly
          # installed PGDG version by the plain `apt-get install` above.
          # Stop trusting PATH resolution of the bare `pg_dump` command:
          # find the highest-versioned client actually installed under
          # /usr/lib/postgresql (Debian/Ubuntu's own real-binary
          # location for every postgresql-client-<N> package) and
          # prepend ITS bin directory to PATH directly, then verify the
          # override actually took effect before proceeding -- fail
          # closed rather than silently falling back to the wrong binary
          # a second time.
          PG_CLIENT_VERSION=$(ls /usr/lib/postgresql | sort -V | tail -1)
          if [ -z "$PG_CLIENT_VERSION" ] || [ ! -x "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin/pg_dump" ]; then
            echo "::error::Could not locate an installed PGDG pg_dump binary under /usr/lib/postgresql"
            exit 1
          fi
          echo "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin:$PATH"

          RESOLVED_PG_DUMP=$(command -v pg_dump)
          if [ "$RESOLVED_PG_DUMP" != "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin/pg_dump" ]; then
            echo "::error::pg_dump resolves to $RESOLVED_PG_DUMP, not the PGDG client at /usr/lib/postgresql/${PG_CLIENT_VERSION}/bin/pg_dump -- PATH override did not take effect"
            exit 1
          fi
          pg_dump --version

      - name: Run backup
        id: backup
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          mkdir -p backup-output
          bash scripts/backup-database.sh backup-output 9
          BACKUP_FILE=$(ls -t backup-output/opsiq_backup_*.sql.gz | head -1)
          echo "backup_file=$BACKUP_FILE" >> "$GITHUB_OUTPUT"
          echo "backup_name=$(basename "$BACKUP_FILE")" >> "$GITHUB_OUTPUT"

      - name: Assert checksum file was produced
        run: |
          if [ ! -f "${{ steps.backup.outputs.backup_file }}.sha256" ]; then
            echo "::error::No .sha256 checksum file produced alongside the backup"
            exit 1
          fi
          echo "Checksum file present: $(cat "${{ steps.backup.outputs.backup_file }}.sha256")"

      # Bounded retention: GitHub deletes this artifact automatically after
      # retention-days. No unbounded accumulation, no pruning script needed
      # for this storage target (see header comment).
      - name: Upload backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opsiq-production-backup-${{ github.run_id }}
          path: backup-output/
          retention-days: 35
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opsiq-production-backup-FAILED-${{ github.run_id }}
          path: backup-output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: success()
        run: |
          echo "Backup completed: ${{ steps.backup.outputs.backup_name }}"
          echo "Stored as GitHub Actions artifact 'opsiq-production-backup-${{ github.run_id }}', expires in 35 days."
          echo "To restore-rehearse this exact backup, dispatch restore-rehearsal.yml with run_id=${{ github.run_id }}."
