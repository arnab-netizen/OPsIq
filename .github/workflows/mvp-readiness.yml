name: MVP Readiness Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  readiness-check:
    name: MVP Readiness Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test

    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run MVP Readiness Check
        run: bash scripts/mvp-readiness-check.sh
        continue-on-error: false

      - name: Report Results
        if: always()
        run: |
          echo "### MVP Readiness Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "**Status**: ✅ READY FOR DEPLOYMENT" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status**: ❌ NOT READY" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail workflow if readiness check failed
        if: failure()
        run: |
          echo "MVP readiness gate failed. Check logs above for details."
          exit 1

  validate-branch:
    name: Validate Branch Status
    runs-on: ubuntu-latest
    needs: readiness-check
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate commit message
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Last commit: $COMMIT_MSG"

          # Check for common commit types
          if [[ "$COMMIT_MSG" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|build)(\(.+\))?:\ .+ ]] || \
             [[ "$COMMIT_MSG" =~ ^(Block|Phase|MVP|OPSIQ) ]]; then
            echo "✓ Commit message format looks good"
          else
            echo "⚠  Consider using conventional commit format"
          fi

      - name: Check for TODO comments in code
        continue-on-error: true
        run: |
          echo "Checking for TODO/FIXME comments..."
          TODOS=$(grep -r "TODO\|FIXME" src --include="*.ts" --include="*.tsx" 2>/dev/null | wc -l)
          if [ "$TODOS" -gt 0 ]; then
            echo "⚠  Found $TODOS TODO/FIXME comments"
          else
            echo "✓ No TODO/FIXME comments found"
          fi

  security-scan:
    name: Security Baseline Check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for vulnerable dependencies
        run: |
          npm audit --audit-level=moderate || true
          echo ""
          echo "⚠  Note: npm audit failures are warnings only"
          echo "    Run 'npm audit' locally to review vulnerabilities"

  summary:
    name: Readiness Summary
    runs-on: ubuntu-latest
    needs: [readiness-check, validate-branch, security-scan]
    if: always()

    steps:
      - name: Print final status
        run: |
          echo "=========================================="
          echo "MVP READINESS GATE SUMMARY"
          echo "=========================================="
          echo ""
          echo "Readiness Check: ${{ needs.readiness-check.result }}"
          echo "Branch Validation: ${{ needs.validate-branch.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo ""
          if [[ "${{ needs.readiness-check.result }}" == "success" ]]; then
            echo "✅ MVP IS READY FOR DEPLOYMENT"
          else
            echo "❌ MVP IS NOT READY"
          fi
          echo ""
          echo "=========================================="

      - name: Enforce readiness gate
        if: needs.readiness-check.result != 'success'
        run: |
          echo "❌ Readiness gate failed"
          exit 1
