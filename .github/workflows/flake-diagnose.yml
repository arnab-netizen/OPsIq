name: Flake Diagnose (temporary)

# Temporary diagnostic lane: runs the full maintained DB suite (quarantine excluded, same as
# ci.yml) and prints the failing test files/cases with a grep-able marker so the exact flaky
# tests can be identified (the postgres service teardown log otherwise masks the vitest summary).
# Non-blocking (exit 0). Removed once the flakes are fixed.

on:
  push:
    branches: ["claude/full-repo-jarvis-db-blocker-closure"]
  workflow_dispatch:

jobs:
  flake-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_WITH_DB: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Configure .env.local
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          TEST_WITH_DB=true
          EOF
      - name: Migrate deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
      - run: npx prisma generate
      - name: Run only DB-relevant tests (fast) and print failing files
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test
          TEST_WITH_DB: "true"
          NODE_ENV: test
        run: |
          set +e
          # Only the DB-touching test population (the flake families live here), not all ~750 files.
          FILES=$(node -e "const {execSync}=require('child_process'); const out=execSync('grep -rl \"\\\\[db\\\\]\\\\|TEST_WITH_DB\\\\|db.\\\\|snapshot_data\\\\|canonicalEvent\\\\|ownerFinancialSnapshot\\\\|snapshotData' src/__tests__ --include=*.test.ts -l').toString(); console.log(out.split('\n').filter(Boolean).join(' '))" 2>/dev/null)
          echo "FLAKEDIAG_NFILES $(echo $FILES | wc -w)"
          npx vitest run --maxWorkers 1 --reporter=json --outputFile=/tmp/res.json $FILES >/tmp/run.log 2>&1
          echo "FLAKEDIAG_BEGIN"
          node -e '
            try {
              const r=require("/tmp/res.json");
              const failed=(r.testResults||[]).filter(t=>t.status!=="passed");
              for(const f of failed){
                console.log("FLAKEDIAG_FILE "+f.name+" :: "+f.status);
                for(const a of (f.assertionResults||[]).filter(x=>x.status!=="passed")){
                  console.log("FLAKEDIAG_CASE   "+a.fullName+" :: "+(a.failureMessages?a.failureMessages.join(" | ").slice(0,300):a.status));
                }
              }
              console.log("FLAKEDIAG_TOTAL failed_files="+failed.length);
            } catch(e){ console.log("FLAKEDIAG_NOJSON "+e.message); }
          ' 2>&1 | head -300
          echo "FLAKEDIAG_END"
          exit 0
