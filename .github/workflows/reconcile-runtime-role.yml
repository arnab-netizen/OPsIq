name: Reconcile Runtime Role

# Manual trigger only. Governed Production path for the already-reviewed tool
# scripts/db/opsiq-role-cutover.ts's RECONCILE-ONLY operation on the opsiq_app runtime role's table grants --
# see docs/opsiq/product/RUNTIME_ROLE_CUTOVER.md. Three modes, mutually exclusive:
#
#   DISCOVER  read-only. Runs `verify --phase post` and reports the current grant state. If the runtime
#             role does not exist yet (the documented pre-cutover state), this is reported as
#             runtimeRoleState=ABSENT -- an expected discovery outcome, not a workflow failure.
#   DRY_RUN   read-only overall. Runs `apply --dry-run --only-if-present`: the tool opens one transaction,
#             applies the reconcile statements, verifies the result INSIDE that transaction, and then
#             unconditionally ROLLBACKs because --dry-run is set (src/services/privacy-erasure/
#             role-topology.ts's applyAndVerifyRoleTopology only COMMITs when the verification passes AND
#             dryRun is false) -- so this performs zero persisted mutation regardless of outcome, while still
#             reporting what the reconcile WOULD do. If the runtime role does not exist, --only-if-present
#             short-circuits before any transaction opens (SKIPPED_ROLE_ABSENT, exit 0).
#   APPLY     potentially mutating. Runs the real `apply --only-if-present` with the exact confirm phrase.
#             Strictly reconcile-only by the tool's own contract: if opsiq_app does not exist, this is a
#             no-op (SKIPPED_ROLE_ABSENT, exit 0) -- it NEVER creates the role. If it exists, the tool
#             REVOKEs ALL then re-GRANTs exactly SELECT/INSERT/UPDATE/DELETE on Prisma-modelled writable
#             tables and SELECT-only on readonly ones, recomputed from prisma/schema.prisma every run.
#
# WHAT THIS WORKFLOW CAN NEVER DO: create the opsiq_app role, set or rotate any password (the tool never
# reads, accepts or prints one), touch any Vercel variable, run arbitrary SQL, or reconcile a role other
# than opsiq_app (the role name is the tool's own default and is not an input here). Every database
# statement is issued by the one reviewed repository script, scripts/db/opsiq-role-cutover.ts; this workflow
# only chooses its command/flags and gates when it may run.
#
# CREDENTIAL: OWNER_DATABASE_URL (the env var the tool itself requires) is sourced from the existing GitHub
# secret `OPERATOR_DATABASE_URL` in the `production-operator` environment -- the SAME neondb_owner
# schema-owner/migrator credential migrate-production.yml already holds (it passes the identical secret to
# Prisma as MIGRATION_DATABASE_URL) and the same DIRECT, non-pooler endpoint that migrate-production.yml's
# own "Validate DATABASE_URL safety" step requires. docs/opsiq/product/RUNTIME_ROLE_CUTOVER.md's §1 role
# table lists both consumers against the single role `neondb_owner (migrator)`; its secret name there
# (`PRODUCTION_DATABASE_URL`) is the pre-rename name, superseded by
# docs/opsiq/ci/PRODUCTION_SECRET_ISOLATION.md, under which the live secret for this exact credential is
# `OPERATOR_DATABASE_URL`. This workflow therefore references `secrets.OPERATOR_DATABASE_URL` directly and
# does NOT ask the owner to store a second copy of the same credential under a new name.
#
# Modeled on provision-acceptance-fixture-operator.yml and migrate-production.yml: workflow_dispatch only,
# environment: production-operator (the GitHub Environment is the human approval gate -- reused, not a new
# one), an owner-pinned exact main SHA, an exact-hostname gate on the production secret before any script
# runs (the shared scripts/validate-expected-db-host.mjs, not a second implementation) and the same gate
# again inside the tool itself (src/infra/role-cutover-target.ts, which additionally requires the DIRECT,
# non-pooler endpoint and the database's own Neon identity to agree with --target production).
#
# STEP ORDERING CONTRACT: Group 1 validates only the raw dispatch inputs and reads no repository file. Group
# 2 starts with Checkout main, then verifies HEAD exactly equals expected_main_sha (equality, not ancestry),
# and only then does any step import or execute a repository file.
#
# SCRIPT-INJECTION HARDENING: every ${{ inputs.* }} / ${{ secrets.* }} used in a run: block is passed through
# the step's env: first and referenced as a shell variable, never interpolated into the script text. if:
# conditions use the runner's expression engine and are safe as direct inputs.* references.
#
# SECRET HYGIENE: OWNER_DATABASE_URL (sourced from OPERATOR_DATABASE_URL) is only ever passed as step env.
# It is never echoed; the tool itself never prints a password, URL, host or user (confirmed from source --
# every error path is sanitized). The run summary prints only the owner-pinned expected host, the checked-
# out SHA, booleans/counts and table names the verifier reports -- never a credential.
#
# PRE/POST VERIFICATION (APPLY only): `verify --phase post` runs once BEFORE the apply step and once AFTER
# it. Both captures are parsed by the shared, read-only scripts/db/parse-role-topology-verify.mjs and diffed
# in the job summary, so a reviewer can see exactly what the grant state was before this run and what it is
# after, without re-deriving it from raw tool output.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'DISCOVER (read-only verify) / DRY_RUN (read-only overall: apply --dry-run rolls back) / APPLY (reconcile-only apply --only-if-present; needs the exact confirm phrase)'
        required: true
        default: 'DISCOVER'
        type: choice
        options:
          - DISCOVER
          - DRY_RUN
          - APPLY
      expected_main_sha:
        description: 'Required. Exact 40-character lowercase hex commit SHA on main this dispatch is authorized against. If main has advanced past it, the run refuses.'
        required: true
        type: string
      expected_database_host:
        description: 'Required. Exact owner-authorized production DIRECT (non-pooler) DB hostname, bare hostname only (e.g. ep-xxxx.region.aws.neon.tech) -- never a URL, credentials, path or query string'
        required: true
        type: string
      confirm:
        description: 'APPLY only: must be exactly "APPLY PRODUCTION RUNTIME ROLE TOPOLOGY". DISCOVER and DRY_RUN: leave empty.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: reconcile-runtime-role
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile opsiq_app Runtime Role Grants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-operator

    steps:
      # ── Workflow-origin guard (fail-closed; FIRST step, before anything that references a secret) ───────────
      - name: Assert workflow origin is main (fail-closed)
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch|schedule) ;;
            *) echo "::error::refusing to run: unexpected trigger '${GITHUB_EVENT_NAME}'"; exit 1 ;;
          esac
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::refusing to run: ref is '${GITHUB_REF}', must be refs/heads/main"
            exit 1
          fi
          case "${GITHUB_WORKFLOW_REF}" in
            *"@refs/heads/main") ;;
            *) echo "::error::refusing to run: the workflow definition is not from refs/heads/main"; exit 1 ;;
          esac
          echo "Workflow origin verified: ${GITHUB_WORKFLOW_REF}"

      # ---- Group 1: input-only validation, no repository content needed ----

      - name: Validate mode input
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            DISCOVER|DRY_RUN|APPLY) ;;
            *)
              echo "::error::Invalid mode '$MODE'. Must be DISCOVER, DRY_RUN or APPLY."
              exit 1
              ;;
          esac
          echo "✓ Mode: $MODE"

      - name: Validate expected_main_sha format (reject non-40-char SHA input)
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          if ! echo "$EXPECTED_MAIN_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::expected_main_sha must be a full 40-character lowercase hex commit SHA."
            exit 1
          fi
          echo "✓ expected_main_sha format valid"

      - name: Confirm explicit intent (APPLY requires the exact phrase; other modes require none)
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$MODE" = "APPLY" ]; then
            if [ "$CONFIRM" != "APPLY PRODUCTION RUNTIME ROLE TOPOLOGY" ]; then
              echo "::error::APPLY mode requires the confirm input to be exactly \"APPLY PRODUCTION RUNTIME ROLE TOPOLOGY\". Aborting."
              exit 1
            fi
            echo "✓ Explicit confirmation received for APPLY"
          else
            if [ -n "$CONFIRM" ]; then
              echo "::error::confirm must be empty in $MODE mode; a confirmation phrase is meaningful only for APPLY."
              exit 1
            fi
            echo "✓ No confirmation supplied, as required for $MODE"
          fi

      # ---- Group 2: repository-dependent. Nothing above reads a repository file. Checkout happens first,
      # SHA equality is verified immediately after, and only then does any step read a repository file. ----

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify checked-out SHA exactly equals expected_main_sha
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Checked-out SHA: $CURRENT_SHA"
          echo "Expected main SHA: $EXPECTED_MAIN_SHA"
          if [ "$CURRENT_SHA" != "$EXPECTED_MAIN_SHA" ]; then
            echo "::error::main's current HEAD does not exactly equal expected_main_sha. main has moved since this dispatch was authorized - refusing. Re-authorize against the current SHA and re-dispatch."
            exit 1
          fi
          echo "✓ Checked-out SHA matches expected_main_sha exactly"
          echo "MAIN_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"

      - name: Validate expected_database_host format (bare hostname only)
        env:
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
        run: |
          node --input-type=module -e "
            const { isValidExpectedHost } = await import(process.cwd() + '/scripts/validate-expected-db-host.mjs');
            const r = isValidExpectedHost(process.env.EXPECTED_DATABASE_HOST);
            if (!r.ok) { console.error('::error::' + r.reason); process.exit(1); }
            console.log('✓ expected_database_host format valid');
          "

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Preflight check - OPERATOR_DATABASE_URL secret exists
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::OPERATOR_DATABASE_URL secret is missing or empty"
            exit 1
          fi
          echo "✓ OPERATOR_DATABASE_URL secret is configured"

      - name: Remove local environment files
        run: |
          rm -f .env .env.local .env.production .env.staging .env.postgres .env.local.bak
          echo "✓ Removed all local .env files to prevent placeholder contamination"

      - name: Verify exact production database host matches owner-pinned expectation (workflow-level gate)
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
        run: node scripts/validate-expected-db-host.mjs

      # ---- DISCOVER: read-only verify --phase post. A non-conforming or ABSENT state is a legitimate,
      # expected discovery outcome (not a workflow error) and must not fail this step; only a genuine tool
      # refusal/error (bad gate, connection failure -- no ROLE_TOPOLOGY_VERIFY token printed at all) does. ----

      - name: DISCOVER - verify current grant state (read-only)
        if: inputs.mode == 'DISCOVER'
        env:
          OWNER_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
          # Postgres itself rejects any write on this session, independent of what the tool contains.
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          set +e
          npx tsx scripts/db/opsiq-role-cutover.ts verify --target production \
            --expected-host "$EXPECTED_DATABASE_HOST" \
            --phase post > "$RUNNER_TEMP/discover.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/discover.txt"
          if ! grep -q '^ROLE_TOPOLOGY_VERIFY=' "$RUNNER_TEMP/discover.txt"; then
            echo "::error::verify did not complete (no ROLE_TOPOLOGY_VERIFY token in output) -- treat as a hard failure, not a reportable grant state."
            exit 1
          fi
          echo "DISCOVER_COMPLETED=true" >> "$GITHUB_ENV"

      # ---- DRY_RUN: apply --dry-run --only-if-present. The tool itself guarantees zero persisted mutation
      # (it rolls back unconditionally when --dry-run is set, and --only-if-present short-circuits before
      # any transaction if the role is absent). A hypothetical FAIL (the reconcile would not pass if run for
      # real right now) is informational, not a workflow error; only a genuine refusal/error is. ----

      - name: DRY_RUN - apply --dry-run --only-if-present (rolls back; zero persisted mutation)
        if: inputs.mode == 'DRY_RUN'
        env:
          OWNER_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
        run: |
          set -euo pipefail
          set +e
          npx tsx scripts/db/opsiq-role-cutover.ts apply --target production \
            --expected-host "$EXPECTED_DATABASE_HOST" \
            --dry-run --only-if-present > "$RUNNER_TEMP/dryrun.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/dryrun.txt"
          if ! grep -q '^ROLE_TOPOLOGY_APPLY=' "$RUNNER_TEMP/dryrun.txt"; then
            echo "::error::apply --dry-run did not complete (no ROLE_TOPOLOGY_APPLY token in output) -- hard failure."
            exit 1
          fi
          echo "DRY_RUN_COMPLETED=true" >> "$GITHUB_ENV"

      # ---- APPLY: potentially mutating. Pinned pre-check, the real apply, then a pinned post-check. ----

      - name: APPLY pre-check - verify --phase post (read-only, BEFORE)
        if: inputs.mode == 'APPLY'
        env:
          OWNER_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          set +e
          npx tsx scripts/db/opsiq-role-cutover.ts verify --target production \
            --expected-host "$EXPECTED_DATABASE_HOST" \
            --phase post > "$RUNNER_TEMP/before.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/before.txt"
          if ! grep -q '^ROLE_TOPOLOGY_VERIFY=' "$RUNNER_TEMP/before.txt"; then
            echo "::error::pre-check verify did not complete -- refusing to proceed to APPLY without a known starting grant state."
            exit 1
          fi
          echo "PRE_VERIFY_COMPLETED=true" >> "$GITHUB_ENV"

      - name: APPLY - run apply --only-if-present (reconcile-only; never creates the role)
        if: inputs.mode == 'APPLY'
        env:
          OWNER_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
          CONFIRM_PHRASE: ${{ inputs.confirm }}
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
        run: |
          set -euo pipefail
          echo "APPLY_STARTED=true" >> "$GITHUB_ENV"
          npx tsx scripts/db/opsiq-role-cutover.ts apply --target production \
            --expected-host "$EXPECTED_DATABASE_HOST" \
            --only-if-present \
            --confirm "$CONFIRM_PHRASE" | tee "$RUNNER_TEMP/apply.txt"
          echo "APPLY_SUCCEEDED=true" >> "$GITHUB_ENV"
          if grep -q '^ROLE_TOPOLOGY_APPLY=SKIPPED_ROLE_ABSENT$' "$RUNNER_TEMP/apply.txt"; then
            echo "APPLY_RESULT=SKIPPED_ROLE_ABSENT" >> "$GITHUB_ENV"
          elif grep -q '^ROLE_TOPOLOGY_APPLY=PASS$' "$RUNNER_TEMP/apply.txt"; then
            echo "APPLY_RESULT=PASS" >> "$GITHUB_ENV"
          else
            echo "APPLY_RESULT=UNKNOWN" >> "$GITHUB_ENV"
          fi

      - name: APPLY post-check - verify --phase post (read-only, AFTER)
        if: inputs.mode == 'APPLY'
        env:
          OWNER_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
          OPSIQ_DB_TARGET: production
          OPSIQ_ALLOW_PRODUCTION_DB_COMMAND: 'true'
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          set +e
          npx tsx scripts/db/opsiq-role-cutover.ts verify --target production \
            --expected-host "$EXPECTED_DATABASE_HOST" \
            --phase post > "$RUNNER_TEMP/after.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/after.txt"
          if ! grep -q '^ROLE_TOPOLOGY_VERIFY=' "$RUNNER_TEMP/after.txt"; then
            echo "::error::post-check verify did not complete after APPLY -- outcome uncertain, inspect logs before assuming anything about the current grant state."
            exit 1
          fi
          echo "POST_VERIFY_COMPLETED=true" >> "$GITHUB_ENV"
          if [ "${APPLY_RESULT:-UNKNOWN}" = "PASS" ]; then
            if ! grep -q '^ROLE_TOPOLOGY_VERIFY=PASS$' "$RUNNER_TEMP/after.txt"; then
              echo "::error::APPLY committed a reconcile but the post-apply verify did not report PASS. Investigate immediately -- the runtime role may be left in an inconsistent state."
              exit 1
            fi
            echo "✓ Post-apply verify confirms PASS after a committed reconcile"
          else
            echo "Note: APPLY result was ${APPLY_RESULT:-UNKNOWN} (no reconcile committed, e.g. the role does not exist yet), so the post-apply grant state is expected to be unchanged from the pre-apply state."
          fi

      - name: Run summary
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
        run: |
          {
            echo "## Reconcile Runtime Role Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Mode | $MODE |"
            echo "| Timestamp | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |"
            echo "| Checked-out main SHA | \`${MAIN_SHA:-unknown}\` |"
            echo "| Expected DB host (direct, owner-pinned) | \`$EXPECTED_DATABASE_HOST\` |"
            echo "| Runtime role | opsiq_app (hard-coded default in the tool; not an input) |"
            echo "| Credential | OWNER_DATABASE_URL, sourced from the existing secret OPERATOR_DATABASE_URL (same credential migrate-production.yml uses) |"
            echo ""

            if [ "$MODE" = "DISCOVER" ] && [ "${DISCOVER_COMPLETED:-false}" = "true" ]; then
              echo "**Result:** discovery completed. No production mutation occurred."
              echo ""
              node scripts/db/parse-role-topology-verify.mjs "$RUNNER_TEMP/discover.txt" || true
              echo ""
              echo '<details><summary>Full verify output</summary>'
              echo ''
              echo '```'
              cat "$RUNNER_TEMP/discover.txt"
              echo '```'
              echo '</details>'

            elif [ "$MODE" = "DRY_RUN" ] && [ "${DRY_RUN_COMPLETED:-false}" = "true" ]; then
              echo "**Result:** dry run completed. The tool's own transaction (if one was opened) was rolled back unconditionally -- zero persisted mutation."
              echo ""
              echo '<details><summary>Full apply --dry-run output</summary>'
              echo ''
              echo '```'
              cat "$RUNNER_TEMP/dryrun.txt"
              echo '```'
              echo '</details>'

            elif [ "$MODE" = "APPLY" ] && [ "${APPLY_SUCCEEDED:-false}" = "true" ] && [ "${POST_VERIFY_COMPLETED:-false}" = "true" ]; then
              echo "**Result:** APPLY completed with result \`${APPLY_RESULT:-UNKNOWN}\`."
              echo ""
              echo "### Pre/post grant-state diff"
              echo ""
              echo '```'
              echo "BEFORE:"
              node scripts/db/parse-role-topology-verify.mjs "$RUNNER_TEMP/before.txt" || true
              echo ""
              echo "AFTER:"
              node scripts/db/parse-role-topology-verify.mjs "$RUNNER_TEMP/after.txt" || true
              echo '```'
              echo ""
              echo '<details><summary>Full before/after verify output</summary>'
              echo ''
              echo '```'
              echo "--- BEFORE ---"
              cat "$RUNNER_TEMP/before.txt"
              echo "--- AFTER ---"
              cat "$RUNNER_TEMP/after.txt"
              echo '```'
              echo '</details>'

            elif [ "$MODE" = "APPLY" ] && [ "${APPLY_STARTED:-false}" != "true" ]; then
              echo "**Result: NOT_EXECUTED** - a gate did not pass; the apply tool never ran. No production mutation occurred."

            else
              echo "**Result: UNCERTAIN_OR_FAILED** - inspect this job's logs before assuming any outcome. Do not assume the grant state changed or stayed the same."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
