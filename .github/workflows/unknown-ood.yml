name: Unknown / OOD Pack (DB + Browser + Mobile)

# Proof that all 110 counted Unknown/Novel/OOD scenarios run through the REAL DB-backed owner plan path and
# render the runtime-fed Supervisor Summary in a real browser (desktop + mobile). OpsIQ handles unknowns
# SAFELY (novelty -> confidence down -> need_more_data / block / owner-gate); it does NOT claim to solve
# unknown-unknowns. Additive lane; does NOT modify chaos-exhaustive.yml or owner-pilot-e2e.

on:
  workflow_dispatch:

jobs:
  ood-db:
    name: All-110 Unknown/OOD DB-backed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPSIQ_DB_TARGET: ci
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      TEST_WITH_DB: "true"
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: opsiq_test }
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 10s
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: npm }
      - name: Install dependencies (bounded retry on transient npm failure)
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i/3); retrying in $((i*10))s..."
            sleep $((i*10))
          done
      - name: Prisma migrate + generate
        run: |
          npx prisma migrate deploy
          npx prisma generate
      - name: OOD schema + invariant tests
        run: npx vitest run src/__tests__/scenarios/unknown-ood-pack.test.ts
      - name: All-110 Unknown/OOD DB-backed proof
        run: npx vitest run src/__tests__/scenarios/unknown-ood-db.db.test.ts
      - name: Assert OOD DB covered exactly 110
        run: |
          node -e '
            const d=require("./OPSIQ_UNKNOWN_OOD_PACK.run.json");
            const pass=Object.values(d.results).filter(r=>r.dbStatus==="pass").length;
            if(d.count!==110||pass!==110){console.error("OOD DB not 110/110:",d.count,pass);process.exit(1);}
            console.log("OOD DB 110/110 OK");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ood-db-ledger, path: OPSIQ_UNKNOWN_OOD_PACK.run.json, retention-days: 7 }

  ood-browser:
    name: All-110 Unknown/OOD desktop + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      OPSIQ_DB_TARGET: ci
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      AUTH_SECRET: e2e-test-auth-secret-not-a-real-secret
      AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      BASE_URL: http://localhost:3001
      TEST_WITH_DB: "true"
      OOD_SHARD_INDEX: ${{ matrix.shard }}
      OOD_SHARD_TOTAL: 2
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: opsiq_test }
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 10s
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: npm }
      - name: Install dependencies (bounded retry on transient npm failure)
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i/3); retrying in $((i*10))s..."
            sleep $((i*10))
          done
      - name: Configure .env.local
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          AUTH_SECRET=e2e-test-auth-secret-not-a-real-secret
          AUTH_URL=http://localhost:3001
          NEXT_PUBLIC_APP_URL=http://localhost:3001
          TEST_WITH_DB=true
          EOF
      - name: Prisma migrate + generate
        run: |
          npx prisma migrate deploy
          npx prisma generate
      - name: Build app
        run: npm run build
        env:
          # CI-only heap bump. `next build`'s TypeScript/codegen pass intermittently
          # hits the default ~2 GB limit on these browser packs (FATAL: heap out of
          # memory / SIGABRT). Mirrors the required build-and-test lane (ci.yml).
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Install Playwright Chromium
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            echo "playwright install failed (attempt $i/3); retrying in $((i*15))s..."
            sleep $((i*15))
          done
      - name: Seed all 110 OOD businesses
        run: npx tsx scripts/seed-ood-e2e.ts
      - name: Start app
        run: |
          PORT=3001 npm run start > /tmp/app.log 2>&1 &
          up=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login || echo 000)
            if [ "$code" != "000" ]; then echo "app up (HTTP $code)"; up=1; break; fi
            sleep 2
          done
          if [ "$up" != "1" ]; then
            echo "::error::APP_START_FAILED — app did not respond on :3001 within 120s (build/start collapse, not a test failure). Dumping /tmp/app.log:"
            cat /tmp/app.log || true
            exit 1
          fi
      - name: OOD desktop shard ${{ matrix.shard }}/2
        run: npx playwright test tests/browser/23-ood-desktop.spec.ts --project=chromium
      - name: OOD mobile shard ${{ matrix.shard }}/2
        run: npx playwright test tests/browser/24-ood-mobile.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ood-browser-shard-${{ matrix.shard }}
          path: "OPSIQ_UNKNOWN_OOD_*.run.json"
          retention-days: 7
