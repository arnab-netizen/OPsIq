name: Provision GSC ingestion credential

# Manual trigger only. Provisions the dedicated, least-privilege Postgres role `opsiq_gsc_ingestion`
# (SELECT/INSERT/UPDATE on public.search_console_metrics only) and hands back ONLY a libsodium sealed-box
# ciphertext of its connection string, encrypted to the exact `gsc-ingestion` environment public key.
# It accepts NO SQL from any input and performs no migration, deployment or other production operation.
# Runbook, threat assessment and recovery: docs/opsiq/ci/GSC_INGESTION_CREDENTIAL_PROVISIONING.md
#
# Modes (each a separate, separately approved dispatch in the protected `production-operator` environment):
#   DRY_RUN          read-only and FAIL-CLOSED: exit 0 only for CREATE_READY / ACTIVATE_READY / RECOVER_CANDIDATE / HEALTHY_ACTIVE.
#   CREATE           role absent -> create NOLOGIN, grant, audit, seal to the PINNED environment key. Leaves the role NOLOGIN.
#   RECOVER_NOLOGIN  role present, NOLOGIN, audited -> fresh password, new generation, re-seal (never resets a LOGIN role).
#   ACTIVATE         bound to the CREATE/RECOVER run id + artifact digest + commit; LOGIN is enabled and audited in ONE
#                    transaction and committed only if the audit passes; an interrupted run is reconciled, never assumed safe.
#   DEACTIVATE       explicit compensating step (LOGIN -> NOLOGIN), e.g. if the first ingestion credential preflight fails.
#
# Modeled on provision-administration-operator.yml: origin guard first, exact-main-SHA gate, exact-host gate
# before the script, explicit per-mode confirmation phrase, every ${{ }} value passed through env (never
# interpolated into a script), minimal permissions, strict timeout, immutable action SHA pins.
# The generated password is never an input, argument, expression or log line; see the script header.
# There is NO encryption-key input: the recipient key is pinned in scripts/gsc-provision/provision.ts (rotation = reviewed PR).
# Concurrency: joins the existing `migrate-production` group (shared with reconcile-runtime-role.yml) so production-writing
# database operations never overlap.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'DRY_RUN, CREATE, RECOVER_NOLOGIN, ACTIVATE or DEACTIVATE'
        required: true
        default: 'DRY_RUN'
        type: choice
        options:
          - DRY_RUN
          - CREATE
          - RECOVER_NOLOGIN
          - ACTIVATE
          - DEACTIVATE
      confirm:
        description: 'DRY_RUN: any value. Otherwise the exact phrase for the mode (see the runbook).'
        required: true
        type: string
      expected_main_sha:
        description: 'Required. Exact 40-character lowercase hex SHA of main this dispatch is authorized against.'
        required: true
        type: string
      expected_database_host:
        description: 'Required. Exact production DB hostname, bare hostname only.'
        required: true
        type: string
      expected_run_id:
        description: 'ACTIVATE only: the run id of the CREATE or RECOVER_NOLOGIN run whose sealed secret was stored.'
        required: false
        default: ''
        type: string
      expected_artifact_sha256:
        description: 'ACTIVATE only: SEALED_ARTIFACT_SHA256 printed by that run (64 hex).'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  provision:
    name: Provision GSC ingestion credential
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-operator

    steps:
      - name: Assert workflow origin is main (fail-closed)
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch|schedule) ;;
            *) echo "::error::refusing to run: unexpected trigger '${GITHUB_EVENT_NAME}'"; exit 1 ;;
          esac
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::refusing to run: ref is '${GITHUB_REF}', must be refs/heads/main"
            exit 1
          fi
          case "${GITHUB_WORKFLOW_REF}" in
            *"@refs/heads/main") ;;
            *) echo "::error::refusing to run: the workflow definition is not from refs/heads/main"; exit 1 ;;
          esac
          echo "Workflow origin verified: ${GITHUB_WORKFLOW_REF}"

      - name: Checkout main at the dispatched commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out SHA exactly equals expected_main_sha
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          echo "$EXPECTED_MAIN_SHA" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::expected_main_sha must be a 40-char lowercase hex SHA"; exit 1; }
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$CURRENT_SHA" != "$EXPECTED_MAIN_SHA" ]; then
            echo "::error::checked-out SHA does not exactly equal expected_main_sha. Re-authorize against the current SHA."
            exit 1
          fi
          echo "GSC_HEAD_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"
          echo "✓ SHA matches expected_main_sha exactly"

      - name: Validate expected_database_host format (bare hostname only)
        env:
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
        run: |
          node --input-type=module -e "
            const { isValidExpectedHost } = await import(process.cwd() + '/scripts/validate-expected-db-host.mjs');
            const r = isValidExpectedHost(process.env.EXPECTED_DATABASE_HOST);
            if (!r.ok) { console.error('::error::' + r.reason); process.exit(1); }
            console.log('✓ expected_database_host format valid');
          "

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (lockfile-pinned, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Preflight check - OPERATOR_DATABASE_URL secret exists
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::OPERATOR_DATABASE_URL secret is missing or empty"
            exit 1
          fi
          echo "✓ OPERATOR_DATABASE_URL secret is configured"

      - name: Remove local environment files
        run: rm -f .env .env.local .env.production .env.staging .env.postgres .env.local.bak

      - name: Verify exact production database host (workflow-level gate)
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ inputs.expected_database_host }}
        run: node scripts/validate-expected-db-host.mjs

      - name: Run provisioning script (status tokens only; no credential output)
        env:
          DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          GSC_MODE: ${{ inputs.mode }}
          GSC_CONFIRM: ${{ inputs.confirm }}
          GSC_EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          GSC_EXPECTED_HOST: ${{ inputs.expected_database_host }}
          GSC_EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
          GSC_EXPECTED_ARTIFACT_SHA: ${{ inputs.expected_artifact_sha256 }}
          GSC_SEALED_OUT: ${{ runner.temp }}/gsc-credential.sealed.json
        run: node_modules/.bin/tsx scripts/gsc-provision/provision.ts

      # Hand-off of the SEALED ciphertext only (no plaintext exists anywhere). Short retention. This step is part of
      # the reviewed design but its use requires the owner's explicit exception (runbook section 4).
      - name: Upload sealed ciphertext (CREATE and RECOVER_NOLOGIN only)
        if: success() && (inputs.mode == 'CREATE' || inputs.mode == 'RECOVER_NOLOGIN')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gsc-ingestion-credential-sealed-${{ github.run_id }}
          path: ${{ runner.temp }}/gsc-credential.sealed.json
          retention-days: 1
          if-no-files-found: error
          overwrite: false

      - name: Remove sealed file from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/gsc-credential.sealed.json"
