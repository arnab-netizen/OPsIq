name: CI - Build & Test

on:
  push:
    branches: [main, "feature/**", "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      TEST_WITH_DB: "true"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
          POSTGRES_INITDB_ARGS: "-c log_min_messages=warning"
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
        ports:
          - 5432:5432

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Governance compliance scan
        run: npm run governance:scan:strict
        continue-on-error: false

      - name: TypeScript type checking
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Prisma schema validation
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
        continue-on-error: false

      - name: Prisma database migration
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
        continue-on-error: false

      - name: Regenerate Prisma client after migrations
        run: npx prisma generate
        continue-on-error: false

      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
          NODE_ENV: test
        continue-on-error: false

      - name: Run full test suite
        run: |
          set +e
          npm run test:ci 2>&1 | tee build-and-test.log
          GATE_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "## build-and-test diagnostic summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- exit_code: ${GATE_EXIT_CODE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: npm run test:ci" >> "$GITHUB_STEP_SUMMARY"
          echo "- database: postgresql://postgres:postgres@localhost:5432/opsiq_test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -400 build-and-test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          FIRST_ERROR="$(grep -nE 'FAIL|Failed|Error:|AssertionError|Expected|Received|TypeError|ReferenceError|DATABASE_URL|Prisma|vitest|exit code' build-and-test.log | head -1 || true)"
          if [ -n "$FIRST_ERROR" ]; then
            echo "::error title=build-and-test first error::$FIRST_ERROR"
          fi

          exit "$GATE_EXIT_CODE"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opsiq_test
          TEST_WITH_DB: "true"
          NODE_ENV: test
        continue-on-error: false

      - name: Post build-and-test failure to PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logContent = fs.readFileSync('build-and-test.log', 'utf8');
            const lines = logContent.split('\n');

            // Extract first 120 error lines
            const errorLines = lines.filter(l => /FAIL|Failed|Error:|AssertionError|Expected|Received|TypeError|ReferenceError|Prisma|vitest|exit code|Cannot|failed|timeout|DATABASE_URL|TEST_WITH_DB/.test(l)).slice(0, 120);

            // Get final 120 lines
            const finalLines = lines.slice(-120);

            // Build comment
            let comment = `## PR #28 CI Diagnostic — Build/Test Failed\n\n`;
            comment += `**Workflow:** CI - Build & Test\n`;
            comment += `**Job:** build-and-test (20.x)\n`;
            comment += `**Commit:** ${context.payload.pull_request.head.sha.substring(0, 7)}\n`;
            comment += `**Command:** npm run test:ci\n`;
            comment += `**Environment:** TEST_WITH_DB=true, DATABASE_URL configured\n`;
            comment += `**Status:** FAILED\n\n`;

            if (errorLines.length > 0) {
              comment += `**First Error Lines:**\n\`\`\`\n${errorLines.join('\n')}\n\`\`\`\n\n`;
            }

            comment += `**Final 120 Log Lines:**\n\`\`\`\n${finalLines.join('\n')}\n\`\`\`\n\n`;
            comment += `<!-- PR28-CI-BUILD-TEST-DIAGNOSTIC -->`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes('PR28-CI-BUILD-TEST-DIAGNOSTIC'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Upload test logs (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: build-and-test.log
          retention-days: 7

      - name: Upload coverage (if generated)
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      issues: write

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          GATE_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "## lint diagnostic summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- exit_code: ${GATE_EXIT_CODE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: npm run lint" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -400 lint.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          FIRST_ERROR="$(grep -nE 'error|Error|FAIL|Failed|ESLint|lint' lint.log | head -1 || true)"
          if [ -n "$FIRST_ERROR" ]; then
            echo "::error title=lint first error::$FIRST_ERROR"
          fi

          exit "$GATE_EXIT_CODE"
        continue-on-error: false

      - name: Post lint failure to PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logContent = fs.readFileSync('lint.log', 'utf8');
            const lines = logContent.split('\n');

            // Extract first 120 error lines
            const errorLines = lines.filter(l => /error|Error|FAIL|Failed|ESLint|lint|warning|Warning/.test(l)).slice(0, 120);

            // Get final 120 lines
            const finalLines = lines.slice(-120);

            // Build comment
            let comment = `## PR #28 CI Diagnostic — Lint Failed\n\n`;
            comment += `**Workflow:** CI - Build & Test\n`;
            comment += `**Job:** lint (20.x)\n`;
            comment += `**Commit:** ${context.payload.pull_request.head.sha.substring(0, 7)}\n`;
            comment += `**Command:** npm run lint\n`;
            comment += `**Status:** FAILED\n\n`;

            if (errorLines.length > 0) {
              comment += `**First Error Lines:**\n\`\`\`\n${errorLines.join('\n')}\n\`\`\`\n\n`;
            }

            comment += `**Final 120 Log Lines:**\n\`\`\`\n${finalLines.join('\n')}\n\`\`\`\n\n`;
            comment += `<!-- PR28-CI-LINT-DIAGNOSTIC -->`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes('PR28-CI-LINT-DIAGNOSTIC'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Upload lint logs (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs
          path: lint.log
          retention-days: 7

  branch-protection:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - name: PR check passed
        run: echo "All required checks passed"
