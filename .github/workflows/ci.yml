name: CI - Build & Test

# PR gate only — runs on pull_request to main.
# Push to main is handled by main-integration.yml (full DB suite).
# Scenario packs and browser proof are dispatch-only (deep-proof.yml).
# Target: <15 runner-minutes per PR, zero postgres service, zero browser shards.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # 30 = the non-DB test step's 26-minute cap plus ~2 min of job overhead
    # (install, governance scans, tsc, prisma validate, ratchets) plus buffer.
    # Also reconciles this workflow with the value already asserted by
    # src/__tests__/ci-cd/workflow-validation.test.ts ("reasonable timeout (30 minutes)").
    timeout-minutes: 30

    env:
      TEST_WITH_DB: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
      SKIP_ENV_VALIDATION: "true"

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i); retrying in $((i*10))s..."
            sleep $((i*10))
          done

      - name: Governance compliance scan
        run: npm run governance:scan:strict
        continue-on-error: false

      - name: Auth route governance scan (blocking)
        run: npm run governance:scan:auth
        continue-on-error: false

      - name: A7.7 recurrence prevention gates (blocking)
        run: npm run governance:scan:a77
        continue-on-error: false

      - name: TypeScript type checking
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Prisma schema validation
        # prisma validate checks schema syntax only — no DB connectivity required.
        run: npx prisma validate
        continue-on-error: false

      - name: Wrapped handlers ratchet (prevent new violations)
        run: npm run audit:wrapped-handlers:ratchet
        continue-on-error: false

      - name: CI workflow governance check (prevent trigger regressions)
        run: node scripts/ci-governance-check.mjs
        continue-on-error: false

      - name: Run non-DB test suite (blocking; DB tests and quarantine excluded)
        # DB tests self-skip when TEST_WITH_DB != 'true', but we also explicitly
        # exclude *.db.test.ts files so the intent is unambiguous.
        # Full DB suite runs on push-to-main in main-integration.yml.
        #
        # 26, not 20. Measured over the 15 most recent successful runs (2026-07-28
        # to 2026-08-01) this step took: median 1164s, p90 1189s, p95 1196s,
        # max 1198s — against a 1200s cap. That is 4 seconds of headroom at p95,
        # and 9 of those 15 runs finished within 60s of being killed. PR #273
        # (a two-file .claude/ state-record change that no test reads) was failed
        # by this cap, then passed unchanged on re-run in 899s.
        #
        # The suite is also growing: 725-1070s on 07-28/29 versus 1156-1198s on
        # 07-31/08-01. 26 min = p95 + ~30% headroom. It buys margin, it does not
        # make the growth safe — see the sharding note in the PR description.
        timeout-minutes: 26
        run: |
          EXCLUDES=$(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.files.map(f=>'--exclude '+f.path).join(' '))")
          echo "Quarantined (excluded from blocking lane): $(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.total_files)") file(s)"
          npx vitest run --maxWorkers 1 --exclude '**/*.db.test.ts' $EXCLUDES
        env:
          TEST_WITH_DB: "false"
          NODE_ENV: test
        continue-on-error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i); retrying in $((i*10))s..."
            sleep $((i*10))
          done

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Lint ratchet (block new lint debt)
        run: npm run lint:ratchet
        continue-on-error: false

  # Calls the reusable PR validation workflow with bundle manifest validation enabled.
  # This proves the reusable_ci_workflow component is wired into the PR gate.
  bundle-validate:
    uses: ./.github/workflows/reusable-pr-validation.yml
    with:
      node_version: '20.x'
      run_bundle_validator: true
      run_recurrence_scanners: true

  branch-protection:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, bundle-validate]
    steps:
      - name: PR check passed
        run: echo "All required checks passed"
