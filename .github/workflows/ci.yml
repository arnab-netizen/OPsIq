name: CI - Build & Test

# PR gate only — runs on pull_request to main.
# Push to main is handled by main-integration.yml (full DB suite).
# Scenario packs and browser proof are dispatch-only (deep-proof.yml).
# Target: <15 runner-minutes per PR, zero postgres service, zero browser shards.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Must stay strictly greater than the non-DB suite step cap below plus setup.
    # A step timeout is only reachable if the job outlives it: with a 25-minute job
    # cap, raising the step to 30 would change nothing, because the job would be
    # killed at 25 first and the step would never report its own timeout.
    # Observed: setup through step start costs ~2 minutes, so 40 leaves real room.
    timeout-minutes: 40

    env:
      TEST_WITH_DB: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
      SKIP_ENV_VALIDATION: "true"

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i); retrying in $((i*10))s..."
            sleep $((i*10))
          done

      - name: Governance compliance scan
        run: npm run governance:scan:strict
        continue-on-error: false

      - name: Auth route governance scan (blocking)
        run: npm run governance:scan:auth
        continue-on-error: false

      - name: A7.7 recurrence prevention gates (blocking)
        run: npm run governance:scan:a77
        continue-on-error: false

      - name: TypeScript type checking
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Prisma schema validation
        # prisma validate checks schema syntax only — no DB connectivity required.
        run: npx prisma validate
        continue-on-error: false

      - name: Wrapped handlers ratchet (prevent new violations)
        run: npm run audit:wrapped-handlers:ratchet
        continue-on-error: false

      - name: CI workflow governance check (prevent trigger regressions)
        run: node scripts/ci-governance-check.mjs
        continue-on-error: false

      - name: Run non-DB test suite (blocking; DB tests and quarantine excluded)
        # DB tests self-skip when TEST_WITH_DB != 'true', but we also explicitly
        # exclude *.db.test.ts files so the intent is unambiguous.
        # Full DB suite runs on push-to-main in main-integration.yml.
        #
        # ─── Why 30 and not 20 ────────────────────────────────────────────────
        # NON_DB_SUITE_TIMEOUT_HEADROOM_EXHAUSTED. The suite grew to ~28,460 tests
        # across 1,009 files while this cap stayed at 20 minutes. Two consecutive
        # runs of the identical commit (30845807196 attempts 1 and 2) were killed
        # here with ZERO test failures — every file passed both times.
        #
        # The second attempt is the instructive one: vitest self-reported 1199.66s,
        # inside the 1200s cap, and the step was killed anyway. This cap also covers
        # the quarantine-list `node -e` prelude, npx startup and reporter teardown,
        # which that figure excludes — so the budget actually available to the suite
        # was already negative, not merely thin. Recent margins: +23.5s, +27.1s,
        # -7.1s, then a kill at nominal -0.0s. Run-to-run variance is ~30s.
        #
        # This restores operational headroom. It does NOT fix the underlying cost:
        # ~63% of the runtime (760s of 1207s) is test-environment instantiation, not
        # test execution. Splitting the suite, reducing jsdom setup, separating
        # Node-only from browser-environment tests, sharding, and safe environment
        # reuse are tracked as a separate deferred package — see
        # docs/opsiq/ci/NON_DB_SUITE_CAPACITY.md.
        #
        # Nothing about what is asserted changed. Same command, same selection, same
        # blocking behaviour, same exit-code handling. The tests were already passing;
        # they were being denied the time to say so.
        timeout-minutes: 30
        run: |
          EXCLUDES=$(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.files.map(f=>'--exclude '+f.path).join(' '))")
          echo "Quarantined (excluded from blocking lane): $(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.total_files)") file(s)"
          npx vitest run --maxWorkers 1 --exclude '**/*.db.test.ts' $EXCLUDES
        env:
          TEST_WITH_DB: "false"
          NODE_ENV: test
        continue-on-error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i); retrying in $((i*10))s..."
            sleep $((i*10))
          done

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Lint ratchet (block new lint debt)
        run: npm run lint:ratchet
        continue-on-error: false

  # Calls the reusable PR validation workflow with bundle manifest validation enabled.
  # This proves the reusable_ci_workflow component is wired into the PR gate.
  bundle-validate:
    uses: ./.github/workflows/reusable-pr-validation.yml
    with:
      node_version: '20.x'
      run_bundle_validator: true
      run_recurrence_scanners: true

  branch-protection:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, bundle-validate]
    steps:
      - name: PR check passed
        run: echo "All required checks passed"
