name: CI - Build & Test

on:
  push:
    branches: [main, "feature/**", "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      SKIP_ENV_VALIDATION: "true"

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print diagnostic environment
        run: |
          echo "=== Node/npm versions ==="
          node --version
          npm --version
          echo ""
          echo "=== Environment ==="
          echo "DATABASE_URL present: $([ -z "$DATABASE_URL" ] && echo false || echo true)"
          echo "DIRECT_DATABASE_URL present: $([ -z "$DIRECT_DATABASE_URL" ] && echo false || echo true)"
          echo "TEST_WITH_DB: ${TEST_WITH_DB:-unset}"
          echo "CI: ${CI:-unset}"
          echo "NODE_ENV: ${NODE_ENV:-unset}"
          echo "SKIP_ENV_VALIDATION: ${SKIP_ENV_VALIDATION:-unset}"

      - name: Governance compliance scan
        run: npm run governance:scan:strict
        continue-on-error: false

      - name: Run full test suite with build
        run: npm run test:ci 2>&1 | tee test-ci-output.log
        continue-on-error: false

      - name: Print test:ci output on failure
        if: failure()
        run: |
          echo "=== Last 300 lines of test:ci output ==="
          tail -300 test-ci-output.log || true

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-ci-diagnostics-${{ matrix.node-version }}
          path: test-ci-output.log
          if-no-files-found: ignore

      - name: Upload coverage (if generated)
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint ratchet (block new lint debt)
        run: npm run lint:ratchet
        continue-on-error: false

  branch-protection:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - name: PR check passed
        run: echo "All required checks passed"
