name: CI - Build & Test

# PR gate only — runs on pull_request to main. The one required merge gate
# (branch-protection) for PRs to main.
#
# CI-MIN-01: main-integration.yml no longer auto-runs on push to main (kept
# workflow_dispatch-only, for disaster-recovery / release re-verification).
# DB-risk changes get their DB validation pre-merge instead, via THIS
# workflow's own `db-verify` job (gated on the classifier's `db_required`
# output) -- db-verification.yml's separate pull_request trigger was removed
# (owner correction, CI-MIN-01 items 1-3): branch-protection is the only
# required GitHub status check on main, so a separate workflow's own passing
# check was never actually a merge gate. A normal merge to main does not
# re-run an already-passed PR's suite.
# Scenario packs and browser proof are dispatch-only (deep-proof.yml).
# Target: <15 runner-minutes per PR, zero postgres service, zero browser shards.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ROOT-CAUSE FIX (2026-08-29): main-integration.yml previously ran its full
  # DB suite unconditionally on every push to main -- confirmed directly on
  # a real merge (PR #373, a 1-line whitespace fix to one workflow file)
  # costing 2595s (~43 min) of full-DB-suite runtime for a change with zero
  # DB/schema/runtime impact. This classifier is the "cheap always-running
  # classifier" step that determines actual risk from the changed-file list
  # so downstream jobs (this workflow's own non-DB suite, and
  # main-integration.yml's DB suite) can scale their validation to that
  # risk instead of always running everything. Highest-risk-touched-path
  # wins; anything unrecognized classifies as UNKNOWN, the same maximum
  # tier as explicitly risky files (package.json, tsconfig, etc.) --
  # ambiguous is never treated as cheap. See scripts/ci-risk-classifier.mjs
  # for the full rule set and its hostile-audit test coverage.
  classify:
    name: Classify change risk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      risk_class: ${{ steps.classify.outputs.risk_class }}
      run_non_db_suite: ${{ steps.classify.outputs.run_non_db_suite }}
      suite_mode: ${{ steps.classify.outputs.suite_mode }}
      # CI-MIN-01 owner correction: the single authoritative DB-risk signal.
      # Drives the db-verify job below directly -- no second, separate
      # static path-filter system decides DB risk anywhere in this repo's
      # required PR gate.
      db_required: ${{ steps.classify.outputs.db_required }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Determine changed files and classify risk
        id: classify
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed_files.txt
          echo "Changed files in this PR:"
          cat /tmp/changed_files.txt
          # --base/--head (CI-MIN-01): lets the classifier read package.json's
          # OWN diff text so a scripts-only edit doesn't get the same UNKNOWN
          # tier as a real dependency change -- see
          # scripts/ci-risk-classifier.mjs's classifyPackageJsonDiffText.
          node scripts/ci-risk-classifier.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            < /tmp/changed_files.txt >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: classify
    runs-on: ubuntu-latest
    # Must stay strictly greater than the non-DB suite step cap below plus setup.
    # A step timeout is only reachable if the job outlives it: with a 25-minute job
    # cap, raising the step to 30 would change nothing, because the job would be
    # killed at 25 first and the step would never report its own timeout.
    # Observed: setup through step start costs ~2 minutes, so 40 leaves real room.
    timeout-minutes: 40

    env:
      TEST_WITH_DB: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
      SKIP_ENV_VALIDATION: "true"

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # CI-MIN-01: every step from here through "Production build" is skipped
      # for a DOCS_ONLY change (docs/*.md-only PRs pay for nothing but
      # checkout + Node setup), and the app-specific steps (everything except
      # "CI workflow governance check") are ALSO skipped for a pure
      # CI_GOVERNANCE change (workflow YAML / named CI scripts only) --
      # owner correction: a full-repo ESLint traversal is not "genuinely
      # relevant cheap validation" for a workflow-only change either, so
      # "Run linter"/"Lint ratchet" are skipped for CI_GOVERNANCE too now.
      # What CI_GOVERNANCE actually gets instead: actionlint (below, gated on
      # whether workflow YAML changed), the CI workflow governance check, and
      # the TARGETED_CI_GOVERNANCE suite step's own classifier/CI-trigger
      # tests plus a syntax check on any changed CI script. If application
      # source were touched, the path would already classify at a higher
      # tier via max-wins, so a genuine
      # CI_GOVERNANCE-tier PR by definition has none of these steps' targets
      # in its diff. A step skipped by its own `if:` does not change the
      # job's own success/failure result, so branch-protection's per-job
      # `.result` check is unaffected either way.
      - name: Install dependencies
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY'
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i); retrying in $((i*10))s..."
            sleep $((i*10))
          done

      # governance:scan:a77 shells out to the `rg` binary and was silently
      # reporting every gate as PASS on runners that don't have it (ubuntu-latest
      # does not ship ripgrep by default) -- a spawn failure was indistinguishable
      # from "0 matches found". The script now fails loudly instead of silently
      # passing (see scripts/a77-prevention-gates.ts's assertRgAvailable), so this
      # step is required for that gate to run at all, not just to run correctly.
      - name: Install ripgrep (required by governance:scan:a77)
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Governance compliance scan
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: npm run governance:scan:strict
        continue-on-error: false

      - name: Auth route governance scan (blocking)
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: npm run governance:scan:auth
        continue-on-error: false

      - name: A7.7 recurrence prevention gates (blocking)
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: npm run governance:scan:a77
        continue-on-error: false

      - name: TypeScript type checking
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Prisma schema validation
        # prisma validate checks schema syntax only — no DB connectivity required.
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: npx prisma validate
        continue-on-error: false

      - name: Owner feature-preservation gate (UX-00B)
        # Compares a freshly generated candidate inventory against the accepted
        # docs/opsiq/ux/OWNER_FEATURE_PRESERVATION_BASELINE.json — blocks any PR that silently
        # drops an owner page/API/method/page-API-dependency, narrows or broadens a capability
        # (method-specific or whole-route), exposes a hidden-for-safety route, or loses an
        # OwnerNowView field, owner action, workflow state, or Cockpit-consumed field. The
        # verifier's own synthetic regression-detection tests run first (Node's built-in test
        # runner, no extra dependency) so a defect in the gate itself is caught before it can
        # silently stop blocking anything; then the real verifier runs against current source.
        # Pure Node, no DB/build required. See scripts/ux/verify-owner-feature-preservation.mjs
        # and docs/opsiq/ux/PRESERVATION_CHANGE_PROCESS.md for how an intentional change is
        # approved.
        #
        # CI-MIN-01: calls the two commands directly instead of through the
        # `verify:owner-preservation` package.json alias -- that alias existed
        # solely for this one CI call site, so it was removed rather than kept
        # as an indirection with a single caller.
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: |
          node --test scripts/ux/__tests__/verify-owner-feature-preservation.test.mjs
          node scripts/ux/verify-owner-feature-preservation.mjs
        continue-on-error: false

      - name: Wrapped handlers ratchet (prevent new violations)
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: npm run audit:wrapped-handlers:ratchet
        continue-on-error: false

      - name: CI workflow governance check (prevent trigger regressions)
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY'
        run: node scripts/ci-governance-check.mjs
        continue-on-error: false

      # CI-MIN-01 ROOT-CAUSE FIX: these three steps and the two lint steps
      # below previously ran in SEPARATE jobs (bundle-validate, calling
      # reusable-pr-validation.yml; lint) that each paid for their OWN
      # `npm ci` and, for bundle-validate, its own duplicate governance
      # scans/tsc/prisma-validate -- on every single PR, unconditionally.
      # Moved into this job so "npm deps installed once" (the target
      # architecture's own words) is actually true. reusable-pr-validation.yml
      # itself is left in place (still valid on its own, still workflow_call
      # only per ci-governance-check.mjs rule 7) but is no longer called here.
      - name: Recurrence defect scanners
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: node scripts/scan-recurrence-defects.mjs
        continue-on-error: false

      - name: Bundle manifest validator (evidence and closure conditions)
        # The only gate that reads every manifest in docs/opsiq/bundles/, including the
        # invariant block of stage-closure contracts.
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: node scripts/validate-bundle-manifests.mjs
        continue-on-error: false

      # Default mode: blocks on REJECTED artifacts only, so a malformed or forged
      # artifact fails on the PR that introduces it. Signature and provenance are not
      # checked here — the PR gate holds no signing key, and a gate that cannot check
      # provenance must never report it as verified. A closure gate runs the same
      # validator with --require-accepted --require-provenance.
      - name: Stage 7 evidence artifact validator
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: node scripts/validate-evidence-artifacts.mjs
        continue-on-error: false

      # ── One ESLint traversal per job ──────────────────────────────────────
      # This step used to run in its own `lint` job with its own checkout +
      # `npm ci` -- a second full dependency install paid on every PR solely
      # so lint could run once. ESLint runs once here, to a JSON report the
      # ratchet consumes. continue-on-error stays because ESLint exits 1 while
      # the baseline error count is non-zero; the ratchet, not this step, is
      # what decides the job.
      #
      # CI-MIN-01 owner correction: skipped for CI_GOVERNANCE too, not just
      # DOCS_ONLY -- a full-repo ESLint traversal is not "genuinely relevant
      # cheap validation" for a workflow-YAML/named-CI-script-only change.
      - name: Run linter (single traversal -> JSON report)
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: npm run lint -- -f json -o eslint-report.json
        continue-on-error: true

      - name: Lint ratchet (block new lint debt)
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: npm run lint:ratchet -- --from-result eslint-report.json
        continue-on-error: false

      # CI-MIN-01: `npm run build` was not invoked anywhere in the PR gate --
      # a PR could reach merge with passing types/tests but a broken Next.js
      # build. Skipped for DOCS_ONLY/CI_GOVERNANCE, the same tiers with
      # nothing under src/** or the build config in their diff to break.
      - name: Production build
        if: needs.classify.outputs.risk_class != 'DOCS_ONLY' && needs.classify.outputs.risk_class != 'CI_GOVERNANCE'
        run: npm run build
        continue-on-error: false

      - name: Run targeted recovery validation (RECOVERY_INFRA_ONLY tier; no broad suite)
        if: needs.classify.outputs.suite_mode == 'TARGETED_RECOVERY'
        # ROOT-CAUSE FIX (owner correction pass, 2026-08-29, Issue 2): the
        # first version of this classifier gave RECOVERY_INFRA_ONLY the same
        # ~28,000-test broad suite as every other non-DOCS_ONLY tier,
        # defeating the entire point of a recovery-only tier -- that suite is
        # not materially relevant to a backup/restore-workflow-only change.
        # This runs only the recovery-specific test files, the classifier's
        # own tests (which this tier's changes can themselves break), and a
        # shell-syntax check on any changed .sh scripts. Proven never to run
        # the broad suite by src/__tests__/workflows/ci-risk-classifier.test.ts.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npx vitest run --maxWorkers 1 \
            src/__tests__/scripts/backup-restore.test.ts \
            src/__tests__/workflows/ci-risk-classifier.test.ts
          CHANGED_SH=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*.sh' || true)
          if [ -n "$CHANGED_SH" ]; then
            echo "Shell syntax check (bash -n) on changed scripts:"
            echo "$CHANGED_SH"
            echo "$CHANGED_SH" | xargs -r -n1 bash -n
          else
            echo "No changed .sh scripts in this PR."
          fi
        env:
          TEST_WITH_DB: "false"
          NODE_ENV: test

      - name: Run targeted CI-governance validation (CI_GOVERNANCE tier; no broad suite)
        if: needs.classify.outputs.suite_mode == 'TARGETED_CI_GOVERNANCE'
        # CI-MIN-01 owner correction: a change confined to workflow YAML /
        # named CI scripts (no application source touched -- see
        # scripts/ci-risk-classifier.mjs's CI_GOVERNANCE tier) cannot affect
        # the ~28,000-test broad application suite, or need a full-repo
        # ESLint traversal, so this tier gets neither (see the lint steps'
        # own `if:` below). What it DOES get: actionlint (already
        # unconditionally wired below, gated on whether workflow YAML
        # changed), the CI workflow governance check (above), the
        # classifier's own regression tests, the CI-trigger-governance
        # structural tests, and a syntax check on any changed CI script.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npx vitest run --maxWorkers 1 \
            src/__tests__/workflows/ci-risk-classifier.test.ts \
            src/__tests__/ci-cd/ci-trigger-governance.test.ts
          CHANGED_SCRIPTS=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'scripts/*.mjs' 'scripts/*.js' 'scripts/*.cjs' || true)
          if [ -n "$CHANGED_SCRIPTS" ]; then
            echo "Syntax check (node --check) on changed CI scripts:"
            echo "$CHANGED_SCRIPTS"
            echo "$CHANGED_SCRIPTS" | xargs -r -n1 node --check
          else
            echo "No changed CI scripts in this PR."
          fi
        env:
          TEST_WITH_DB: "false"
          NODE_ENV: test

      - name: Run non-DB test suite (blocking; DB tests and quarantine excluded)
        if: needs.classify.outputs.suite_mode == 'BROAD_NON_DB'
        # DB tests self-skip when TEST_WITH_DB != 'true', but we also explicitly
        # exclude *.db.test.ts files so the intent is unambiguous.
        # Full DB suite runs on push-to-main in main-integration.yml.
        # Skipped entirely for a DOCS_ONLY change (see the classify job
        # above) -- a change with zero executable content cannot fail this
        # suite, and running it anyway would be exactly the "pointless CI"
        # this classifier exists to eliminate. RECOVERY_INFRA_ONLY gets its
        # own targeted step above instead of this one (owner correction pass,
        # 2026-08-29, Issue 2).
        #
        # ─── Why 30 and not 20 ────────────────────────────────────────────────
        # NON_DB_SUITE_TIMEOUT_HEADROOM_EXHAUSTED. The suite grew to ~28,460 tests
        # across 1,009 files while this cap stayed at 20 minutes. Two consecutive
        # runs of the identical commit (30845807196 attempts 1 and 2) were killed
        # here with ZERO test failures — every file passed both times.
        #
        # The second attempt is the instructive one: vitest self-reported 1199.66s,
        # inside the 1200s cap, and the step was killed anyway. This cap also covers
        # the quarantine-list `node -e` prelude, npx startup and reporter teardown,
        # which that figure excludes — so the budget actually available to the suite
        # was already negative, not merely thin. Recent margins: +23.5s, +27.1s,
        # -7.1s, then a kill at nominal -0.0s. Run-to-run variance is ~30s.
        #
        # This restores operational headroom. It does NOT fix the underlying cost:
        # ~63% of the runtime (760s of 1207s) is test-environment instantiation, not
        # test execution. Splitting the suite, reducing jsdom setup, separating
        # Node-only from browser-environment tests, sharding, and safe environment
        # reuse are tracked as a separate deferred package — see
        # docs/opsiq/ci/NON_DB_SUITE_CAPACITY.md.
        #
        # Nothing about what is asserted changed. Same command, same selection, same
        # blocking behaviour, same exit-code handling. The tests were already passing;
        # they were being denied the time to say so.
        timeout-minutes: 30
        run: |
          EXCLUDES=$(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.files.map(f=>'--exclude '+f.path).join(' '))")
          echo "Quarantined (excluded from blocking lane): $(node -e "const q=require('./.claude/test-quarantine.json'); console.log(q.total_files)") file(s)"
          npx vitest run --maxWorkers 1 --exclude '**/*.db.test.ts' $EXCLUDES
        env:
          TEST_WITH_DB: "false"
          NODE_ENV: test
        continue-on-error: false

  # CI-MIN-01 owner correction: DB validation now runs INSIDE ci.yml (the
  # one required PR gate) instead of db-verification.yml's own pull_request
  # trigger -- branch-protection is the ONLY required GitHub status context
  # on main (confirmed via the repo's branch ruleset), so a separate
  # workflow's own passing check was never actually a merge gate; a DB-risk
  # PR could merge with a red or entirely-absent db-verification.yml run.
  # Gated on the classifier's own `db_required` output -- ONE classifier is
  # authoritative for DB risk (DB_RUNTIME or UNKNOWN tier: prisma
  # schema/migrations, any `*.db.test.ts` file anywhere, DB-interacting
  # scripts, or a DB-related package.json/package-lock.json dependency
  # change -- see classifyPackageJsonDiffText/classifyPackageLockDiffText).
  # db-verification.yml's pull_request trigger is removed; it is
  # workflow_dispatch-only now, for explicit Neon/throwaway-Postgres
  # re-verification, never a second source of truth for DB risk.
  #
  # Deliberately minimal: build-and-test already proved tsc, the production
  # build, lint, the owner-preservation gate, and the broad non-DB suite on
  # this exact PR -- this job's only job is the DB-dependent behavior those
  # runs skip (DB tests self-skip without TEST_WITH_DB=true, and are also
  # explicitly excluded by path in build-and-test's broad-suite step).
  db-verify:
    name: 'DB Verification (throwaway Postgres)'
    needs: classify
    if: needs.classify.outputs.db_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsiq_test
        options: >-
          --health-cmd "pg_isready -U postgres -d opsiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
      TEST_WITH_DB: 'true'
      NODE_ENV: test
      SKIP_ENV_VALIDATION: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci failed (attempt $i); retrying in $((i*10))s..."
            sleep $((i*10))
          done

      - name: Verify rolldown native binding
        run: node -e "require.resolve('@rolldown/binding-linux-x64-gnu'); console.log('✓ rolldown binding present')"

      - name: Configure local test environment
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          MIGRATION_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/opsiq_test?schema=public
          NODE_ENV=test
          SKIP_ENV_VALIDATION=true
          EOF

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      # MIGRATION_DATABASE_URL is the local throwaway container -- safe to
      # deploy. migrate reset and db push are never run here.
      - name: Prisma migrate deploy (throwaway container)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}

      - name: Run DB test suite (*.db.test.ts only)
        run: npm test -- '.db.test.ts' --maxWorkers=1
        continue-on-error: false

  # Root cause: PR #332 merged a workflow file with a YAML syntax error (a
  # single-line `run:` value containing an unquoted colon) that no existing
  # check caught -- governance tests in this repo assert string content via
  # readFileSync/indexOf, they never parse the YAML, so a file can pass every
  # string check while still being unparseable by GitHub Actions itself.
  # GitHub's own behavior on such a file is silent and easy to miss: the
  # workflow still registers (state: active) via a lenient pre-scan, but
  # falls back to the raw file path as its display name (the declared
  # `name:` key can never be extracted), never appears under its intended
  # name in the Actions sidebar, and its direct /actions/workflows/<file>.yml
  # URL 404s. Scoped to changed files only (a repo-wide actionlint run
  # surfaced pre-existing, unrelated findings in several older workflows
  # this fix does not touch).
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate changed workflow YAML with actionlint
        run: |
          set -euo pipefail
          git fetch origin main --depth=50 2>/dev/null || true
          CHANGED=$(git diff --name-only origin/main...HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml' || true)
          if [ -z "$CHANGED" ]; then
            echo "No workflow files changed in this PR -- skipping actionlint."
            exit 0
          fi
          echo "Changed workflow files:"
          echo "$CHANGED"
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          echo "$CHANGED" | xargs ./actionlint

  # HOSTILE-AUDIT FIX (owner correction pass, 2026-08-29, Issue 9; semantics
  # corrected 2026-08-29): this job had `needs: [...]` but a plain
  # `if: github.event_name == 'pull_request'` with no success()/`.result`
  # check present in the expression.
  #
  # Precise mechanism (corrected -- an earlier version of this comment
  # mischaracterized it as the custom `if:` "replacing" the success gate,
  # which is not how GitHub Actions actually behaves): GitHub Actions
  # applies an IMPLICIT `&& success()` to a job's `if:` condition whenever
  # that condition does not itself reference one of the status-check
  # functions (`success()`, `always()`, `cancelled()`, `failure()`). The old
  # condition here referenced none, so it was actually evaluated as
  # `success() && github.event_name == 'pull_request'` -- meaning that if
  # build-and-test or actionlint FAILED, this job's
  # effective condition was false and the job was SKIPPED, not executed.
  # The defect is what GitHub does with that skip: a SKIPPED job/check is
  # reported to the checks API as a passing (non-blocking) conclusion, and
  # GitHub's required-status-checks branch protection treats a skipped
  # required check as satisfying "required to pass." So the one required PR
  # gate still reported green after a real upstream failure -- via a skip
  # being treated as success, not via this job's body actually executing
  # despite failure.
  #
  # `if: ${{ always() && github.event_name == 'pull_request' }}` forces this
  # job to always run to a terminal state instead of being skipped, and the
  # step below explicitly inspects every direct dependency's `.result` and
  # fails closed on anything other than literally "success" (covering
  # failure, cancelled, and skipped uniformly). This closes all three
  # failure modes the owner named: never silently skipped (always()
  # guarantees the job body executes), never permanently pending (it always
  # reaches a terminal pass/fail), and never falsely green (any non-success
  # dependency result fails this job, and a job that actually FAILS -- as
  # opposed to being skipped -- is what correctly blocks merge). Same idiom
  # already used in main-integration.yml's `summary` job. Regression-tested
  # by executing this exact step's script against all 9 named scenarios in
  # src/__tests__/ci-cd/ci-trigger-governance.test.ts.
  #
  # CI-MIN-01 owner correction (item 1): db-verify is CONDITIONALLY skipped
  # (db_required=false) by design -- a plain "must be success" check like
  # the loop above would wrongly fail the gate on every PR that doesn't
  # need DB validation. db-verify gets its own explicit rule instead: when
  # db_required=true it must be literally "success" (skipped, failed, and
  # cancelled all fail closed exactly like every other required job);
  # when db_required=false, "skipped" is the expected, correct outcome and
  # passes, but a "failure" or "cancelled" (which should be impossible given
  # the job's own `if:` gate, but is checked defensively) still fails
  # closed. This is the ONLY required job allowed a non-"success" passing
  # result, and only for this one classifier-driven reason.
  branch-protection:
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [classify, build-and-test, actionlint, db-verify]
    steps:
      - name: Verify all required jobs succeeded (fail closed)
        run: |
          set -euo pipefail
          FAILED=0
          for entry in \
            "classify:${{ needs.classify.result }}" \
            "build-and-test:${{ needs.build-and-test.result }}" \
            "actionlint:${{ needs.actionlint.result }}"; do
            name="${entry%%:*}"
            status="${entry#*:}"
            echo "$name -> $status"
            if [ "$status" != "success" ]; then
              echo "::error::Required job '$name' did not succeed (status: $status)"
              FAILED=1
            fi
          done

          DB_REQUIRED="${{ needs.classify.outputs.db_required }}"
          DB_RESULT="${{ needs.db-verify.result }}"
          echo "db-verify -> $DB_RESULT (db_required=$DB_REQUIRED)"
          if [ "$DB_REQUIRED" = "true" ]; then
            if [ "$DB_RESULT" != "success" ]; then
              echo "::error::db-verify was required (db_required=true) but did not succeed (status: $DB_RESULT)"
              FAILED=1
            fi
          else
            if [ "$DB_RESULT" = "failure" ] || [ "$DB_RESULT" = "cancelled" ]; then
              echo "::error::db-verify unexpectedly ${DB_RESULT} despite db_required=false"
              FAILED=1
            fi
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more required checks did not succeed -- branch-protection fails closed."
            exit 1
          fi
          echo "All required checks passed"
