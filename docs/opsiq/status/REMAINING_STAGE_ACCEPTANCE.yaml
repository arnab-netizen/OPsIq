# REMAINING STAGE ACCEPTANCE LEDGER
# Source of truth for bundle and stage completion status.
# Rules enforced by scripts/validate-bundle-manifests.mjs:
#   - CLOSED requires: pr_sha, merge_sha, main_integration_run, db_verification_run (all non-null)
#   - PENDING → CLOSED requires explicit post-merge evidence (no shortcuts)
#   - not_applicable requires written justification
#   - Contradictions between this ledger and bundle YAMLs are a blocking error
#   - artifact_type is REQUIRED on every bundle and component record.
#     Valid values: development_bundle | infrastructure_component
#     development_bundle: a scoped implementation unit within a stage delivery plan
#     infrastructure_component: a completion-factory CI/tooling/harness component
#   NOTE: bundle-4 through bundle-7 are development_bundle, NOT factory product stages.

