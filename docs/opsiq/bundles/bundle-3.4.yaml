description: |
  Full lifecycle for business risk identification, assessment, mitigation tracking,
  and compliance item management. Includes correct FSM semantics (MITIGATING is
  active, not terminal), conditional ACCEPTED resolution, overdue evaluation seam
  wired to owner now-view, and 13 PostgreSQL-backed DB tests.

scope:
