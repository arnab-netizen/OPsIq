  - ACCEPTED resolution conditional on acceptanceRationale (non-empty)
  - MITIGATING is active state — alerts must remain
  - evaluateOverdueRiskAlerts wired fire-and-forget to getOwnerNowView
  - Idempotent critical and overdue alert creation
  - Cross-workspace isolation for alerts

