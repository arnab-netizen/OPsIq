# ─── Authorized evidence subject SHA (owner decision D-16) ───────────────────
# The single commit every Stage 7 evidence artifact must describe. An artifact
# whose subject_sha is any other commit is refused with SUBJECT_SHA_NOT_AUTHORIZED,
# because evidence captured against another commit does not describe this one.
#
# Until this field was set, scripts/lib/evidence-artifact.mjs resolved the policy
# as SUBJECT_SHA_POLICY_MISSING and refused every proof reference. That is the
# fail-closed default: an empty authorization is not permission to use any commit.
#
# This field states which commit evidence may describe. It is NOT closure evidence
# and it proves nothing on its own — required_evidence below remains null, every
# invariant remains PENDING, and Stage 7 remains open.
#
# D-16 supersedes D-15 as the ACTIVE evidence subject authorization. D-15 remains
# historical and is not rewritten: it authorized a19d226d784d4eb48bf239ca5c5320f12efac541
# on 2026-09-02, and amendment A14 below still records it as decided. D-14 and D-13
# likewise remain historical in A13 and A12.
#
# Subject lineage: D-12 (036c5269, PR #285 merge, permanent CI trigger hardening and
# recovery controls) -> D-13 (a2d72660, PR #386 merge, technical pre-beta readiness
# gate: identity email canonicalization, distributed Postgres rate limiting for the
# public identity routes, a login rate-limit info-disclosure fix, production
# health-check observability rewired onto the real Sentry-backed capture path, and an
# A7.7 governance-scan integrity fix) -> D-14 (1fdc3184, PR #394 merge, the first
# subject carrying #391-#394) -> D-15 (a19d226d, PR #396 merge, ANSI-normalised
# observation-validity matching) -> D-16 (789768b9, this decision).
#
# D-13 also resolved the "D-13" naming inconsistency noted during Stage 7
# reconciliation: commit 184d2515 (authored the same day D-12 was decided) left
# forward-reference comments in scripts/lib/evidence-artifact.mjs and
# .github/workflows/stage7-capture.yml naming "D-13" as the next subject-sha
# decision, without an actual D-13 existing in the amendments ladder at that time.
# That label is real and stays real; D-14 now advances past it.
#
# Why the subject had to advance. D-13's subject a2d72660 predates the complete
# Stage 7 capture-path repair set and could not have produced a single verified
# artifact:
#   #391 the LANE_E observation commands invoked vitest's `basic` reporter, removed
#        in vitest 3 — both commands aborted at startup;
#   #392 a runner that never executed was still recorded as an observed FAIL, because
#        a startup error writes to stderr and so satisfies the non-empty observation
#        guard;
#   #393 the same seam remained open for the six Stage 7 node probes, where a
#        module-resolution failure or uncaught exception became an observed FAIL;
#   #394 the capture workflow POSTed the workflow_dispatch envelope to a verifier
#        that declares only repository_dispatch, so the trusted verifier could never
#        be reached and no artifact could ever reach ACCEPTED.
# D-14's subject 1fdc3184 is the merge commit of #394 and contains all four.
# Authorized by the owner on 2026-09-02.
#
# Why the subject had to advance again. The first real S7-I11 capture ran against
# D-14 (workflow run 33633377692) and was REFUSED. The refusal was correct in
# direction but wrong in fact: the observation command executed fully and passed
# 74/74 across 2 files, and the PR #392 execution-validity marker still rejected it,
# because GitHub Actions colourises vitest and the summary line arrived as
#   ESC[2m Test Files ESC[22m ESC[1mESC[32m2 passed ...
# so "Test Files" was followed by an escape sequence rather than the digit the marker
# required. Nothing was fabricated — no artifact, no evidence branch, no evidence PR,
# no repository_dispatch, no verifier run — but every LANE_E capture was blocked.
#
# PR #396 repaired it by matching the validity markers against an ANSI-normalised COPY
# while the artifact continues to consume the raw observation bytes, so the signed
# evidence stays verbatim. D-15's subject a19d226d is the merge commit of #396: the
# first commit carrying the complete known capture-path repair set #391, #392, #393,
# #394 and #396, and the exact SHA production is deployed at.
# Authorized by the owner on 2026-09-02.
#
# Why the subject had to advance a third time. D-15's subject a19d226d predates two
# credential-disclosure repairs on the observation path itself, and evidence captured
# against it would have carried credential material into append-only artifacts:
#   #403 the S7-I4 and S7-I5 probes printed the configured owner email into the raw
#        observation; it is now reported as a `set | not set` boolean;
#   #404 S7-I4 additionally printed the first 8 characters of the LIVE owner session
#        cookie (`sessionToken.slice(0, 8)`) into the raw observation. Everything a
#        probe prints is hashed, signed and committed to the artifacts directory, and
#        artifacts are append-only, so a correction is a new artifact rather than an
#        edit — the disclosure could not have been withdrawn.
# Neither prefix carried proof value: `login_session_cookie_set` already records that
# a cookie was obtained and the flag checks assert its hardening, so no invariant
# assertion depended on either value. The token is still parsed, held and sent on the
# authenticated, logout and revocation requests; only the output is redacted.
#
# D-16's subject 789768b9 is the merge commit of #404: the first commit carrying the
# complete known capture-path repair set #391, #392, #393, #394, #396, #401, #402,
# #403 and #404, and the exact SHA production is deployed at.
# Authorized by the owner on 2026-09-03.
