description: |
  Factory Stage 7 proves that the existing OpsIQ system can be deployed securely
  for its owner, operated without developer assistance, produce correct and
  actionable guidance from real business data, govern approved execution, capture
  outcomes and feedback, recover safely from realistic failures, and be accepted
  for unrestricted private owner use.

  This stage is NOT authorization for: public SaaS launch, public self-registration,
  external paying customers, billing activation, marketing launch, live destructive
  fault injection on production infrastructure, or anonymous public access.

  Billing is explicitly excluded. Stripe live payments, Lemon Squeezy activation,
  and subscription entitlement purchase require separate owner authorization after
  private-owner acceptance is confirmed.

  Resend and external connector proof are conditional on credential availability
  and pilot data-entry materiality. See invariants and exclusions.

evidence_lanes:
  LANE_C:
    description: "Production runtime — a real production environment ran the code and returned correct result"
  LANE_D:
    description: "Live provider — a real external provider processed a real operation"
  LANE_E:
    description: "Simulation — realistic scenario against the real system in an isolated staging workspace"
  LANE_F:
    description: "Real owner pilot — owner completed a real governance cycle using real business data"
  OWNER_ACCEPTANCE:
    description: "Explicit owner judgment — cannot be proven by code, CI, or simulation"

invariants:
  S7-I1:
    name: Exact private deployment identity
    statement: >
      The owner-accessible deployment must identify the exact approved Git commit and
      environment. The deployed SHA must match the authorized deployment candidate.
      The deployment need not permit anonymous public access.
    proof_lane: LANE_C
    proof_type: production_runtime_check
    executable_evidence: "deployed URL responds with 200 to health probe; Vercel or equivalent deployment dashboard shows exact authorized SHA"
    status: PENDING
    proof_artifacts: []

  S7-I2:
    name: Production migration integrity
    statement: >
      All approved migrations must apply cleanly to the designated live or
      production-equivalent database. Migration status must show no unexpected
      pending, failed or drifted migration.
      No destructive production migration may occur without separate owner approval
      and a verified recovery plan.
    proof_lane: LANE_C
    proof_type: production_migration_check
    executable_evidence: "prisma migrate status shows zero pending migrations; schema head confirmed against Prisma client"
    status: PENDING
    proof_artifacts: []

  S7-I3:
    name: Production configuration fail-closed
    statement: >
      Required production configuration must be present and valid. Missing required
      configuration must prevent unsafe operation or produce an explicit not-ready state.
      Optional provider credentials must not block owner use when the corresponding
      feature is disabled or not required by the pilot.
    proof_lane: LANE_C
    proof_type: production_preflight
    executable_evidence: "scripts/deployment-preflight.mjs exits 0 against live environment"
    status: PENDING
    proof_artifacts: []

  S7-I4:
    name: Private owner authentication and workspace binding
    statement: >
      The designated owner must authenticate successfully and be bound to the correct
      private workspace.
      Prove: login, logout, session renewal or expiry, unauthorized-user rejection,
      cross-workspace rejection, and secure production cookie behavior.
      Public self-registration must not be enabled merely to satisfy this invariant.
    proof_lane: LANE_C
    proof_type: production_auth_check
    executable_evidence: "owner login, logout, session expiry, and unauthorized-user rejection all observed on production deployment"
    status: PENDING
    proof_artifacts: []

  S7-I5:
    name: Live tenant and secret boundary
    statement: >
      The owner must not be able to access or infer another workspace's records.
      Secrets, provider tokens, raw internal errors and protected payloads must not
      appear in owner-visible responses, logs, diagnostics or audit events.
    proof_lane: LANE_C
    proof_type: production_boundary_check
    executable_evidence: "cross-workspace rejection confirmed on production; secret values absent from all owner-visible API responses, health output, and audit events"
    status: PENDING
    proof_artifacts: []

  S7-I6:
    name: Real business-state accuracy
    statement: >
      Using real owner-entered business data, OpsIQ must produce a business-condition
      assessment that: is grounded only in supplied or retrieved evidence; identifies
      missing or uncertain data explicitly; does not fabricate facts; populates all
      applicable OpsIQ dimensions (consulting lifecycle stage, business condition,
      intervention mode, intervention phase); and is judged materially accurate by
      the owner.
    proof_lane: LANE_F
    proof_type: owner_pilot_judgment
    executable_evidence: "owner judges the business-condition assessment materially accurate for their real business"
    status: PENDING
    proof_artifacts: []

  S7-I7:
    name: Actionable owner guidance
    statement: >
      Recommendations must be specific, prioritized, financially and operationally
      relevant, feasible for the business, linked to evidence, explicit about
      assumptions and risks, and clear about what the owner should do next.
      Generic advice does not satisfy this invariant.
    proof_lane: LANE_F
    proof_type: owner_pilot_judgment
    executable_evidence: "owner accepts and acts on at least one recommendation in the pilot cycle"
    status: PENDING
    proof_artifacts: []

  S7-I8:
    name: Approval and execution boundary
    statement: >
      OpsIQ may prepare, recommend and stage actions, but execution requiring owner
      approval must not occur without the recorded approval.
      Prove at least one real governed transition from recommendation through approval,
      execution tracking and outcome recording.
    proof_lane: LANE_F
    proof_type: owner_pilot_governed_transition
    executable_evidence: "at least one recommendation → approval → execution tracking → outcome record observed in pilot"
    status: PENDING
    proof_artifacts: []

  S7-I9:
    name: Adaptive re-evaluation
    statement: >
      A material new fact, failed action, changed KPI, stale approval or conflicting
      priority must cause the appropriate re-evaluation.
      The system must preserve historical state and explain why the recommendation or
      priority changed.
    proof_lane: LANE_F
    proof_type: owner_pilot_re_evaluation
    executable_evidence: "re-evaluation triggered and recorded after a real material change during owner pilot; historical state preserved"
    status: PENDING
    proof_artifacts: []

  S7-I10:
    name: Audit and provenance completeness
    statement: >
      Material owner decisions, approvals, executions, state transitions, provider
      actions and outcome records must be attributable to: workspace, actor, time,
      source evidence, affected record, and result.
      Protected raw payloads must not be copied into audit records.
    # AMENDMENT A3 (2026-08-02): proof_lane corrected from LANE_E to LANE_C+LANE_E.
    # The declared proof_type has always required a production audit inspection, which
    # LANE_E (isolated simulation) cannot supply. The lane label contradicted the proof
    # type; the proof type was correct. No scope change — this is a label correction and
    # required no owner decision.
    proof_lane: LANE_C+LANE_E
    proof_type: simulation_and_production_audit_check
    executable_evidence: "audit records for pilot transitions inspected; all six attribution fields present; no raw payload copied into audit record"
    status: PENDING
    proof_artifacts: []

  S7-I11:
    name: Safe degraded and failure behavior
    statement: >
      Prove, in staging or an isolated simulation environment:
      required database unavailable; optional provider unavailable; malformed input;
      duplicate request; stale approval; concurrent action; downstream timeout;
      invalid authorization; cross-tenant request.
      The system must fail safely, visibly and recoverably in all nine scenarios.
      Do not deliberately disconnect or damage the production database.
    proof_lane: LANE_E
    proof_type: simulation_adversarial
    executable_evidence: "nine failure scenarios simulated in isolated environment; each fails safely, visibly, and recoverably"
    # AMENDMENT A16 (2026-09-04): demoted PROVEN -> PENDING under D-17. See A16 below.
    # evd_147fce5b18cdeeebf9d9b0b9778b8f06 remains append-only historical evidence; it
    # describes D-16's subject (789768b9), which neither D-17's nor D-18's (see A18)
    # SINGLE_ACTIVE_SUBJECT policy authorizes. It is not deleted, edited, or resigned.
    status: PENDING
    proof_artifacts: []

  S7-I12:
    name: Operational recovery
    statement: >
      A designated operator must successfully use the shipped runbooks to diagnose and
      recover from at least one staged deployment or dependency failure without an
      undocumented step.
      Record recovery time, decisions and deviations.
    proof_lane: LANE_E
    proof_type: simulation_runbook_recovery
    executable_evidence: "staged failure introduced; docs/DEPLOYMENT_RUNBOOK.md followed; recovery confirmed without undocumented steps; recovery time recorded"
    status: PENDING
    proof_artifacts: []

  S7-I13:
    name: Built-in operational usability
    statement: >
      The owner must complete a full OpsIQ operating cycle without developer,
      repository or Claude Code assistance:
        enter or import business data
          → review condition assessment
          → understand prioritized recommendation
          → approve or reject action
          → record execution
          → record outcome
          → review re-evaluation
      The owner may use only the deployed OpsIQ interface and built-in product guidance.
    proof_lane: LANE_F
    proof_type: owner_unaided_cycle
    executable_evidence: "owner completes full cycle unaided; completion time, points of confusion, and blocked steps recorded"
    status: PENDING
    proof_artifacts: []

  S7-I14:
    name: Feedback and learning-loop capture
    statement: >
      The pilot must record: whether advice was accepted; why accepted or rejected;
      execution status; actual result; owner usefulness score; accuracy score;
      missing-context feedback; and correction made if any.
      The system must preserve this feedback for future improvement without silently
      rewriting historical evidence.
    proof_lane: LANE_F
    proof_type: owner_pilot_feedback_record
    executable_evidence: "feedback record present for at least one pilot cycle with all required fields; historical evidence unchanged on re-inspection"
    # AMENDMENT A6 (2026-08-02, owner decision D-6 option a): the eight required fields
    # are bound to concrete columns and routes by the annex below. Owner accepted that
    # the existing schema is sufficient; no new persisted fields are required.
    # The annex records that three of the eight fields have no dedicated column and are
    # satisfied by a documented free-text convention. Read the annex before claiming
    # this invariant proven.
    field_mapping_annex: docs/opsiq/evidence/stage-7/s7-i14-field-mapping.md
    status: PENDING
    proof_artifacts: []

  S7-I15:
    name: Measurable real outcome
    statement: >
      At least one real intervention must progress through a measurement period
      appropriate to that intervention.
      Record: baseline, expected outcome, action taken, measurement window, actual
      outcome, variance, and owner interpretation.
      Do not impose an arbitrary fixed pilot duration. The measurement window must
      be appropriate to the chosen business intervention.
    proof_lane: LANE_F
    proof_type: owner_pilot_outcome
    executable_evidence: "baseline, expected, actual, variance, and owner interpretation all recorded for at least one real intervention"
    # AMENDMENT A5 (2026-08-02): the absence of a fixed measurement window is DELIBERATE
    # and must never be read as an omission to be filled in. The window is declared by
    # the owner when the pilot intervention is selected (owner decision D-7, deferred by
    # design). Because the window is owner-declared, no Stage 7 closure date can be
    # computed in advance. Clarification only — no scope change, no owner decision.
    measurement_window: intentional_open_parameter
    measurement_window_owner_decision: D-7
    status: PENDING
    proof_artifacts: []

  S7-I16:
    name: Unrestricted private-owner acceptance
    statement: >
      After all blocking Stage 7 evidence is complete, the owner must explicitly
      decide whether OpsIQ is ready for unrestricted private owner use.
      Public SaaS readiness and commercial billing are separate decisions not
      included in this acceptance gate.
    proof_lane: OWNER_ACCEPTANCE
    proof_type: owner_explicit_acceptance
    executable_evidence: "owner issues: FACTORY_STAGE_7_ACCEPTED"
    status: PENDING
    proof_artifacts: []

acceptance_criteria:
  - "S7-I1: deployed SHA matches authorized candidate; production health probe returns 200"
  - "S7-I2: all migrations applied to production-equivalent DB; zero pending migrations"
  - "S7-I3: deployment-preflight exits 0 against live environment"
  - "S7-I4: owner login, logout, session expiry, and unauthorized-user rejection confirmed on production"
  - "S7-I5: cross-workspace rejection confirmed; zero secrets in owner-visible output"
  - "S7-I6: owner judges business-condition assessment materially accurate from real data"
  - "S7-I7: owner accepts and acts on at least one recommendation in the pilot"
  - "S7-I8: at least one governed recommendation → approval → execution tracking → outcome record cycle complete"
  - "S7-I9: adaptive re-evaluation triggered and recorded after real material change"
  - "S7-I10: all six attribution fields present in audit records; no raw payload copied into audit"
  - "S7-I11: nine adversarial failure scenarios all fail safely in isolated simulation"
  - "S7-I12: staged failure recovered using runbook without undocumented steps"
  - "S7-I13: owner completes full unaided operating cycle (Gate A)"
  - "S7-I14: feedback record present with all required fields; historical evidence intact"
  - "S7-I15: intervention outcome recorded with baseline, variance, owner interpretation (Gate B)"
  - "S7-I16: owner issues FACTORY_STAGE_7_ACCEPTED"

exclusions:
  BILLING_EXCLUDED: "Stripe live payments, Lemon Squeezy activation, subscription entitlement purchase, and external paying customer billing are excluded from Stage 7 acceptance. Billing work requires separate owner authorization after private-owner acceptance."
  PUBLIC_SAAS_EXCLUDED: "Public SaaS launch, public self-registration, and external paying customers are not in Stage 7 scope."
  RESEND_CONDITIONAL: "If Resend credentials unavailable, records LIVE_PROVIDER_OPERATION_DEFERRED_CREDENTIAL_UNAVAILABLE. Does not block Stage 7 unless email is essential to the selected pilot workflow."
  LIVE_CONNECTOR_CONDITIONAL: "External connector proof (HubSpot, QuickBooks, Google Sheets) deferred unless credentials exist and use materially reduces pilot data-entry work."
  LIVE_DESTRUCTIVE_FAULT_EXCLUDED: "No live destructive fault injection on production infrastructure. All adversarial scenarios run in isolated staging workspace."
  DEPLOYMENT_CONTINGENT: "Live deployment proof contingent on Vercel project access and production domain configuration being available."

simulation_domains:
  - finance_and_cash
  - revenue_and_sales
  - marketing
  - customers_and_retention
  - suppliers
  - operations_and_capacity
  - workforce
  - assets_and_maintenance
  - risks_and_compliance
  - opportunities_and_growth
  - startup_new_business_mode
  - cross_domain_shocks_and_conflicting_priorities

owner_pilot:
  gate_a: "Built-in operational usability — owner completes one full unaided operating cycle (S7-I13)"
  gate_b: "Outcome validation — at least one real intervention with measurable baseline, approved execution, and recorded result within appropriate measurement window (S7-I15)"
  note: "Owner may accept operational usability (Gate A) before the outcome measurement period ends. Final unrestricted-readiness acceptance (S7-I16) requires Gate B evidence or explicit owner decision that chosen evidence is sufficient."

environment_model:
  production_private_owner:
    purpose: "Owner login, real business data, real recommendations, approved execution tracking, real outcome recording, owner acceptance"
  staging_or_isolated_simulation:
    purpose: "Synthetic domain simulations, adversarial cases, malformed inputs, concurrency, dependency failures, recovery exercises"
    constraint: "Do not contaminate production owner workspace with destructive or synthetic failure scenarios"
  repository_ci:
    purpose: "Regression tests and fixes only"

gates:
  completion_factory: scripts/validate-bundle-manifests.mjs
  stage_acceptance_integrity: scripts/validate-stage-acceptance.mjs --mode integrity --stage factory-7

# AMENDMENT A8 (2026-08-02): governance note on what the gates above do and do not prove.
# Clarification only — no scope change, no owner decision.
gate_semantics:
  integrity_mode_is_not_progress: >
    scripts/validate-stage-acceptance.mjs --mode integrity exits 0 while every invariant
    is PENDING. That is its designed behaviour: integrity mode only rejects a CLOSED
    bundle carrying null evidence. A passing integrity gate is NOT evidence of Stage 7
    progress and must never be cited as such in any status record, commit message, or
    acceptance claim.
  four_fields_do_not_prove_the_stage: >
    pr_sha, merge_sha, main_integration_run and db_verification_run prove only that a
    pull request merged and that CI ran. They prove nothing about owner deployment,
    pilot execution, or unrestricted readiness. See closure_conditions below.

# AMENDMENT A7 (2026-08-02, owner decision D-5 option b): Stage 7 closure requires FIVE
# conditions, not four. Prior to this amendment no validator read the invariant block at
# all, so this bundle could be marked CLOSED with four identifiers filled in while all
# sixteen invariants remained PENDING with empty proof_artifacts, and both gates would
# exit 0. Condition 5 closes that hole.
#
# ENFORCEMENT STATUS: declarative only in PR-1A. PR-1B implements the validator logic.
# Until PR-1B merges, condition 5 is binding on the owner and on any agent operating in
# this repository, but is NOT machine-enforced. Do not mark this bundle CLOSED before
# PR-1B lands.
closure_conditions:
  1_pr_sha: "required_evidence.pr_sha is non-null"
  2_merge_sha: "required_evidence.merge_sha is non-null"
  3_main_integration_run: "required_evidence.main_integration_run is non-null"
  4_db_verification_run: "required_evidence.db_verification_run is non-null"
  5_invariant_proof: >
    Every invariant S7-I1 through S7-I16 carries status: PROVEN with at least one
    non-empty proof_artifacts entry, OR an explicit owner waiver recorded under
    invariant_waivers below. A waiver must name the invariant, the owner, the date,
    and the reason. A waiver is never a default and is never implied by silence.
  enforced_by: "scripts/validate-stage-acceptance.mjs --mode closure --stage factory-7 (logic pending PR-1B)"

# Explicit owner waivers against condition 5. Empty means no invariant has been waived.
invariant_waivers: []

