invariants:
  I1_tenant_isolation: |
    A workspace or business must never read, update, route or infer another
    workspace's connector, integration event, token metadata, BCP, consulting
    engagement, finding, recommendation, action, outcome, or audit record.
  I2_canonical_authorization: |
    All owner, connector and consulting routes must use the repository's canonical
    authentication and capability enforcement. No forgeable workspace headers,
    legacy wrappers or unregistered capabilities.
  I3_secret_and_dto_boundary: |
    Secrets, token values, raw provider payloads and internal input-fact JSON must
    not appear in public DTOs, logs, audit payloads or client-facing consulting exports.
  I4_event_integrity: |
    Integration events must have validated source connector, workspace and business
    ownership, event type, payload contract, idempotency identity, and processing status.
    Duplicate processing must not create duplicate business effects.
  I5_deterministic_routing: |
    The same accepted event and current domain state must route consistently.
    Unsupported events must fail closed or enter an explicit rejected/unhandled state.
    They must not silently mutate unrelated domains.
  I6_bcp_historical_integrity: |
    Reassessment must preserve historical profiles, maintain one valid current profile
    and emit the required audit event. Concurrent reassessments must not create an
    invalid multi-current state.
  I7_consulting_fsm_integrity: |
    Invalid consulting lifecycle transitions must fail. Repeated requests must be
    idempotent where required. Concurrent mutations must not corrupt engagement state.
  I8_role_and_representation_boundary: |
    Owner, consultant, client and operator representations must expose only their
    authorized fields and actions. A consulting export must not expose internal-only
    reasoning, credentials, cross-tenant data or prohibited operational metadata.
  I9_audit_completeness: |
    Every material mutation in the approved Stage 5 chain must produce a
    workspace-scoped audit event with sufficient identifiers to reconstruct what
    occurred without leaking protected payloads.
  I10_transaction_safety: |
    Multi-write mutations must be atomic where partial completion would leave an
    invalid business state. Failure must roll back or leave an explicit recoverable state.
  I11_failure_handling: |
    Provider failure, malformed event, stale state, missing connector, superseded
    business state and retry exhaustion must produce deterministic outcomes.
    No failure may be represented as successful processing.
  I12_owner_useful_outcome: |
    The representative chain must end in an actionable, persisted owner result —
    not only an internal event or test mock.

acceptance_criteria:
  - All twelve invariants I1-I12 have executable evidence.
  - Integration event ingestion enforces workspace isolation (cross-tenant attempt fails with not-found).
  - Connector registration is idempotent (same workspace+provider returns existing).
  - Token values never appear in any public connector DTO.
  - BCP reassessment triggered by integration event preserves historical profile.
  - Concurrent BCP reassessments do not produce multi-current profile state.
  - Invalid consulting lifecycle transitions fail with correct error.
  - Concurrent consulting mutations do not corrupt engagement state.
  - Consulting export contains no internal-only fields, cross-tenant data, or credentials.
  - All material Stage 5 mutations emit workspace-scoped audit events.
  - Representative operational chain (event → BCP → consulting) produces persisted owner result.
  - Canonical auth and capability enforcement verified on all Stage 5 routes.
  - Non-DB CI green on exact PR HEAD.
  - PostgreSQL LANE_B green on exact PR HEAD where database behavior claimed.
  - Bundle and Factory Stage manifest validation green.
  - Governance, auth, and recurrence scanners green.
  - Factory Stage 6 has not begun.
  - No Stage 3 or Stage 4 accepted work reopened without executable evidence.

