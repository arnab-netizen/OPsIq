closure_rules:
  - All acceptance criteria satisfied with executable evidence.
  - PR HEAD must be exact-SHA authorized by owner before merge.
  - Ledger entry for factory-stage-5 must be updated with pre-merge status
    IMPLEMENTED_OR_PROVEN_PRE_MERGE_AWAITING_MERGE before merge authorization is requested.
  - Post-merge evidence fields must be populated only after actual merge.
  - Factory Stage 5 must not be self-accepted by automated processes.

rollback_failure_rules:
  - If any invariant has no executable evidence, the stage is not closed.
  - If the representative chain fails in CI, the defect must be fixed before merge authorization.
  - If a non-DB gate fails, fix from root cause; do not weaken auth, workspace enforcement, or DTO redaction.
  - If a DB gate (LANE_B) fails, fix from root cause; mocked concurrency tests do not substitute for real PostgreSQL proof.

owner_acceptance_boundary:
  - Owner acceptance is a separate event after merge and post-merge CI confirmation.
  - This contract does not self-accept Factory Stage 5.
  - Owner must issue explicit Factory Stage 5 acceptance after reviewing post-merge evidence.

