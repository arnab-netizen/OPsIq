description: |
  Authoritative Factory Stage 5 closure contract.

  Approved purpose: Prove that external operational information can enter OpsIQ
  through its Integration Fabric, remain isolated and secure, update the correct
  business condition state, flow into Consulting Operations where appropriate,
  and result in deterministic, auditable, owner-usable operational outcomes.

  This contract does not authorize rebuilding Integration Fabric or Consulting Mode.
  It reuses capabilities delivered through internal delivery bundle groups 5 and 6.
  Deployment Readiness is excluded and reserved for Factory Stage 6.

  Internal delivery bundle groups 5, 6, and 7 retain their classification as
  internal delivery bundles (factory_stage_acceptance: NOT_APPLICABLE). They are
  not Factory Stage 5, 6, or 7 milestones.

approved_business_outcome: |
  Owner has proof that:
  - External connectors can be registered, authorized, and isolated per tenant.
  - Integration events are validated, ingested, and routed deterministically.
  - Permitted events trigger correct BCP reassessments without leaking raw payloads.
  - Consulting engagements can be created, progressed, and closed with enforced boundaries.
  - The full integration-to-consulting operational chain produces a persisted,
    auditable, owner-visible result.
  - All twelve invariants I1-I12 have executable evidence.

included_systems:
  integration_fabric:
    - connector contracts and public DTO boundary
    - connector registry lifecycle (register, disconnect, list, get, markRefreshFailed)
    - connector authorization and tenant ownership enforcement
    - token/credential handling boundary (tokens never returned in public DTOs)
    - integration-event ingestion and validation
    - event normalization and idempotency
    - event routing into permitted OpsIQ domains
    - integration audit records

  business_condition_linkage:
    - permitted integration event → BCP reassessment trigger
    - correct workspace and business targeting
    - deterministic trigger classification (mapIntegrationEventToBcpTrigger)
    - historical BCP profile preservation
    - no raw private integration payload in public DTOs

  consulting_operations:
    - consulting engagement creation and lifecycle (DISCOVERY → DIAGNOSIS → IMPLEMENTATION → REVIEW)
    - findings, recommendations, actions, and outcomes
    - engagement FSM enforcement (invalid transitions fail)
    - consultant/client/owner data boundaries (DTO redaction)
    - owner-authorized execution paths
    - consulting audit records

  cross_domain_operational_chain:
    - At least one representative executable chain:
        connector or integration event
        → validated tenant-safe ingestion
        → correct BCP reassessment or signal
        → permitted consulting engagement context/update
        → owner-visible operational result
        → persisted audit evidence

explicit_exclusions:
