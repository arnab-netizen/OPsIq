# Stage 7 Evidence Signing Key Registry
#
# Maps key_id → Ed25519 public key (SPKI DER, base64-encoded).
# Loaded by the validator from this exact path. No runtime path override is accepted.
#
# Key lifecycle:
#   pending_owner_provisioning — public key not yet committed. Owner must generate the key
#                               pair OFFLINE (never inside Claude Code or any AI assistant)
#                               and commit only the public_key_spki_der_base64 here.
#   active                    — public key committed; private key held ONLY as a GitHub
#                               Actions secret (EVIDENCE_SIGNING_KEY). Never committed.
#   revoked                   — public key retained for audit trail; artifacts signed with
#                               this key are treated as INVALID by the validator.
#
# SECURITY INVARIANTS:
#   1. Private keys MUST NEVER be committed to any branch, PR, or CI log.
#   2. Generate offline with: node -e "const {generateKeyPairSync}=require('crypto');
#      const {privateKey,publicKey}=generateKeyPairSync('ed25519',{
#        privateKeyEncoding:{type:'pkcs8',format:'pem'},
#        publicKeyEncoding:{type:'spki',format:'der'}});
#      console.log(publicKey.toString('base64'));
#      console.log(privateKey);"
#      Store the privateKey output as secret EVIDENCE_SIGNING_KEY in GitHub.
#      Commit only the base64 public key output here.
#   3. The MANDATORY SECURITY INCIDENT declared in PR-A prohibits use of the key pair
#      previously disclosed outside the GitHub secret boundary. That key pair is
#      permanently compromised and must never be committed or provisioned.

version: "1"
keys:
  - key_id: "stage7-evidence-v1"
    algorithm: "Ed25519"
    status: "active"
    note: >
      Production signing key for Stage 7 evidence artifacts.
      AUTH_SHA model: the capture workflow reads this registry from the AUTH_SHA
      commit (origin/main HEAD at capture time), NOT from the checked-out working
      tree (INF_SHA). The public key therefore does NOT need to exist at INF_SHA.
      Owner provisioning sequence after PR-A merges:
        1. Generate the key pair OFFLINE (never inside Claude Code or any AI assistant).
        2. Commit only the public_key_spki_der_base64 value below as a governance-only
           commit directly on main (no PR required — this commit becomes AUTH_SHA).
        3. Tag the INF_SHA commit as stage7-evidence-subject-<tag> to unlock the
           GitHub Environment stage7-evidence-signing for the capture workflow.
        4. Provision the private key as GitHub Actions secret EVIDENCE_SIGNING_KEY
           in the stage7-evidence-signing environment.
        5. Provision DISPATCH_TOKEN (fine-grained PAT, contents:write on this repo)
           as a repository secret so the capture workflow can fire repository_dispatch.
      Artifacts captured before provisioning are permanently UNVERIFIED and cannot
      back a PROVEN invariant.
    public_key_spki_der_base64: "MCowBQYDK2VwAyEAUz2VS2kBVF1PhY7HXBFyohGspFRfuq1p/HTjZAiUS/U="
    added_by: "arnab-netizen"
    not_before: "2026-09-01"
